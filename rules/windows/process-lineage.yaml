id: win-browser-spawns-shell
title: Web browser started a command shell, script host or LOLBin
description: >-
  Internet Explorer, Edge, Chrome, Firefox, Opera, Brave or Vivaldi started cmd, wscript, cscript,
  mshta, rundll32, regsvr32, certutil, bitsadmin, schtasks, wmic or a .NET or installer LOLBin. A
  browser exploit (a Flash or scripting-engine bug in the tab process) runs its shellcode inside the
  browser, and its first move is to start one of these; the same lineage appears when a user opens a
  downloaded .bat, .js, .vbs or .hta from the download bar, the usual end of a phishing or
  HTML-smuggling chain. PowerShell as the child is left to the Sigma rule "Suspicious PowerShell
  Parent Process". Excluded: the cmd.exe wrapper Chromium browsers use to start extension
  native-messaging hosts, and the rundll32 calls behind the Internet Options and proxy dialogs,
  clear-history, Open With, connection diagnostics and ClickOnce launches. Benign causes left: a user
  deliberately running a downloaded batch or script file (developers, IT staff), a legacy intranet
  application in Internet Explorer (or Edge's IE mode) that starts local programs through
  WScript.Shell, and a custom URL protocol whose handler is a script; read the command line and the
  file it names.
severity: high
source: events
attack: [T1189, T1203, T1204.002]
tags: [execution, initial-access, browser, process-lineage]
entities: [computer, parentImage, parentProcessName, image, processName, commandLine, user]
where:
  any_of:
    - { eventId: 4688 }
    - { eventId: 1, provider|contains: Sysmon }
  any_of_2:
    - { parentImage|endswith: ["\\iexplore.exe", "\\chrome.exe", "\\firefox.exe", "\\msedge.exe", "\\microsoftedge.exe", "\\microsoftedgecp.exe", "\\opera.exe", "\\brave.exe", "\\vivaldi.exe"] }
    - { parentProcessName|endswith: ["\\iexplore.exe", "\\chrome.exe", "\\firefox.exe", "\\msedge.exe", "\\microsoftedge.exe", "\\microsoftedgecp.exe", "\\opera.exe", "\\brave.exe", "\\vivaldi.exe"] }
  # the child: image on Sysmon 1, processName on 4688
  any_of_3:
    - { image|endswith: ["\\cmd.exe", "\\wscript.exe", "\\cscript.exe", "\\mshta.exe", "\\rundll32.exe", "\\regsvr32.exe", "\\certutil.exe", "\\bitsadmin.exe", "\\schtasks.exe", "\\wmic.exe", "\\msbuild.exe", "\\installutil.exe", "\\regasm.exe", "\\regsvcs.exe", "\\cmstp.exe", "\\forfiles.exe"] }
    - { processName|endswith: ["\\cmd.exe", "\\wscript.exe", "\\cscript.exe", "\\mshta.exe", "\\rundll32.exe", "\\regsvr32.exe", "\\certutil.exe", "\\bitsadmin.exe", "\\schtasks.exe", "\\wmic.exe", "\\msbuild.exe", "\\installutil.exe", "\\regasm.exe", "\\regsvcs.exe", "\\cmstp.exe", "\\forfiles.exe"] }
  not:
    commandLine|contains: ["chrome-extension://", "chrome.nativeMessaging", "moz-extension://", "NativeMessagingHosts", "inetcpl.cpl", "shell32.dll,OpenAs_RunDLL", "dfshim.dll,ShOpenVerbApplication", "ndfapi.dll,NdfRunDllDiagnoseWithAnswerFile"]
