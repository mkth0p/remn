# Process lineage: who started whom, as whom and from where (service hosts, browsers, the spooler, accessibility binaries, renamed LOLBins, processes that should not listen).
id: win-eventlog-service-crash
title: Windows Event Log service crashed
description: >-
  WerFault.exe started by the svchost instance that hosts the Event Log service ("-s EventLog" on
  its command line, Windows 10 1703 and later, where services get their own host), or the Service
  Control Manager reporting that the Windows Event Log service terminated unexpectedly (7031 / 7034).
  Crashing the service on purpose (malformed EventLog RPC calls, thread killing that goes wrong)
  stops all logging until it restarts, and after the third crash the recovery policy leaves it
  stopped, so the crash is often the only trace of the tampering; two crashes minutes apart are not
  a coincidence. Benign cause: a genuine crash of the service (a corrupted log file, a misbehaving
  log collector), which is rare and worth a look anyway. On older Windows the service shares its
  svchost with other services, so a WerFault there cannot be attributed to it and is not counted.
severity: high
source: events
attack: [T1562.002]
tags: [defense-evasion, log-tampering, process-lineage]
entities: [computer, commandLine, parentCommandLine, serviceName]
where:
  any_of:
    - eventId: 1
      provider|contains: Sysmon
      image|endswith: "\\werfault.exe"
      parentImage|endswith: "\\svchost.exe"
      parentCommandLine|contains: "-s eventlog"
    - eventId|in: [7031, 7034]
      provider|contains: Service Control Manager
      any_of:
        - { serviceName|in: ["Windows Event Log", "EventLog"] }
        # the Binary field carries the service key name in UTF-16 hex, whatever the display language:
        # "EventLog/" followed by a code, or "EventLog" and its terminating NUL
        - { data.Binary|startswith: ["4500760065006E0074004C006F0067002F00", "4500760065006E0074004C006F0067000000"] }
---
id: win-spoolsv-unexpected-child
title: Print spooler started a program that is not a print component
description: >-
  spoolsv.exe, which runs as SYSTEM, started a process that is neither a print component
  (splwow64, PrintIsolationHost, the XPS filter pipeline host), an error reporter, a program of an
  installed printer driver (the spool\drivers architecture folders, the driver store, Program Files),
  a driver package installed from a local MSI, nor one of the shells and admin tools the Sigma rule
  "Suspicious Spool Service Child Process" already reports. The spooler has no reason to start
  ordinary Windows programs such as notepad, so a child like that is the payload of code running
  inside the spooler: shellcode injected into it (Odzhan's spooler injection) or a malicious print
  driver or port monitor DLL (PrintNightmare), and the payload runs as SYSTEM. spool\drivers\color is
  writable by every user, so it is not treated as a driver folder. Benign causes: a vendor's
  printer helper installed outside Program Files and the driver folders, or a print-to-file port
  monitor (RedMon style) that runs a converter from its own folder; check the child's path and
  signer.
severity: high
source: events
attack: [T1055, T1068]
tags: [privilege-escalation, injection, print-spooler, process-lineage]
entities: [computer, image, processName, commandLine, user]
where:
  any_of:
    - { eventId: 4688 }
    - { eventId: 1, provider|contains: Sysmon }
  any_of_2:
    - { parentImage|endswith: "\\spoolsv.exe" }
    - { parentProcessName|endswith: "\\spoolsv.exe" }
  # the child: image on Sysmon 1, processName on 4688
  any_of_3:
    - image|exists: true
      image|not_contains: ["\\spool\\drivers\\x64\\", "\\spool\\drivers\\w32x86\\", "\\spool\\drivers\\arm64\\", "\\driverstore\\filerepository\\", ":\\program files\\", ":\\program files (x86)\\"]
      image|not_endswith: ["\\splwow64.exe", "\\printisolationhost.exe", "\\printfilterpipelinesvc.exe", "\\spoolsv.exe", "\\conhost.exe", "\\werfault.exe", "\\werfaultsecure.exe", "\\wermgr.exe", "\\route.exe", "\\gpupdate.exe", "\\whoami.exe", "\\nltest.exe", "\\taskkill.exe", "\\wmic.exe", "\\taskmgr.exe", "\\sc.exe", "\\findstr.exe", "\\curl.exe", "\\wget.exe", "\\certutil.exe", "\\bitsadmin.exe", "\\accesschk.exe", "\\wevtutil.exe", "\\bcdedit.exe", "\\fsutil.exe", "\\cipher.exe", "\\schtasks.exe", "\\write.exe", "\\wuauclt.exe", "\\systeminfo.exe", "\\reg.exe", "\\query.exe", "\\net.exe", "\\net1.exe", "\\cmd.exe", "\\netsh.exe", "\\powershell.exe", "\\pwsh.exe"]
    - processName|exists: true
      processName|not_contains: ["\\spool\\drivers\\x64\\", "\\spool\\drivers\\w32x86\\", "\\spool\\drivers\\arm64\\", "\\driverstore\\filerepository\\", ":\\program files\\", ":\\program files (x86)\\"]
      processName|not_endswith: ["\\splwow64.exe", "\\printisolationhost.exe", "\\printfilterpipelinesvc.exe", "\\spoolsv.exe", "\\conhost.exe", "\\werfault.exe", "\\werfaultsecure.exe", "\\wermgr.exe", "\\route.exe", "\\gpupdate.exe", "\\whoami.exe", "\\nltest.exe", "\\taskkill.exe", "\\wmic.exe", "\\taskmgr.exe", "\\sc.exe", "\\findstr.exe", "\\curl.exe", "\\wget.exe", "\\certutil.exe", "\\bitsadmin.exe", "\\accesschk.exe", "\\wevtutil.exe", "\\bcdedit.exe", "\\fsutil.exe", "\\cipher.exe", "\\schtasks.exe", "\\write.exe", "\\wuauclt.exe", "\\systeminfo.exe", "\\reg.exe", "\\query.exe", "\\net.exe", "\\net1.exe", "\\cmd.exe", "\\netsh.exe", "\\powershell.exe", "\\pwsh.exe"]
  not:
    any_of:
      # a driver's own DLL run through rundll32, printui or the PrintConfig registration
      - commandLine|contains: ["\\spool\\drivers\\x64\\", "\\spool\\drivers\\w32x86\\", "\\spool\\drivers\\arm64\\", "\\driverstore\\filerepository\\", "printui.dll", "printconfig.dll"]
      # a driver package from a local MSI; msiexec fetching a package from a URL or a share still counts
      - any_of:
          - { image|endswith: "\\msiexec.exe" }
          - { processName|endswith: "\\msiexec.exe" }
        commandLine|not_contains: ["http:", "https:", "\\\\"]
