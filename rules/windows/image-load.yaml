# Image loads (Sysmon 7): DLL hijacks and proxy loads into Windows processes, RDP control hosting, tampered process images; plus the process-access, named-pipe and file-time rules reviewed with them.
id: win-system-process-unsigned-dll
title: Windows system process loads an unsigned DLL (DLL hijack, phantom DLL, proxy load)
description: A program that lives in System32, SysWOW64 or another Windows folder loads an unsigned DLL from anywhere except Program Files. That can be the system folders themselves, a user-writable folder such as ProgramData, Users or Temp, or a network share. Every DLL that Windows ships is signed, so an unsigned DLL inside a service host (svchost, fxssvc, wermgr), an auto-elevating binary (sysprep, cliconfg, migwiz, consent), wuauclt or lsass is almost always a planted file. This is how a service DLL or phantom DLL hijack runs code as SYSTEM (Update Session Orchestrator, CDPSvc, Fax), how a UAC bypass runs code at high integrity, and how wuauclt /UpdateDeploymentProvider proxies a payload. A copy of Windows in a folder whose name ends with a space ("C:\Windows \System32", the mock trusted folder trick) counts as a Windows folder. Some DLLs are left out. These are DLLs from Program Files, the .NET global assembly cache and native images, the .NET Framework folder, Windows Installer custom actions, WinSxS, the driver store and print drivers. Some processes are left out as well. Vendor programs that only sit under System32 are not Windows binaries and are left out. These are driver services in the driver store, and apps installed per user for SYSTEM or a service account under config\systemprofile or ServiceProfiles. rundll32 and regsvr32 are covered by a Sigma rule. PowerShell, the PowerShell remoting host, the troubleshooting host (sdiagnhost) and the UWP background task host are left out because they load generated or app assemblies. The IIS worker (w3wp) loads web application DLLs, and the device installer (drvinst) loads co-installers. msiexec, dllhost, dism and the spooler are left out too. The phantom DLLs that the Sigma phantom-DLL rule already names in System32 are left to that rule. Known benign causes are old vendor software that copies unsigned DLLs into System32 (network providers, IMEs, credential providers, CSPs, WMI providers), in-house COM components used by cscript, wscript or mmc, per-user shell extensions loaded into a file dialog, and database client DLLs loaded by MSDTC. Allow-list such a file by path once it is identified. One finding per host, process and DLL per day.
severity: high
source: events
attack: [T1574.001, T1548.002, T1218]
tags: [defense-evasion, privilege-escalation, persistence, dll-hijack]
entities: [computer, image, imageLoaded]
where:
  eventId: 7
  provider|contains: Sysmon
  signed|in: [false, "false", "False"]
  image|contains: [":\\windows\\system32\\", ":\\windows\\syswow64\\", ":\\windows\\ehome\\", "\\windows \\"]
  # vendor programs that only live under System32: driver services from the driver store, and per-user apps installed for SYSTEM or a service account
  image|not_contains: ["\\driverstore\\", "\\config\\systemprofile\\", "\\serviceprofiles\\"]
  image|not_endswith: ["\\rundll32.exe", "\\regsvr32.exe", "\\msiexec.exe", "\\dllhost.exe", "\\powershell.exe", "\\powershell_ise.exe", "\\wsmprovhost.exe", "\\sdiagnhost.exe", "\\backgroundtaskhost.exe", "\\w3wp.exe", "\\drvinst.exe", "\\spoolsv.exe", "\\printisolationhost.exe", "\\splwow64.exe", "\\dism.exe", "\\dismhost.exe"]
  imageLoaded|not_contains: ["\\program files\\", "\\program files (x86)\\", "\\windows\\assembly\\", "\\microsoft.net\\", "\\windows\\installer\\", "\\winsxs\\", "\\driverstore\\", "\\spool\\drivers\\"]
  imageLoaded|not_endswith: [":\\windows\\system32\\axeonoffhelper.dll", ":\\windows\\system32\\cdpsgshims.dll", ":\\windows\\system32\\oci.dll", ":\\windows\\system32\\offdmpsvc.dll", ":\\windows\\system32\\shellchromeapi.dll", ":\\windows\\system32\\tsmsisrv.dll", ":\\windows\\system32\\tsvipsrv.dll", ":\\windows\\system32\\wbem\\wbemcomn.dll", ":\\windows\\system32\\wlbsctrl.dll", ":\\windows\\system32\\wow64log.dll", ":\\windows\\system32\\wptsextensions.dll"]
group_by: [computer, image, imageLoaded]
window: 1d
threshold: ">= 1"
---
id: win-rdp-activex-unusual-host
title: RDP client control loaded by a program that is not an RDP client (SharpRDP-style lateral movement)
description: The Remote Desktop ActiveX control is loaded by a program outside Program Files that is not a known RDP client, or by a script host. The control is mstscax.dll, or its .NET interop AxInterop.MSTSCLib.dll, Interop.MSTSCLib.dll or MSTSCLib.dll. Tools such as SharpRDP embed this control to log on to another host over RDP and type a command into the session without opening mstsc. The finding therefore names the tool on the source side of RDP lateral movement. SharpRDP started with its computername= and command= arguments is also matched. Benign causes are portable or in-house RDP managers run from a user folder. RDCMan, mRemoteNG, Royal TS, Remote Desktop Manager, Terminals and MobaXterm are excluded by name. So are the Windows programs that host the control (mstsc, vmconnect, the Remote Desktops MMC snap-in, Windows Sandbox and Explorer).
severity: high
source: events
attack: [T1021.001]
tags: [lateral-movement, rdp, hacktool]
entities: [computer, image, imageLoaded, commandLine]
where:
  any_of:
    - eventId: 7
      provider|contains: Sysmon
      imageLoaded|endswith: ["\\mstscax.dll", "\\axinterop.mstsclib.dll", "\\interop.mstsclib.dll", "\\mstsclib.dll"]
      image|not_contains: ["\\program files\\", "\\program files (x86)\\", "\\windowsapps\\", "\\mobaxterm"]
      image|not_endswith: ["\\mstsc.exe", "\\vmconnect.exe", "\\mmc.exe", "\\explorer.exe", "\\windowssandbox.exe", "\\windowssandboxclient.exe", "\\windowssandboxremotesession.exe", "\\rdcman.exe", "\\mremoteng.exe", "\\royalts.exe", "\\remotedesktopmanager.exe", "\\remotedesktopmanager64.exe", "\\remotedesktopmanagerfree.exe", "\\terminals.exe", "\\msrdc.exe"]
      # a Windows binary hosting the control is left out, except a script host or LOLBin running a loaded tool
      not: { image|contains: [":\\windows\\system32\\", ":\\windows\\syswow64\\"], image|not_endswith: ["\\powershell.exe", "\\rundll32.exe", "\\regsvr32.exe", "\\mshta.exe", "\\wscript.exe", "\\cscript.exe", "\\cmd.exe"] }
    - any_of:
        - { eventId: 4688 }
        - { eventId: 1, provider|contains: Sysmon }
      any_of_2:
        - { originalFileName: SharpRDP.exe }
        - { commandLine|contains_all: ["computername=", "command="] }
group_by: [computer, image]
window: 10m
threshold: ">= 1"
