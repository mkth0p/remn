id: win-credential-dumping
title: Credential dumping indicators (LSASS access, ntds.dit, SAM)
description: Sysmon 10 on lsass.exe with dangerous access masks, procdump/comsvcs/mimikatz command lines, ESENT 325/327 (ntds.dit copy), vssadmin/ntdsutil/reg save usage, or 4663 on SAM/SECURITY hives.
severity: critical
source: events
attack: [T1003.001, T1003.002, T1003.003]
tags: [credential-access]
where:
  any_of:
    - { eventId: 10, provider|contains: Sysmon, targetImage|endswith: lsass.exe, grantedAccess|in: ["0x1010", "0x1410", "0x1438", "0x143a", "0x1fffff", "0x1f0fff", "0x1f1fff", "0x1f2fff", "0x1f3fff", "0x40", "0x1400", "0x1000", "0x1FFFFF", "0x1F0FFF", "0x1F1FFF"], sourceImage|not_contains: ["\\windows\\system32\\", "\\program files\\", "\\program files (x86)\\", "msmpeng", "csrss", "wininit", "wmiprvse", "taskmgr", "procexp", "vmtoolsd", "sysmon"] }
    - { eventId|in: [4688, 1], commandLine|contains: ["sekurlsa", "lsadump", "mimikatz", "procdump", "-ma lsass", "comsvcs.dll, MiniDump", "comsvcs.dll MiniDump", "rundll32.exe comsvcs", "ntdsutil", "ifm", "create full", "reg save hklm\\sam", "reg save hklm\\system", "reg save hklm\\security", "reg.exe save", "vssadmin create shadow", "wmic shadowcopy", "diskshadow", "esentutl /y", "esentutl.exe /y", "ntds.dit", "sam.hive", "system.hive", "lsass.dmp", "lsass.exe", "dumpert", "nanodump", "pypykatz", "lazagne", "sharpdump", "handlekatz", "dumpsec", "secretsdump", "invoke-mimikatz", "pwdump", "gsecdump", "wce.exe", "fgdump", "cachedump", "vaultcmd /list", "cmdkey /list", "rubeus", "kekeo"] }
    - { eventId|in: [325, 327], provider|contains: ESENT, any_of: [ { message|contains: ntds.dit }, { data|contains: ntds.dit }, { raw|contains: ntds.dit } ] }
    - { eventId: 4663, objectName|contains: ["\\config\\sam", "\\config\\security", "\\config\\system", "ntds.dit"], processName|not_contains: [lsass.exe, services.exe, svchost.exe] }
    - { eventId: 6155, provider|contains: LSA }
