id: win-lolbin-suspicious-commandline
title: Living-off-the-land binary with suspicious arguments
description: 4688 / Sysmon 1 - certutil, bitsadmin, mshta, regsvr32, rundll32, wmic, msiexec, cscript/wscript, curl, forfiles, installutil, msbuild, cmstp, odbcconf, regasm... used with URLs, decode, scrobj, javascript or remote paths.
severity: high
source: events
attack: [T1218, T1105, T1140]
tags: [execution, lolbin]
where:
  any_of:
    - { eventId: 4688 }
    - { eventId: 1, provider|contains: Sysmon }
  any_of_2:
    - { processName|endswith: certutil.exe, commandLine|contains: [-urlcache, -decode, -encode, -decodehex, -verifyctl, "http", "split", "-f "] }
    - { processName|endswith: bitsadmin.exe, commandLine|contains: [/transfer, /addfile, /create, /setnotifycmdline, /resume, "http"] }
    - { processName|endswith: mshta.exe, commandLine|contains: ["javascript:", "vbscript:", "http", ".hta", "about:"] }
    - { processName|endswith: regsvr32.exe, commandLine|contains: [scrobj.dll, /i:http, /u /n, "http", ".sct", "/s /i"] }
    - { processName|endswith: rundll32.exe, commandLine|contains: ["javascript:", "shell32.dll,Control_RunDLL", "url.dll,", "advpack.dll", "zipfldr.dll", "pcwutl.dll", "comsvcs.dll", "MiniDump", "\\temp\\", "\\appdata\\", "\\users\\public\\", "http", ".txt", ".dat", ".png", ".jpg"] }
    - { processName|endswith: wmic.exe, commandLine|contains: [process call create, /node:, "shadowcopy delete", "os get", "/format:", "http", "antivirusproduct", "product get"] }
    - { processName|endswith: msiexec.exe, commandLine|contains: ["http", "/q", "/quiet", "\\temp\\", "\\appdata\\", ".png", ".jpg", ".txt"] }
    - { processName|endswith: [cscript.exe, wscript.exe], commandLine|contains: ["\\temp\\", "\\appdata\\", "\\users\\public\\", "\\downloads\\", "//e:", "/e:", ".js", ".jse", ".vbs", ".vbe", ".wsf", "http"] }
    - { processName|endswith: [curl.exe, wget.exe], commandLine|contains: ["http", "-o ", "-O ", "--output"] }
    - { processName|endswith: [forfiles.exe, pcalua.exe, installutil.exe, msbuild.exe, cmstp.exe, odbcconf.exe, regasm.exe, regsvcs.exe, ieexec.exe, presentationhost.exe, xwizard.exe, control.exe, wuauclt.exe, mavinject.exe, msconfig.exe, ftp.exe, esentutl.exe, expand.exe, extrac32.exe, findstr.exe, makecab.exe, print.exe, replace.exe, sc.exe, scriptrunner.exe, syncappvpublishingserver.exe, vbc.exe, csc.exe, jsc.exe, dnscmd.exe, diskshadow.exe, wsl.exe, bash.exe, hh.exe, at.exe, atbroker.exe, bginfo.exe, cdb.exe, dfsvc.exe, dxcap.exe, gpscript.exe, ie4uinit.exe, infdefaultinstall.exe, mmc.exe, msdt.exe, ttdinject.exe, tttracer.exe, wab.exe, winrm.vbs, pubprn.vbs, slmgr.vbs, manage-bde.wsf, launch-vsdevshell.ps1] , commandLine|contains: ["http", "\\temp\\", "\\appdata\\", "\\users\\public\\", "/c ", "-c ", "/p:", "/u ", ".sct", ".dll", "javascript"] }
