id: mail-auth-failed
title: SPF / DKIM / DMARC failure
description: At least one authentication mechanism failed (fail, softfail, permerror). Weak alone, strong combined with other signals.
severity: low
source: mails
attack: [T1566]
tags: [authentication]
where:
  flags|contains_any: [spf_fail, dkim_fail, dmarc_fail, compauth_fail]
---
id: mail-dmarc-fail-with-lure
title: DMARC failure combined with a social-engineering lure
description: DMARC or composite authentication failed and the body contains urgency / credential / financial wording.
severity: medium
confidence: low
source: mails
attack: [T1566.002]
tags: [authentication, phishing]
where:
  all_of:
    - flags|contains_any: [dmarc_fail, compauth_fail]
    - flags|contains_any: [lexicon_urgency, lexicon_credentials, lexicon_financial, lexicon_gift_card, credential_phishing_pattern, bec_pattern]
then_flags:
  - mail_corroborated: high
---
id: mail-executable-attachment
title: Executable, script or shortcut attachment
description: Attachment is a native executable, installer, script, .lnk/.url shortcut, .chm or .xll, directly or inside a container. Generic OneNote and disk-image files have a separate review rule.
severity: high
confidence: medium
source: mails
attack: [T1566.001, T1204.002]
tags: [attachment, malware]
where:
  flags|contains_any: [att_executable, att_installer, att_script, att_shortcut, att_help, att_xll, att_archive_contains_executable, att_archive_contains_script, att_archive_contains_shortcut, att_disk_image_contains_executable, att_disk_image_contains_shortcut, att_archive_single_executable, att_extension_mismatch_executable, att_nested_executable, att_nested_script]
then_flags:
  - att_extension_mismatch_executable: critical
  - att_yara_match: critical
  - mail_corroborated: critical
---
id: mail-container-attachment-review
title: OneNote or disk-image attachment (review)
description: A container can carry active content; the format alone does not establish a malicious payload.
severity: medium
confidence: low
source: mails
attack: [T1566.001]
tags: [attachment, review]
where:
  flags|contains_any: [att_onenote, att_disk_image, att_archive_contains_onenote, att_archive_contains_disk_image]
---
id: mail-macro-document
title: Office document with macros / XLM / DDE / remote template
description: Attachment carries a VBA project, Excel 4.0 macros, a DDE field, a remote template, an external OLE object or Equation Editor objects.
severity: medium
confidence: low
source: mails
attack: [T1566.001, T1204.002, T1221]
tags: [attachment, macro]
where:
  flags|contains_any: [att_office_macro, att_office_xlm, att_office_dde, att_office_external_template, att_office_external_object, att_rtf_equation_editor, att_rtf_objupdate, att_rtf_package, att_office_iqy_remote, att_csv_formula_injection, att_archive_contains_office_macro]
then_flags:
  - att_macro_autoexec: medium
  - att_macro_suspicious: high
  - att_macro_obfuscated: high
  - att_macro_vba_stomping: critical
  - att_office_external_template: high
  - att_office_dde: high
  - att_office_xlm: high
  - att_office_external_object: high
  - att_rtf_equation_editor: critical
  - att_rtf_objupdate: high
  - att_office_iqy_remote: high
---
id: mail-pdf-active-content
title: PDF with interactive or embedded content (review)
description: JavaScript, embedded documents, forms and encryption can be legitimate PDF capabilities. Review the content; capability alone does not establish an attack.
severity: low
confidence: low
source: mails
attack: [T1566.001, T1204.002]
tags: [attachment, pdf]
where:
  flags|contains_any: [att_pdf_javascript, att_pdf_launch, att_pdf_embedded_file, att_pdf_rich_media, att_pdf_submit_form, att_pdf_remote_goto, att_pdf_encrypted_empty_password, att_pdf_header_offset]
then_flags:
  - att_pdf_launch: high
  - mail_corroborated: high
---
id: mail-pdf-link-lure
title: One-page PDF that is essentially a link (click-me lure)
description: Short PDF whose only purpose is a link to an external page - common credential phishing carrier.
severity: medium
source: mails
attack: [T1566.002]
tags: [attachment, pdf, phishing]
where:
  flags|contains_any: [att_pdf_link_lure, att_pdf_image_only]
---
id: mail-encrypted-archive
title: Password-protected archive attachment
description: Encrypted archive or Office content cannot be fully inspected. A password-protected business document is not, by itself, evidence of an attack.
severity: low
confidence: low
source: mails
attack: [T1027, T1566.001]
tags: [attachment, archive]
where:
  flags|contains_any: [att_encrypted_archive, att_office_encrypted]
then_flags:
  - mail_corroborated: high
---
id: mail-html-smuggling
title: HTML attachment with smuggling or credential form
description: HTML attachment reconstructs a suspicious payload for download or collects credentials for an external destination. Generic HTML, export buttons and embedded images do not satisfy this rule.
severity: critical
confidence: high
source: mails
attack: [T1027.006, T1566.001]
tags: [attachment, html-smuggling, phishing]
where:
  flags|contains_any: [att_html_smuggling, att_html_credential_harvest, att_nested_html_smuggling, att_nested_html_credential_harvest]
---
id: mail-html-capabilities-review
title: HTML attachment with downloads, scripts or embedded content (review)
description: HTML capabilities or an HTML file in an archive warrant inspection; they are not sufficient evidence of smuggling.
severity: low
confidence: low
source: mails
attack: [T1566.001]
tags: [attachment, html, review]
where:
  flags|contains_any: [att_archive_contains_html, att_html_file_download, att_html_embedded_payload, att_html_smuggling_possible, att_html_password_form, att_svg_script, att_html_redirect_only]
then_flags:
  - mail_corroborated: high
---
id: mail-html-attachment
title: HTML attachment
description: Any HTML/HTM/SHTML/MHT attachment - review manually (phishing page, redirect, smuggling).
severity: low
source: mails
attack: [T1566.001]
tags: [attachment, html]
where:
  flags|contains: att_html_attachment
---
id: mail-attachment-disguised
title: Attachment disguised (double extension, RTLO, type mismatch)
description: File name tricks (invoice.pdf.exe, RTLO character, padded name) or real content type different from the extension.
severity: medium
confidence: low
source: mails
attack: [T1036.007, T1036]
tags: [attachment, masquerading]
where:
  flags|contains_any: [att_double_extension, att_rtlo_filename, att_padded_filename, att_extension_mismatch, att_extension_mismatch_executable, att_zero_width_filename, att_mixed_script_filename, att_archive_entry_double_extension, att_archive_entry_rtlo_filename]
then_flags:
  - att_extension_mismatch_executable: critical
  - att_rtlo_filename: high
  - mail_corroborated: high
---
id: mail-yara-match
title: Attachment matched a YARA rule
description: A user-provided YARA rule matched an attachment.
severity: critical
source: mails
attack: [T1566.001]
tags: [attachment, yara]
where:
  flags|contains: att_yara_match
---
id: mail-link-text-mismatch
title: Link text shows a different domain than the destination
description: Visible anchor text (e.g. https://portal.company.com) points to another domain - the classic phishing link trick.
severity: high
source: mails
attack: [T1566.002]
tags: [links, phishing]
where:
  flags|contains: url_text_href_mismatch
  risk|gte: 40
---
id: mail-suspicious-links
title: Suspicious links (IP literal, shortener, punycode, credential keywords, free hosting)
description: At least one URL flagged as IP literal, shortener, punycode, userinfo trick, credential-harvest keywords, free hosting / form builder, executable download, open redirect or e-mail embedded in the URL.
severity: medium
source: mails
attack: [T1566.002]
tags: [links, phishing]
where:
  flags|contains_any: [url_ip_literal, url_shortener, url_punycode, url_userinfo, url_credential_keywords, url_free_hosting, url_executable_download, url_open_redirect, url_data_uri, url_script_uri, url_suspicious_tld]
  flags|not_contains: bulk_mailer
  risk|gte: 40
---
id: mail-credential-phishing
title: Credential phishing pattern
description: Credential wording + urgency, or an HTML form / password field inside the mail, or a login-style URL with brand lure.
severity: high
source: mails
attack: [T1566.002, T1056.003]
tags: [phishing, credentials]
where:
  any_of:
    - flags|contains: credential_phishing_pattern
    - flags|contains: html_form_password
    - { flags|contains: html_form_external, flags|contains_any: [url_credential_keywords, url_text_href_mismatch] }
    - { flags|contains_all: [lexicon_credentials, mail_corroborated], flags|contains_any: [url_credential_keywords, url_text_href_mismatch] }
---
id: mail-bec-pattern
title: Business Email Compromise pattern
description: Financial request plus authority and pressure wording, corroborated by deceptive identity/link evidence or authentication regression. Webmail and an invoice alone are insufficient.
severity: high
confidence: medium
source: mails
attack: [T1566.002, T1656]
tags: [bec, fraud]
where:
  flags|contains: bec_pattern
then_flags:
  - internal_spoof: critical
  - sender_lookalike_internal: critical
  - replyto_lookalike_internal: critical
---
id: mail-bank-detail-change
title: Bank details / IBAN change request (verify independently)
description: Bank-change wording is a review signal, including legitimate supplier updates. Escalates only with corroborating identity, link or authentication-regression evidence.
severity: low
confidence: low
source: mails
attack: [T1656]
tags: [bec, fraud, invoice]
where:
  any_of:
    - bodyText|re: "(?i)(chang|nouveau|nouvelle|mise à jour|update|new)\\s+(de\\s+|d[e']\\s*)?(rib|iban|coordonn[ée]es bancaires|bank (account|details)|banking (details|information)|account number|beneficiary|bénéficiaire)"
    - visibleText|re: "(?i)(chang|nouveau|nouvelle|mise à jour|update|new)\\s+(de\\s+|d[e']\\s*)?(rib|iban|coordonn[ée]es bancaires|bank (account|details)|banking (details|information)|account number|beneficiary|bénéficiaire)"
    - subject|re: "(?i)(nouveau|new|chang|update|mise à jour).*(rib|iban|bank|banc|coordonn)"
then_flags:
  - mail_corroborated: high
---
id: mail-hidden-or-obfuscated-content
title: Hidden text, zero-width characters or obfuscated HTML
description: Content-salting and filter-evasion tricks inside the body.
severity: medium
source: mails
attack: [T1027]
tags: [evasion]
where:
  flags|contains_any: [hidden_text, zero_width_chars, bidi_override, obfuscated_html, mixed_script_text, image_only]
  risk|gte: 40
---
id: mail-forged-headers
title: Forged or inconsistent headers
description: Missing/malformed Message-ID, Date far from the first Received timestamp, Received chain going backwards, suspicious mailer, no Received at all.
severity: medium
source: mails
attack: [T1566]
tags: [headers]
where:
  flags|contains_any: [no_message_id, malformed_message_id, date_skew, received_time_travel, suspicious_mailer]
  flags|not_contains: bulk_mailer
---
id: mail-external-origin-suspicious-hop
title: Origin IP with bad reputation
description: The first external hop IP was flagged malicious or suspicious by a reputation provider (requires the Reputation view to have run).
severity: high
source: mails
attack: [T1566]
tags: [reputation, origin]
where:
  reputation.originIp.verdict|in: [malicious, suspicious]
---
id: mail-links-bad-reputation
title: Link or attachment hash with bad reputation
description: At least one URL / domain / attachment hash was flagged by a reputation provider (requires the Reputation view to have run).
severity: critical
source: mails
attack: [T1566]
tags: [reputation, links, attachment]
where:
  reputation.worst|in: [malicious]
---
id: mail-high-risk-score
title: High overall risk score
description: Aggregate risk score of the mail is 70 or more.
severity: medium
source: mails
attack: [T1566]
tags: [score]
where:
  risk|gte: 70
---
id: mail-sender-burst
title: Burst of messages from one address (compromised account / mass mailing)
description: Twenty or more messages from the same address within 10 minutes.
severity: medium
source: mails
attack: [T1114, T1534]
tags: [behaviour, burst]
where:
  fromAddr|exists: true
group_by: [fromAddr]
window: 10m
threshold: ">= 20"
---
id: mail-sent-outside-business-hours
title: Message sent outside business hours with risk signals
description: Date outside the configured business hours and at least one phishing indicator (risk >= 40).
severity: low
source: mails
attack: [T1566]
tags: [behaviour, anomaly]
where:
  risk|gte: 40
time:
  outside_business_hours: true
  field: date
---
id: mail-mass-recipients
title: Mass recipients / undisclosed recipients with lure
description: More than 30 recipients, or empty To/Cc, combined with a lure or link flags.
severity: low
source: mails
attack: [T1566]
tags: [behaviour]
where:
  all_of:
    - flags|contains_any: [mass_recipients, undisclosed_recipients]
    - flags|contains_any: [lexicon_urgency, lexicon_credentials, lexicon_document_lure, url_text_href_mismatch, url_shortener, url_free_hosting]
---
id: mail-single-mail-domain-risky
title: One-off sender domain with risk signals
description: A registrable domain that appears only once in the mailbox and whose message has a risk score of 40 or more - first-contact phishing.
severity: low
source: mails
attack: [T1566]
tags: [behaviour, first-contact]
where:
  risk|gte: 40
  fromRegistrable|exists: true
  fromRegistrable|nin_setting: internal_domains
group_by: [fromRegistrable]
threshold: "== 1"
entities: [fromRegistrable, fromAddr, subject]
---
id: mail-calendar-lure
title: Calendar invitation lure
description: .ics attachment with links or external attendees - calendar phishing that bypasses mail filters.
severity: low
source: mails
attack: [T1566.001]
tags: [attachment, calendar]
where:
  flags|contains: att_calendar_lure
---
id: mail-nested-forwarded-risky
title: Forwarded message attached with risky content
description: An attached .eml/.msg contains executable / macro / smuggling indicators.
severity: high
source: mails
attack: [T1566.001]
tags: [attachment, nested]
where:
  flags|re: "^att_nested_(executable|script|office_macro|html_smuggling|html_embedded_payload|pdf_javascript|encrypted_archive|extension_mismatch_executable|att_)"
---
id: mail-deleted-message-with-indicators
title: Deleted or orphaned message that carries phishing indicators
description: A message found in Deleted Items / Recoverable Items or recovered as an orphan item from the PST/OST, and scored 45 or more. Attackers clean the mailbox after a compromise; the victim deletes the lure after clicking it. Either way the deleted copy is the evidence.
severity: medium
source: mails
attack: [T1070.008]
tags: [evidence, deleted, anti-forensics]
where:
  flags|contains_any: [deleted_item, orphan_item]
  risk|gte: 45
entities: [fromAddr, folder]
