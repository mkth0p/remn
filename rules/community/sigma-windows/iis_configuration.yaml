id: sigma-e8ebd53a-30c2-45bd-81bb-74befba07bdb
title: HTTP Logging Disabled On IIS Server
description: Detects changes to of the IIS server configuration in order to disable HTTP logging for successful requests.
severity: high
source: events
attack:
- T1685.001
- T1505.004
tags:
- sigma
- iis-configuration
- persistence
- defense-impairment
references:
- https://learn.microsoft.com/en-us/iis/manage/provisioning-and-managing-iis/configure-logging-in-iis
- https://www.microsoft.com/en-us/security/blog/2022/12/12/iis-modules-the-evolution-of-web-shells-and-how-to-detect-them/
- https://learn.microsoft.com/en-us/iis/configuration/system.webserver/httplogging
where:
  channel|contains: iis-configuration
  eventId: 29
  data.Configuration: /system.webServer/httpLogging/@dontLog
  newValue: 'true'
sigma:
