id: sigma-b85e5894-9b19-4d86-8c87-a2f3b81f0521
title: BITS Transfer Job Downloading File Potential Suspicious Extension
description: Detects new BITS transfer job saving local files with potential suspicious extensions
severity: medium
source: events
attack:
- T1197
tags:
- sigma
- bits-client
- persistence
- execution
- stealth
references:
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1197/T1197.md
where:
  channel|contains: bits-client
  eventId: 16403
  data.LocalName|endswith:
  - .bat
  - .dll
  - .exe
  - .hta
  - .ps1
  - .psd1
  - .sh
  - .vbe
  - .vbs
  not:
    data.LocalName|contains: \AppData\
    data.RemoteName|contains: .com
sigma:
  id: b85e5894-9b19-4d86-8c87-a2f3b81f0521
  status: test
  author: frack113
  date: '2022-03-01'
  modified: '2023-03-27'
  level: medium
  logsource:
