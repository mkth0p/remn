id: sigma-6d44fb93-e7d2-475c-9d3d-54c9c1e33427
title: BITS Transfer Job With Uncommon Or Suspicious Remote TLD
description: Detects a suspicious download using the BITS client from a FQDN that is unusual. Adversaries may abuse BITS jobs
  to persistently execute or clean up after malicious payloads.
severity: medium
source: events
attack:
- T1197
tags:
- sigma
- bits-client
- persistence
- execution
- stealth
references:
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1197/T1197.md
- https://twitter.com/malmoeb/status/1535142803075960832
where:
  channel|contains: bits-client
  eventId: 16403
  not:
    data.RemoteName|contains_any:
    - .azureedge.net/
    - .com/
    - .sfx.ms/
    - download.mozilla.org/
    - cdn.onenote.net/
    - cdn.office.net/
    - tscdn.m365.static.microsoft/
sigma:
  id: 6d44fb93-e7d2-475c-9d3d-54c9c1e33427
  status: test
  author: Florian Roth (Nextron Systems)
  date: '2022-06-10'
  modified: '2025-02-28'
  level: medium
  logsource:
    product: windows
    service: bits-client
  falsepositives:
  - This rule doesn't exclude other known TLDs such as ".org" or ".net". It's recommended to apply additional filters for
    software and scripts that leverage the BITS service
