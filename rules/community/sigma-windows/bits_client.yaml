id: sigma-90f138c1-f578-4ac3-8c49-eecfd847c8b7
title: BITS Transfer Job Download From Direct IP
description: Detects a BITS transfer job downloading file(s) from a direct IP address.
severity: high
source: events
attack:
- T1197
tags:
- sigma
- bits-client
- persistence
- execution
- stealth
references:
- https://blog.netspi.com/15-ways-to-download-a-file/#bitsadmin
- https://isc.sans.edu/diary/22264
- https://lolbas-project.github.io/lolbas/Binaries/Bitsadmin/
- https://blog.talosintelligence.com/breaking-the-silence-recent-truebot-activity/
where:
  channel|contains: bits-client
  eventId: 16403
  data.RemoteName|contains_any:
  - http://1
  - http://2
  - http://3
  - http://4
  - http://5
  - http://6
  - http://7
  - http://8
  - http://9
  - https://1
  - https://2
  - https://3
  - https://4
  - https://5
  - https://6
  - https://7
  - https://8
  - https://9
  not:
    any_of:
    - data.RemoteName|contains_any:
      - ://10.
      - ://192.168.
      - ://172.16.
      - ://172.17.
      - ://172.18.
      - ://172.19.
      - ://172.20.
      - ://172.21.
      - ://172.22.
      - ://172.23.
      - ://172.24.
      - ://172.25.
      - ://172.26.
      - ://172.27.
      - ://172.28.
      - ://172.29.
      - ://172.30.
      - ://172.31.
      - ://127.
      - ://169.254.
    - data.RemoteName|contains_any:
      - https://7-
      - http://7-
