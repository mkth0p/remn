id: sigma-d22df9cd-2aee-4089-93c7-9dc4eae77f2c
title: ISATAP Router Address Was Set
description: Detects the configuration of a new ISATAP router on a Windows host. While ISATAP is a legitimate Microsoft technology
  for IPv6 transition, unexpected or unauthorized ISATAP router configurations could indicate a potential IPv6 DNS Takeover
  attack using tools like mitm6. In such attacks, adversaries advertise themselves as DHCPv6 servers and set malicious ISATAP
  routers to intercept traffic. This detection should be correlated with network baselines and known legitimate ISATAP deployments
  in your environment.
severity: medium
source: events
attack:
- T1557
- T1565.002
tags:
- sigma
- system
- impact
- credential-access
- collection
- initial-access
- privilege-escalation
- execution
references:
- https://www.blackhillsinfosec.com/mitm6-strikes-again-the-dark-side-of-ipv6/
- https://redfoxsec.com/blog/ipv6-dns-takeover/
- https://www.securityhq.com/blog/malicious-isatap-tunneling-unearthed-on-windows-server/
- https://medium.com/@ninnesoturan/detecting-ipv6-dns-takeover-a54a6a88be1f
where:
  all_of:
  - channel: System
  - eventId: 4100
    provider: Microsoft-Windows-Iphlpsvc
  - not:
      data.IsatapRouter|in:
      - 127.0.0.1
      - ::1
  - not:
      data.IsatapRouter|exists: false
sigma:
  id: d22df9cd-2aee-4089-93c7-9dc4eae77f2c
  status: experimental
  author: hamid
  date: '2025-10-19'
  level: medium
  logsource:
    product: windows
    service: system
  falsepositives:
  - Legitimate ISATAP router configuration in enterprise environments
  - IPv6 transition projects and network infrastructure changes
  - Network administrators configuring dual-stack networking
  - Automatic ISATAP configuration in some Windows deployments
