id: sigma-39f919f3-980b-4e6f-a975-8af7e507ef2b
title: Critical Hive In Suspicious Location Access Bits Cleared
description: Detects events from the Kernel-General ETW indicating that the access bits of a hive with a system like hive
  name located in the temp directory have been reset. This occurs when an application tries to access a hive and the hive
  has not be recognized since the last 7 days (by default). Registry hive dumping utilities such as QuarksPwDump were seen
  emitting this behavior.
