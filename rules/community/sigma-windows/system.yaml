id: sigma-26481afe-db26-4228-b264-25a29fe6efc7
title: Uncommon Service Installation Image Path
description: Detects uncommon service installation commands by looking at suspicious or uncommon image path values containing
  references to encoded powershell commands, temporary paths, etc.
severity: medium
source: events
attack:
- T1543.003
tags:
- sigma
- system
- persistence
- privilege-escalation
- car.2013-09-005
references:
- Internal Research
where:
  all_of:
  - channel: System
  - provider: Service Control Manager
    eventId: 7045
  - any_of:
    - serviceFile|contains_any:
      - \\.\pipe
      - \Users\Public\
      - \Windows\Temp\
    - serviceFile|contains: ' -e'
      serviceFile|contains_any:
      - ' aQBlAHgA'
      - ' aWV4I'
      - ' IAB'
      - ' JAB'
      - ' PAA'
      - ' SQBFAFgA'
      - ' SUVYI'
  - not:
      serviceFile|startswith: C:\ProgramData\Microsoft\Windows Defender\Definition Updates\
  - not:
      serviceFile|startswith: C:\WINDOWS\TEMP\thor10-remote\thor64.exe
