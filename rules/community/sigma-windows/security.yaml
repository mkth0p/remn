id: sigma-b07e58cf-cacc-4135-8473-ccb2eba63dd2
title: Potential Kerberos Coercion by Spoofing SPNs via DNS Manipulation
description: Detects modifications to DNS records in Active Directory where the Distinguished Name (DN) contains a base64-encoded
  blob matching the pattern "1UWhRCAAAAA...BAAAA". This pattern corresponds to a marshaled CREDENTIAL_TARGET_INFORMATION structure,
  commonly used in Kerberos coercion attacks. Adversaries may exploit this to coerce victim systems into authenticating to
  attacker-controlled hosts by spoofing SPNs via DNS. It is one of the strong indicators of a Kerberos coercion attack,. where
  adversaries manipulate DNS records to spoof Service Principal Names (SPNs) and redirect authentication requests like CVE-2025-33073.
  Please investigate the user account that made the changes, as it is likely a low-privileged account that has been compromised.
severity: high
source: events
attack:
- T1557.003
tags:
- sigma
- security
- collection
- credential-access
- persistence
- privilege-escalation
references:
- https://googleprojectzero.blogspot.com/2021/10/using-kerberos-for-authentication-relay.html
- https://www.synacktiv.com/publications/ntlm-reflection-is-dead-long-live-ntlm-reflection-an-in-depth-analysis-of-cve-2025
where:
  channel: Security
  any_of:
  - eventId|in:
    - 5136
    - 5137
    objectClass: dnsNode
    objectDn|contains_all:
    - UWhRCA
    - BAAAA
    - CN=MicrosoftDNS
  - eventId: 4662
    data.AdditionalInfo|contains_all:
    - UWhRCA
    - BAAAA
    - CN=MicrosoftDNS
sigma:
  id: b07e58cf-cacc-4135-8473-ccb2eba63dd2
  status: experimental
  author: Swachchhanda Shrawan Poudel (Nextron Systems)
  date: '2025-06-20'
  level: high
  logsource:
    product: windows
    service: security
    definition: 'By default these events are not logged by default for MicrosoftDNS objects in Active Directory.

      To enable detection, configure an AuditRule on the DNS object container with the "CreateChild" permission for the "Everyone"
      principal.

      This can be accomplished using tools such as Set-AuditRule (see https://github.com/OTRF/Set-AuditRule).

      '
  falsepositives:
  - Unknown
