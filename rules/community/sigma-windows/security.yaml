id: sigma-1d2ab8ac-1a01-423b-9c39-001510eae8e8
title: Azure AD Health Service Agents Registry Keys Access
description: 'This detection uses Windows security events to detect suspicious access attempts to the registry key values
  and sub-keys of Azure AD Health service agents (e.g AD FS). Information from AD Health service agents can be used to potentially
  abuse some of the features provided by those services in the cloud (e.g. Federation). This detection requires an access
  control entry (ACE) on the system access control list (SACL) of the following securable object: HKLM:\SOFTWARE\Microsoft\ADHealthAgent.
  Make sure you set the SACL to propagate to its sub-keys.'
severity: medium
source: events
attack:
- T1012
tags:
- sigma
- security
- discovery
references:
- https://o365blog.com/post/hybridhealthagent/
- https://github.com/OTRF/Set-AuditRule/blob/c3dec5443414231714d850565d364ca73475ade5/rules/registry/aad_connect_health_service_agent.yml
where:
  channel: Security
  eventId|in:
  - 4656
  - 4663
  objectType: Key
  objectName: \REGISTRY\MACHINE\SOFTWARE\Microsoft\ADHealthAgent
  not:
    processName|contains_any:
    - Microsoft.Identity.Health.Adfs.DiagnosticsAgent.exe
    - Microsoft.Identity.Health.Adfs.InsightsService.exe
    - Microsoft.Identity.Health.Adfs.MonitoringAgent.Startup.exe
    - Microsoft.Identity.Health.Adfs.PshSurrogate.exe
    - Microsoft.Identity.Health.Common.Clients.ResourceMonitor.exe
