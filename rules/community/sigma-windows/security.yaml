    service: security
    definition: The advanced audit policy setting "Account Logon > Kerberos Authentication Service" must be configured for
      Success/Failure
  falsepositives:
  - False positives are possible if the environment is using certificates for authentication. We recommend filtering Account_Name
    to the Domain Controller computer accounts.
