id: sigma-5d6c375a-18ae-4952-b4f6-8b803f6c8555
title: File Access Of Signal Desktop Sensitive Data
description: 'Detects access to Signal Desktop''s sensitive data files: db.sqlite and config.json. The db.sqlite file in Signal
  Desktop stores all locally saved messages in an encrypted SQLite database, while the config.json contains the decryption
  key needed to access that data. Since the key is stored in plain text, a threat actor who gains access to both files can
  decrypt and read sensitive messages without needing the users credentials. Currently the rule only covers the default Signal
  installation path in AppData\Roaming. Signal Portable installations may use different paths based on user configuration.
  Additional paths can be added to the selection as needed.'
severity: medium
source: events
attack:
- T1003
tags:
- sigma
- security
- credential-access
references:
- https://cloud.google.com/blog/topics/threat-intelligence/russia-targeting-signal-messenger/
- https://vmois.dev/query-signal-desktop-messages-sqlite/
where:
  channel: Security
  eventId: 4663
  objectType: File
  objectName|contains: \AppData\Roaming\Signal\
  objectName|endswith:
  - \config.json
  - \db.sqlite
  not:
    processName|endswith:
    - \signal-portable.exe
    - \signal.exe
