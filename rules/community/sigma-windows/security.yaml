id: sigma-ff151c33-45fa-475d-af4f-c2f93571f4fe
title: Azure AD Health Monitoring Agent Registry Keys Access
description: This detection uses Windows security events to detect suspicious access attempts to the registry key of Azure
  AD Health monitoring agent. This detection requires an access control entry (ACE) on the system access control list (SACL)
  of the following securable object HKLM\SOFTWARE\Microsoft\Microsoft Online\Reporting\MonitoringAgent.
severity: medium
source: events
attack:
- T1012
tags:
- sigma
- security
- discovery
references:
- https://o365blog.com/post/hybridhealthagent/
- https://github.com/OTRF/Set-AuditRule/blob/c3dec5443414231714d850565d364ca73475ade5/rules/registry/aad_connect_health_monitoring_agent.yml
where:
  channel: Security
  eventId|in:
  - 4656
  - 4663
  objectType: Key
  objectName: \REGISTRY\MACHINE\SOFTWARE\Microsoft\Microsoft Online\Reporting\MonitoringAgent
  not:
    processName|contains_any:
    - Microsoft.Identity.Health.Adfs.DiagnosticsAgent.exe
    - Microsoft.Identity.Health.Adfs.InsightsService.exe
    - Microsoft.Identity.Health.Adfs.MonitoringAgent.Startup.exe
    - Microsoft.Identity.Health.Adfs.PshSurrogate.exe
    - Microsoft.Identity.Health.Common.Clients.ResourceMonitor.exe
sigma:
  id: ff151c33-45fa-475d-af4f-c2f93571f4fe
  status: test
  author: Roberto Rodriguez (Cyb3rWard0g), OTR (Open Threat Research), MSTIC
  date: '2021-08-26'
  modified: '2022-10-09'
  level: medium
  logsource:
    product: windows
    service: security
  falsepositives:
  - Unknown
