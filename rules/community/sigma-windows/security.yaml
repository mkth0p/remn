id: sigma-6a53d871-682d-40b6-83e0-b7c1a6c4e3a5
title: PetitPotam Suspicious Kerberos TGT Request
description: Detect suspicious Kerberos TGT requests. Once an attacer obtains a computer certificate by abusing Active Directory
  Certificate Services in combination with PetitPotam, the next step would be to leverage the certificate for malicious purposes.
  One way of doing this is to request a Kerberos Ticket Granting Ticket using a tool like Rubeus. This request will generate
  a 4768 event with some unusual fields depending on the environment. This analytic will require tuning, we recommend filtering
  Account_Name to the Domain Controller computer accounts.
severity: high
source: events
attack:
- T1187
tags:
- sigma
- security
- credential-access
references:
- https://github.com/topotam/PetitPotam
- https://isc.sans.edu/forums/diary/Active+Directory+Certificate+Services+ADCS+PKI+domain+admin+vulnerability/27668/
- https://github.com/splunk/security_content/blob/88d689fe8a055d8284337b9fad5d9152b42043db/detections/endpoint/petitpotam_suspicious_kerberos_tgt_request.yml
where:
  channel: Security
  eventId: 4768
  targetUser|endswith: $
  data.CertThumbprint|re: .*
  not:
    any_of:
    - ipAddress: ::1
    - data.CertThumbprint: ''
sigma:
  id: 6a53d871-682d-40b6-83e0-b7c1a6c4e3a5
  status: test
  author: Mauricio Velazco, Michael Haag
  date: '2021-09-02'
  modified: '2022-10-05'
  level: high
