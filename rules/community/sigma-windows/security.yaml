id: sigma-11d00fff-5dc3-428c-8184-801f292faec0
title: Service Registry Key Read Access Request
description: Detects "read access" requests on the services registry key. Adversaries may execute their own malicious payloads
  by hijacking the Registry entries used by services. Adversaries may use flaws in the permissions for Registry keys related
  to services to redirect from the originally specified executable to one that they control, in order to launch their own
  code when a service starts.
severity: low
source: events
attack:
- T1574.011
tags:
- sigma
- security
- persistence
- privilege-escalation
- execution
- stealth
references:
- https://center-for-threat-informed-defense.github.io/summiting-the-pyramid/analytics/service_registry_permissions_weakness_check/
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1574.011/T1574.011.md#atomic-test-1---service-registry-permissions-weakness
where:
  channel: Security
  eventId: 4663
  objectName|contains_all:
  - \SYSTEM\
  - ControlSet\Services\
  accessList|contains: '%%1538'
sigma:
  id: 11d00fff-5dc3-428c-8184-801f292faec0
  status: test
  author: Center for Threat Informed Defense (CTID) Summiting the Pyramid Team
  date: '2023-09-28'
  level: low
  logsource:
    product: windows
    service: security
    definition: 'Requirements: SACLs must be enabled for "READ_CONTROL" on the registry keys used in this rule'
  falsepositives:
  - Likely from legitimate applications reading their key. Requires heavy tuning
