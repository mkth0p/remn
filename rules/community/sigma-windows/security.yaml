sigma:
  id: e5ac86dd-2da1-454b-be74-05d26c769d7d
  status: experimental
  author: Swachchhanda Shrawan Poudel (Nextron Systems)
  date: '2025-11-22'
  level: medium
  logsource:
    product: windows
    service: security
    definition: 'Enable ''Audit Directory Service Changes'' in the Default Domain Controllers Policy under:

      Computer Configuration -> Policies -> Windows Settings -> Security Settings -> Advanced Audit Policy Configuration ->
      Audit Policies -> DS Access -> Audit Directory Service Changes (Success).

      Additionally, proper SACL needs to be configured on the ''CN=Policies,CN=System,DC=<domain>,DC=<tld>'' container in
      Active Directory to capture changes to Group Policy Objects.

      '
  falsepositives:
  - Legitimate modifications to Default Domain or Default Domain Controllers GPOs
