id: sigma-85adeb13-4fc9-4e68-8a4a-c7cb2c336eb7
title: CobaltStrike Named Pipe Patterns
description: Detects the creation of a named pipe with a pattern found in CobaltStrike malleable C2 profiles
severity: high
source: events
attack:
- T1055
tags:
- sigma
- pipe_created
- privilege-escalation
- stealth
- stp.1k
references:
- https://svch0st.medium.com/guide-to-named-pipes-and-hunting-for-cobalt-strike-pipes-dc46b2c5f575
- https://gist.github.com/MHaggis/6c600e524045a6d49c35291a21e10752
where:
  all_of:
  - channel|contains: sysmon
    eventId|in:
    - 17
    - 18
  - any_of:
    - pipeName|startswith:
      - \DserNamePipe
      - \f4c3
      - \f53f
      - \fullduplex_
      - \mojo.5688.8052.183894939787088877
      - \mojo.5688.8052.35780273329370473
      - \MsFteWds
      - \msrpc_
      - \mypipe-f
      - \mypipe-h
      - \ntsvcs
      - \PGMessagePipe
      - \rpc_
      - \scerpc
      - \SearchTextHarvester
      - \spoolss
      - \win_svc
      - \win\msrpc_
      - \windows.update.manager
      - \wkssvc
    - pipeName|in:
      - \demoagent_11
      - \demoagent_22
    - pipeName|startswith: \Winsock2\CatalogChangeListener-
      pipeName|endswith: -0,
  - not:
      pipeName|in:
      - \wkssvc
      - \spoolss
      - \scerpc
      - \ntsvcs
      - \SearchTextHarvester
      - \PGMessagePipe
      - \MsFteWds
  - not:
      image|contains_any:
      - :\Program Files\Websense\
      - :\Program Files (x86)\Websense\
      pipeName|startswith:
      - \DserNamePipeR
      - \DserNamePipeW
sigma:
  id: 85adeb13-4fc9-4e68-8a4a-c7cb2c336eb7
  status: test
  author: Florian Roth (Nextron Systems), Christian Burkard (Nextron Systems)
  date: '2021-07-30'
  modified: '2024-01-26'
