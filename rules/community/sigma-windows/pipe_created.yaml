      You can also use other repo, e.g. https://github.com/Neo23x0/sysmon-config, https://github.com/olafhartong/sysmon-modular.
      How to test detection? You can always use Cobalt Strike, but also you can check powershell script from this site https://svch0st.medium.com/guide-to-named-pipes-and-hunting-for-cobalt-strike-pipes-dc46b2c5f575
  falsepositives:
  - Chrome instances using the exact same pipe name "mojo.xxx"
  - Websense Endpoint using the pipe name "DserNamePipe(R|W)\d{1,5}"
