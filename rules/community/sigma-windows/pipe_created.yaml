id: sigma-d5601f8c-b26f-4ab0-9035-69e11a8d4ad2
title: CobaltStrike Named Pipe
description: Detects the creation of a named pipe as used by CobaltStrike
severity: critical
source: events
attack:
- T1055
tags:
- sigma
- pipe_created
- privilege-escalation
- stealth
references:
- https://twitter.com/d4rksystem/status/1357010969264873472
- https://labs.f-secure.com/blog/detecting-cobalt-strike-default-modules-via-named-pipe-analysis/
- https://github.com/SigmaHQ/sigma/issues/253
- https://blog.cobaltstrike.com/2021/02/09/learn-pipe-fitting-for-all-of-your-offense-projects/
- https://redcanary.com/threat-detection-report/threats/cobalt-strike/
where:
  channel|contains: sysmon
  eventId|in:
  - 17
  - 18
  any_of:
  - pipeName|contains_all:
    - \MSSE-
    - -server
  - pipeName|startswith: \postex_
  - pipeName|startswith: \status_
  - pipeName|startswith: \msagent_
  - pipeName|startswith: \mojo_
  - pipeName|startswith: \interprocess_
  - pipeName|startswith: \samr_
  - pipeName|startswith: \netlogon_
  - pipeName|startswith: \srvsvc_
  - pipeName|startswith: \lsarpc_
  - pipeName|startswith: \wkssvc_
sigma:
  id: d5601f8c-b26f-4ab0-9035-69e11a8d4ad2
  status: test
  author: Florian Roth (Nextron Systems), Wojciech Lesicki
  date: '2021-05-25'
  modified: '2022-10-31'
  level: critical
  logsource:
    product: windows
    category: pipe_created
    definition: Note that you have to configure logging for Named Pipe Events in Sysmon config (Event ID 17 and Event ID 18).
      The basic configuration is in popular sysmon configuration (https://github.com/SwiftOnSecurity/sysmon-config), but it
      is worth verifying. You can also use other repo, e.g. https://github.com/Neo23x0/sysmon-config, https://github.com/olafhartong/sysmon-modular.
      How to test detection? You can always use Cobalt Strike, but also you can check powershell script from this site https://svch0st.medium.com/guide-to-named-pipes-and-hunting-for-cobalt-strike-pipes-dc46b2c5f575
  falsepositives:
  - Unknown
