id: sigma-d29a20b2-be4b-4827-81f2-3d8a59eab5fc
title: Sysinternals Tools AppX Versions Execution
description: Detects execution of Sysinternals tools via an AppX package. Attackers could install the Sysinternals Suite to
  get access to tools such as psexec and procdump to avoid detection based on System paths.
severity: low
source: events
tags:
- sigma
- appmodel-runtime
- execution
- stealth
references:
- https://learn.microsoft.com/en-us/sysinternals/downloads/microsoft-store
where:
  channel|contains: appmodel-runtime
  eventId: 201
  data.ImageName|in:
  - procdump.exe
  - psloglist.exe
  - psexec.exe
  - livekd.exe
  - ADExplorer.exe
sigma:
  id: d29a20b2-be4b-4827-81f2-3d8a59eab5fc
  status: test
  author: Nasreddine Bencherchali (Nextron Systems)
  date: '2023-01-16'
