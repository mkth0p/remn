  that an AppX package deployment was blocked by a policy: - Event ID 441: The package deployment operation is blocked by
  the "Allow deployment operations in special profiles" policy - Event ID 442: Deployments to non-system volumes are blocked
  by the "Disable deployment of Windows Store apps to non-system volumes" policy." - Event ID 453: Package blocked by a platform
  policy. - Event ID 454: Package blocked by a platform policy.'
severity: medium
source: events
