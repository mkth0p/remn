id: sigma-e54279c7-4910-4e2c-902c-c56a25b549f6
title: Windows AppX Deployment Full Trust Package Installation
description: Detects the installation of MSIX/AppX packages with full trust privileges which run with elevated privileges
  outside normal AppX container restrictions
severity: medium
source: events
attack:
- T1204.002
- T1553.005
tags:
- sigma
- appxdeployment-server
- execution
- defense-impairment
references:
- https://www.splunk.com/en_us/blog/security/msix-weaponization-threat-detection-splunk.html
where:
  all_of:
  - channel|contains: appxdeployment-server
  - eventId: 400
    data.HasFullTrust: 1
  - not:
      any_of:
      - data.PackageSourceUri|startswith:
        - file:///C:/Program%20Files/
        - file:///C:/Program%20Files%20(x86)/
      - data.PackageSourceUri|re: ^https://go\.microsoft\.com/fwlink/.linkid
      - data.PackageSourceUri|contains_any:
        - .cdn.microsoft.com
        - .cdn.office.net/
      - data.CallingProcess|startswith:
        - sysprep.exe
        - svchost.exe,AppReadiness
  - not:
      any_of:
      - data.PackageSourceUri|startswith: x-windowsupdate://
      - data.PackageFullName|startswith: MicrosoftWindows.Client.
sigma:
  id: e54279c7-4910-4e2c-902c-c56a25b549f6
  status: experimental
  author: Michael Haag, Swachchhanda Shrawan Poudel (Nextron Systems)
  date: '2025-11-03'
  level: medium
  logsource:
    product: windows
    service: appxdeployment-server
  falsepositives:
  - Some legitimate applications installation which have been missed from filtering can generate fps, thus baselining and
    tuning is recommended before deploying to production
