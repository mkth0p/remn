id: sigma-8d91f6e4-9f3b-4c21-ae41-2c5b7d9f7a12
title: Unsigned or Unencrypted SMB Connection to Share Established
description: Detects SMB server connections to shares without signing or encryption enabled. This could indicate potential
  lateral movement activity using unsecured SMB shares.
severity: medium
source: events
attack:
- T1021.002
tags:
- sigma
- smbserver-connectivity
- lateral-movement
references:
- https://learn.microsoft.com/en-us/troubleshoot/windows-server/networking/overview-server-message-block-signing
where:
  channel|contains: smbserver/connectivity
  eventId: 4000
  shareName|contains_any:
  - IPC$
  - ADMIN$
  - C$
  any_of:
  - data.SigningUsed: 'false'
  - data.EncyptionUsed: 'false'
  not:
    any_of:
    - ipAddress|startswith: '127.'
    - ipAddress|startswith: 169.254.
    - ipAddress|in:
      - 0000:0000:0000:0000:0000:0000:0000:0001
      - 0:0:0:0:0:0:0:1
      - ::1
    - ipAddress|re: '^fe[89ab][0-9a-f]:'
    - ipAddress|re: '^f[cd][0-9a-f][0-9a-f]:'
    - ipAddress|re:
      - '00000000000000000000000000000001'
      - FE80000000000000
      - FC00000000000000
      - 0200....7F
      - 0200....A9FE
sigma:
  id: 8d91f6e4-9f3b-4c21-ae41-2c5b7d9f7a12
  status: experimental
  author: Mohamed Abdelghani
  date: '2025-10-19'
  level: medium
  logsource:
    product: windows
    service: smbserver-connectivity
  falsepositives:
  - Connections from local or private IP addresses to SMB shares without signing or encryption enabled for older systems or
    misconfigured environments. Apply additional tuning as needed.
