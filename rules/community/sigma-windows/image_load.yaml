id: sigma-3669afd2-9891-4534-a626-e5cf03810a61
title: Load Of RstrtMgr.DLL By An Uncommon Process
description: Detects the load of RstrtMgr DLL (Restart Manager) by an uncommon process. This library has been used during
  ransomware campaigns to kill processes that would prevent file encryption by locking them (e.g. Conti ransomware, Cactus
  ransomware). It has also recently been seen used by the BiBi wiper for Windows. It could also be used for anti-analysis
  purposes by shut downing specific processes.
severity: low
source: events
attack:
- T1486
- T1685
tags:
- sigma
- image_load
- impact
- defense-impairment
references:
- https://www.crowdstrike.com/blog/windows-restart-manager-part-1/
- https://www.crowdstrike.com/blog/windows-restart-manager-part-2/
- https://web.archive.org/web/20231221193106/https://www.swascan.com/cactus-ransomware-malware-analysis/
- https://taiwan.postsen.com/business/88601/Hamas-hackers-use-data-destruction-software-BiBi-which-consumes-a-lot-of-processor-resources-to-wipe-Windows-computer-data--iThome.html
where:
  all_of:
  - channel|contains: sysmon
    eventId: 7
  - any_of:
    - imageLoaded|endswith: \RstrtMgr.dll
    - originalFileName: RstrtMgr.dll
  - not:
      any_of:
      - image|startswith:
        - C:\$WINDOWS.~BT\
        - C:\$WinREAgent\
        - C:\Program Files (x86)\
        - C:\Program Files\
        - C:\ProgramData\
        - C:\Windows\explorer.exe
        - C:\Windows\SoftwareDistribution\
        - C:\Windows\SysNative\
        - C:\Windows\System32\
        - C:\Windows\SysWOW64\
        - C:\Windows\WinSxS\
        - C:\WUDownloadCache\
      - image|startswith: C:\Users\
        image|contains_all:
        - \AppData\Local\Temp\is-
        - .tmp\
        image|endswith: .tmp
      - image|startswith: C:\Windows\Temp\
  - not:
      any_of:
      - image|startswith: C:\Users\
        image|endswith:
        - \AppData\Local\Microsoft\OneDrive\OneDrive.exe
        - \AppData\Local\Microsoft\OneDrive\OneDriveStandaloneUpdater.exe
      - image|startswith: C:\Users\
        image|contains: \AppData\Local\Microsoft\OneDrive\
        image|endswith: \OneDrive.Sync.Service.exe
