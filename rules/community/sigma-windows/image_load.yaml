id: sigma-9ae01559-cf7e-4f8e-8e14-4c290a1b4784
title: CredUI.DLL Loaded By Uncommon Process
description: Detects loading of "credui.dll" and related DLLs by an uncommon process. Attackers might leverage this DLL for
  potential use of "CredUIPromptForCredentials" or "CredUnPackAuthenticationBufferW".
severity: medium
source: events
attack:
- T1056.002
tags:
- sigma
- image_load
- credential-access
- collection
references:
- https://securitydatasets.com/notebooks/atomic/windows/credential_access/SDWIN-201020013208.html
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1056.002/T1056.002.md#atomic-test-2---powershell---prompt-user-for-password
- https://learn.microsoft.com/en-us/windows/win32/api/wincred/nf-wincred-creduipromptforcredentialsa
- https://github.com/S12cybersecurity/RDPCredentialStealer
where:
  all_of:
  - channel|contains: sysmon
    eventId: 7
  - any_of:
    - imageLoaded|endswith:
      - \credui.dll
      - \wincredui.dll
    - originalFileName|in:
      - credui.dll
      - wincredui.dll
  - not:
      any_of:
      - image|startswith:
