id: sigma-cbb56d62-4060-40f7-9466-d8aaf3123f83
title: Python Image Load By Non-Python Process
description: Detects the image load of "Python Core" by a non-Python process. This might be indicative of a execution of executable
  that has been bundled from Python code. Various tools like Py2Exe, PyInstaller, and cx_Freeze are used to bundle Python
  code into standalone executables. Threat actors often use these tools to bundle malicious Python scripts into executables,
  sometimes to obfuscate the code or to bypass security measures.
severity: low
source: events
attack:
- T1027.002
tags:
- sigma
- image_load
- stealth
references:
- https://www.py2exe.org/
- https://unit42.paloaltonetworks.com/unit-42-technical-analysis-seaduke/
where:
  all_of:
  - channel|contains: sysmon
    eventId: 7
  - description: Python Core
  - not:
      any_of:
      - image|contains: Python
      - image|startswith:
        - C:\Program Files\
        - C:\Program Files (x86)\
        - C:\ProgramData\Anaconda3\
  - not:
      image|exists: false
