id: sigma-c9e5f013-4a6f-4d8c-9b0e-f7a4c3d26e95
title: Potentially Suspicious Image Load of Offreg.dll
description: Detects potentially suspicious loading of the Offline Registry Library (offreg.dll). Offreg.dll enables direct
  read/write access to offline registry hives without invoking the Windows Registry API, bypassing its associated audit logging
  and telemetry. Attackers may abuse this to stealthily modify registry hives while evading detection mechanisms that rely
  on standard registry event logs.
severity: medium
source: events
attack:
- T1112
tags:
- sigma
- image_load
- defense-impairment
- persistence
references:
- https://learn.microsoft.com/en-us/windows/win32/devnotes/about-the-offline-registry-library
- https://github.com/MSNightmare/LegacyHive
where:
  channel|contains: sysmon
  eventId: 7
  imageLoaded|endswith: \offreg.dll
  not:
    any_of:
    - image|startswith:
      - C:\Windows\System32\
      - C:\Windows\SysWOW64\
      - C:\Windows\WinSxS\
    - image|startswith:
      - C:\Program Files\
      - C:\Program Files (x86)\
    - image|startswith: C:\Users\
      image|contains: \AppData\Local\Programs\
    - image|startswith: C:\ProgramData\Microsoft\Windows Defender\Platform\
      image|endswith: \MsMpEng.exe
sigma:
  id: c9e5f013-4a6f-4d8c-9b0e-f7a4c3d26e95
  status: experimental
  author: Swachchhanda Shrawan Poudel (Nextron Systems)
  date: '2026-07-23'
  level: medium
  logsource:
    category: image_load
    product: windows
  falsepositives:
  - Third-party backup or forensic software that performs offline registry parsing
  - Windows deployment tools (DISM, ADK) run from non-standard paths
