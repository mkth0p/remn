id: sigma-333cdbe8-27bb-4246-bf82-b41a0dca4b70
title: Suspicious Volume Shadow Copy VSS_PS.dll Load
description: Detects the image load of vss_ps.dll by uncommon executables. This DLL is used by the Volume Shadow Copy Service
  (VSS) to manage shadow copies of files and volumes. It is often abused by attackers to delete or manipulate shadow copies,
  which can hinder forensic investigations and data recovery efforts. The fact that it is loaded by processes that are not
  typically associated with VSS operations can indicate suspicious activity.
severity: high
source: events
attack:
- T1490
tags:
- sigma
- image_load
- impact
references:
- https://www.virustotal.com/gui/file/ba88ca45589fae0139a40ca27738a8fc2dfbe1be5a64a9558f4e0f52b35c5add
- https://twitter.com/am0nsec/status/1412232114980982787
where:
  all_of:
  - channel|contains: sysmon
    eventId: 7
  - imageLoaded|endswith: \vss_ps.dll
  - not:
      any_of:
      - image|startswith: C:\Windows\
        image|endswith:
        - \clussvc.exe
        - \dismhost.exe
        - \dllhost.exe
        - \inetsrv\appcmd.exe
        - \inetsrv\iissetup.exe
        - \msiexec.exe
        - \rundll32.exe
        - \searchindexer.exe
        - \srtasks.exe
        - \svchost.exe
        - \System32\SystemPropertiesAdvanced.exe
        - \taskhostw.exe
        - \thor.exe
        - \thor64.exe
        - \tiworker.exe
        - \vssvc.exe
        - \vssadmin.exe
        - \WmiPrvSE.exe
        - \wsmprovhost.exe
      - commandLine|startswith: C:\$WinREAgent\Scratch\
        commandLine|contains: \dismhost.exe {
      - image|exists: false
  - not:
      image|startswith:
      - C:\Program Files\
      - C:\Program Files (x86)\
