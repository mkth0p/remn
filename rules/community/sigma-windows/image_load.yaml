id: sigma-0cbe38c0-270c-41d9-ab79-6e5a9a669290
title: Trusted Path Bypass via Windows Directory Spoofing
description: Detects DLLs loading from a spoofed Windows directory path with an extra space (e.g "C:\Windows \System32") which
  can bypass Windows trusted path verification. This technique tricks Windows into treating the path as trusted, allowing
  malicious DLLs to load with high integrity privileges bypassing UAC.
