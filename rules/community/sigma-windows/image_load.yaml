id: sigma-06ce37c2-61ab-4f05-9ff5-b1a96d18ae32
title: WMIC Loading Scripting Libraries
description: Detects threat actors proxy executing code and bypassing application controls by leveraging wmic and the `/FORMAT`
  argument switch to download and execute an XSL file (i.e js, vbs, etc). It could be an indicator of SquiblyTwo technique,
  which uses Windows Management Instrumentation (WMI) to execute malicious code.
severity: medium
source: events
attack:
- T1220
tags:
- sigma
- image_load
- stealth
references:
- https://securitydatasets.com/notebooks/atomic/windows/defense_evasion/SDWIN-201017061100.html
- https://twitter.com/dez_/status/986614411711442944
- https://lolbas-project.github.io/lolbas/Binaries/Wmic/
where:
  channel|contains: sysmon
  eventId: 7
  image|endswith: \wmic.exe
  imageLoaded|endswith:
  - \jscript.dll
  - \vbscript.dll
sigma:
  id: 06ce37c2-61ab-4f05-9ff5-b1a96d18ae32
  status: test
  author: Roberto Rodriguez (Cyb3rWard0g), OTR (Open Threat Research)
  date: '2020-10-17'
  modified: '2022-10-13'
  level: medium
  logsource:
    category: image_load
    product: windows
  falsepositives:
  - The command wmic os get lastbootuptime loads vbscript.dll
  - The command wmic os get locale loads vbscript.dll
  - Since the ImageLoad event doesn't have enough information in this case. It's better to look at the recent process creation
    events that spawned the WMIC process and investigate the command line and parent/child processes to get more insights
  - The command `wmic ntevent` loads vbscript.dll
