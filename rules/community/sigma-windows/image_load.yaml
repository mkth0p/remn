id: sigma-6e8fe0a8-ba0b-4a93-8f9e-82657e7a5984
title: BaaUpdate.exe Suspicious DLL Load
description: Detects BitLocker Access Agent Update Utility (baaupdate.exe) loading DLLs from suspicious locations that are
  publicly writable which could indicate an attempt to lateral movement via BitLocker DCOM & COM Hijacking. This technique
  abuses COM Classes configured as INTERACTIVE USER to spawn processes in the context of the logged-on user's session. Specifically,
  it targets the BDEUILauncher Class (CLSID ab93b6f1-be76-4185-a488-a9001b105b94) which can launch BaaUpdate.exe, which is
  vulnerable to COM Hijacking when started with input parameters. This allows attackers to execute code in the user's context
  without needing to steal credentials or use additional techniques to compromise the account.
severity: high
source: events
attack:
- T1218
- T1021.003
tags:
- sigma
- image_load
- stealth
- lateral-movement
references:
- https://github.com/rtecCyberSec/BitlockMove
where:
  channel|contains: sysmon
  eventId: 7
  image|endswith: \BaaUpdate.exe
  imageLoaded|endswith: .dll
  imageLoaded|contains_any:
  - :\Perflogs\
  - :\Users\Default\
  - :\Users\Public\
  - :\Windows\Temp\
  - \AppData\Local\Temp\
  - \AppData\Roaming\
  - \Contacts\
  - \Favorites\
  - \Favourites\
  - \Links\
  - \Music\
  - \Pictures\
  - \ProgramData\
  - \Temporary Internet
  - \Videos\
