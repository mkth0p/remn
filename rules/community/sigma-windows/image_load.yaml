id: sigma-e5f5c693-52d7-4de5-88ae-afbfbce85595
title: Unsigned .node File Loaded
description: Detects the loading of unsigned .node files. Adversaries may abuse a lack of .node integrity checking to execute
  arbitrary code inside of trusted applications such as Slack. .node files are native add-ons for Electron-based applications,
  which are commonly used for desktop applications like Slack, Discord, and Visual Studio Code. This technique has been observed
  in the DripLoader malware, which uses unsigned .node files to load malicious native code into Electron applications.
severity: medium
source: events
attack:
- T1129
- T1574.001
- T1036.005
tags:
- sigma
- image_load
- execution
- privilege-escalation
- persistence
- stealth
references:
- https://www.coreycburton.com/blog/driploader-case-study
- https://github.com/CoreyCBurton/DripLoaderNG
- https://www.electronjs.org/docs/latest/tutorial/native-code-and-electron
where:
  channel|contains: sysmon
  eventId: 7
  imageLoaded|endswith: .node
  any_of:
  - signed: 'false'
  - signatureStatus: Unavailable
  not:
    any_of:
    - image|endswith: \Code.exe
      imageLoaded|contains: .vscode\extensions\ms-toolsai.jupyter-
      imageLoaded|endswith:
      - \electron.napi.node
      - \node.napi.glibc.node
    - image|contains: \Microsoft VS Code\Code.exe
      imageLoaded|contains: \Microsoft VS Code\resources\app\node_modules
    - image|contains_any:
      - C:\Program Files (x86)\
      - C:\Program Files\
      - \AppData\Local\Programs\
      image|endswith: \Evernote\Evernote.exe
      imageLoaded|contains: \Evernote\resources\app
sigma:
  id: e5f5c693-52d7-4de5-88ae-afbfbce85595
  status: experimental
  author: Jonathan Beierle (@hullabrian)
  date: '2025-11-22'
  modified: '2026-08-27'
  level: medium
  logsource:
    category: image_load
    product: windows
  falsepositives:
  - VsCode extensions or similar legitimate tools might use unsigned .node files. These should be investigated on a case-by-case
    basis, and whitelisted if determined to be benign.
