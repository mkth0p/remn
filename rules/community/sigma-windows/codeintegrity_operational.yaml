id: sigma-f8931561-97f5-4c46-907f-0a4a592e47a7
title: CodeIntegrity - Unmet Signing Level Requirements By File Under Validation
description: Detects attempted file load events that did not meet the signing level requirements. It often means the file's
  signature is revoked or a signature with the Lifetime Signing EKU has expired. This event is best correlated with EID 3089
  to determine the error of the validation.
severity: low
source: events
tags:
- sigma
- codeintegrity-operational
- execution
references:
- https://twitter.com/SBousseaden/status/1483810148602814466
- https://github.com/MicrosoftDocs/windows-itpro-docs/blob/40fe118976734578f83e5e839b9c63ae7a4af82d/windows/security/threat-protection/windows-defender-application-control/event-id-explanations.md#windows-codeintegrity-operational-log
- https://learn.microsoft.com/en-us/windows/security/application-security/application-control/windows-defender-application-control/operations/event-tag-explanations
- https://learn.microsoft.com/en-us/windows/security/application-security/application-control/windows-defender-application-control/operations/event-id-explanations
where:
  all_of:
  - channel|contains: codeintegrity/operational
  - eventId|in:
    - 3033
    - 3034
  - not:
      data.FileNameBuffer|contains: \Windows\assembly\GAC\
      data.ProcessNameBuffer|endswith: \mscorsvw.exe
      data.ProcessNameBuffer|contains: \Windows\Microsoft.NET\
      data.RequestedPolicy: 8
  - not:
      any_of:
      - data.FileNameBuffer|endswith: \Program Files\DTrace\dtrace.dll
        data.ProcessNameBuffer|endswith: \Windows\System32\svchost.exe
        data.RequestedPolicy: 12
      - data.FileNameBuffer|contains: \Windows\System32\DriverStore\FileRepository\
        data.FileNameBuffer|endswith: \igd10iumd64.dll
        data.RequestedPolicy: 7
      - data.FileNameBuffer|endswith: \Windows\System32\nvspcap64.dll
        data.ProcessNameBuffer|endswith:
        - \AppData\Local\Keybase\Gui\Keybase.exe
        - \Microsoft\Teams\stage\Teams.exe
        data.RequestedPolicy: 8
      - data.FileNameBuffer|endswith: \Program Files\Bonjour\mdnsNSP.dll
        data.ProcessNameBuffer|endswith:
        - \Windows\System32\svchost.exe
        - \Windows\System32\SIHClient.exe
        data.RequestedPolicy|in:
        - 8
        - 12
      - data.FileNameBuffer|contains: \Microsoft Office\root\vfs\ProgramFilesCommonX64\Microsoft Shared\OFFICE
        data.FileNameBuffer|endswith: \MSOXMLMF.DLL
        data.RequestedPolicy: 7
      - data.ProcessNameBuffer|contains: \Program Files\Microsoft Office\root\vfs\ProgramFilesCommonX64\Microsoft Shared\Office
        data.FileNameBuffer|contains: \Windows\System32\
        data.RequestedPolicy: 8
      - data.FileNameBuffer|endswith: \Windows\System32\nvspcap64.dll
        data.ProcessNameBuffer|contains: \AppData\Local\slack\app-
        data.ProcessNameBuffer|endswith: \slack.exe
        data.RequestedPolicy: 8
      - data.FileNameBuffer|endswith:
        - \Mozilla Firefox\mozavcodec.dll
        - \Mozilla Firefox\mozavutil.dll
        data.ProcessNameBuffer|endswith: \Mozilla Firefox\firefox.exe
        data.RequestedPolicy: 8
      - data.FileNameBuffer|endswith:
        - \Program Files\Avast Software\Avast\aswAMSI.dll
        - \Program Files (x86)\Avast Software\Avast\aswAMSI.dll
        data.RequestedPolicy|in:
        - 8
        - 12
      - data.FileNameBuffer|contains: \Program Files\Google\Drive File Stream\
        data.FileNameBuffer|endswith: \crashpad_handler.exe
        data.ProcessNameBuffer|endswith: \Windows\ImmersiveControlPanel\SystemSettings.exe
        data.RequestedPolicy: 8
      - data.FileNameBuffer|endswith: \Trend Micro\Client Server Security Agent\perficrcperfmonmgr.dll
        data.RequestedPolicy: 8
      - data.FileNameBuffer|endswith: '\Program Files\National Instruments\Shared\mDNS Responder\nimdnsNSP.dll '
      - data.FileNameBuffer|endswith:
        - \Program Files\McAfee\Endpoint Security\Threat Prevention\MfeAmsiProvider.dll
        - \Program Files\McAfee\MfeAV\AMSIExt.dll
      - data.FileNameBuffer|endswith: \Program Files\ESET\ESET Security\eamsi.dll
      - data.FileNameBuffer|endswith: \Program Files\comodo\comodo internet security\amsiprovider_x64.dll
      - data.FileNameBuffer|contains: \Program Files\SentinelOne\Sentinel Agent
      - data.ProcessNameBuffer|contains: \Program Files\SentinelOne\Sentinel Agent
      - data.FileNameBuffer|contains: \National Instruments\Shared\mDNS Responder\
      - data.ProcessNameBuffer|contains_all:
        - \Kaspersky Lab\
        - \avp.exe
      - data.FileNameBuffer|contains_all:
        - \Kaspersky Lab\
        - \antimalware_provider.dll
