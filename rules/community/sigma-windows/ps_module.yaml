id: sigma-f99276ad-d122-4989-a09a-d00904a5f9d2
title: Clear PowerShell History - PowerShell Module
description: Detects keywords that could indicate clearing PowerShell history
severity: medium
source: events
attack:
- T1070.003
tags:
- sigma
- ps_module
- stealth
references:
- https://gist.github.com/hook-s3c/7363a856c3cdbadeb71085147f042c1a
where:
  channel|contains: powershell/operational
  eventId: 4103
  any_of:
  - payload|contains_all:
    - Set-PSReadlineOption
    - –HistorySaveStyle
    - SaveNothing
  - payload|contains_all:
    - Set-PSReadlineOption
    - -HistorySaveStyle
    - SaveNothing
  - payload|contains_any:
    - del
    - Remove-Item
    - rm
    payload|contains: (Get-PSReadlineOption).HistorySavePath
