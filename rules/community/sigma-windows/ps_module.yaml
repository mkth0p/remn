id: sigma-815bfc17-7fc6-4908-a55e-2f37b98cedb4
title: AD Groups Or Users Enumeration Using PowerShell - PoshModule
description: Adversaries may attempt to find domain-level groups and permission settings. The knowledge of domain-level permission
  groups can help adversaries determine which groups exist and which users belong to a particular group. Adversaries may use
  this information to determine which users have elevated permissions, such as domain administrators.
severity: low
source: events
attack:
- T1069.001
tags:
- sigma
- ps_module
- discovery
references:
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1069.002/T1069.002.md
where:
  channel|contains: powershell/operational
  eventId: 4103
  any_of:
  - payload|contains: get-ADPrincipalGroupMembership
  - contextInfo|contains: get-ADPrincipalGroupMembership
  - payload|contains_all:
    - get-aduser
    - '-f '
    - '-pr '
    - DoesNotRequirePreAuth
  - contextInfo|contains_all:
    - get-aduser
    - '-f '
    - '-pr '
    - DoesNotRequirePreAuth
