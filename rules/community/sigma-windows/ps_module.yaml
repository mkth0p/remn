id: sigma-daf7eb81-35fd-410d-9d7a-657837e602bb
title: Zip A Folder With PowerShell For Staging In Temp  - PowerShell Module
description: Detects PowerShell scripts that make use of the "Compress-Archive" Cmdlet in order to compress folders and files
  where the output is stored in a potentially suspicious location that is used often by malware for exfiltration. An adversary
  might compress data (e.g., sensitive documents) that is collected prior to exfiltration in order to make it portable and
  minimize the amount of data sent over the network.
severity: medium
source: events
attack:
- T1074.001
tags:
- sigma
- ps_module
- collection
references:
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1074.001/T1074.001.md
- https://www.cisa.gov/news-events/cybersecurity-advisories/aa23-347a
where:
  all_of:
  - channel|contains: powershell/operational
    eventId: 4103
  - contextInfo|re: Compress\-Archive\ \-Path.*\-DestinationPath\ \$env:TEMP
  - contextInfo|re: Compress\-Archive\ \-Path.*\-DestinationPath.*\\AppData\\Local\\Temp\\
  - contextInfo|re: Compress\-Archive\ \-Path.*\-DestinationPath.*:\\Windows\\Temp\\
sigma:
  id: daf7eb81-35fd-410d-9d7a-657837e602bb
