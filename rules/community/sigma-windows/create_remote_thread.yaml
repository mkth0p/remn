id: sigma-c0aac16a-b1e7-4330-bab0-3c27bb4987c7
title: Remote Thread Creation In Mstsc.Exe From Suspicious Location
description: Detects remote thread creation in the "mstsc.exe" process by a process located in a potentially suspicious location.
  This technique is often used by attackers in order to hook some APIs used by DLLs loaded by "mstsc.exe" during RDP authentications
  in order to steal credentials.
severity: high
source: events
tags:
- sigma
- create_remote_thread
- credential-access
references:
- https://github.com/S12cybersecurity/RDPCredentialStealer/blob/1b8947cdd065a06c1b62e80967d3c7af895fcfed/APIHookInjectorBin/APIHookInjectorBin/Inject.h#L25
where:
  channel|contains: sysmon
  eventId: 8
  targetImage|endswith: \mstsc.exe
  sourceImage|contains_any:
  - :\Temp\
  - :\Users\Public\
  - :\Windows\PerfLogs\
  - :\Windows\Tasks\
  - :\Windows\Temp\
  - \AppData\Local\Temp\
