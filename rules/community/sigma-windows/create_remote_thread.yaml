id: sigma-02d1d718-dd13-41af-989d-ea85c7fab93f
title: Rare Remote Thread Creation By Uncommon Source Image
description: Detects uncommon processes creating remote threads.
severity: high
source: events
attack:
- T1055
tags:
- sigma
- create_remote_thread
- privilege-escalation
- stealth
references:
- Personal research, statistical analysis
- https://lolbas-project.github.io
where:
  all_of:
  - channel|contains: sysmon
    eventId: 8
  - sourceImage|endswith:
    - \bash.exe
    - \cscript.exe
    - \cvtres.exe
    - \defrag.exe
    - \dialer.exe
    - \dnx.exe
    - \esentutl.exe
    - \excel.exe
    - \expand.exe
    - \find.exe
    - \findstr.exe
    - \forfiles.exe
    - \gpupdate.exe
    - \hh.exe
    - \installutil.exe
    - \lync.exe
    - \makecab.exe
    - \mDNSResponder.exe
    - \monitoringhost.exe
    - \msbuild.exe
    - \mshta.exe
    - \mspaint.exe
    - \outlook.exe
    - \ping.exe
    - \provtool.exe
    - \python.exe
    - \regsvr32.exe
    - \robocopy.exe
    - \runonce.exe
    - \sapcimc.exe
    - \smartscreen.exe
    - \spoolsv.exe
    - \tstheme.exe
    - \userinit.exe
    - \vssadmin.exe
    - \vssvc.exe
    - \w3wp.exe
    - \winscp.exe
    - \winword.exe
    - \wmic.exe
    - \wscript.exe
  - not:
      any_of:
      - sourceImage|in:
        - C:\Windows\System32\Defrag.exe
        - C:\Windows\System32\makecab.exe
        targetImage: C:\Windows\System32\conhost.exe
      - sourceImage: C:\Windows\System32\provtool.exe
        targetImage: C:\Windows\System32\svchost.exe
      - sourceImage: C:\Windows\System32\provtool.exe
        targetImage: System
      - sourceImage: C:\Windows\System32\userinit.exe
        targetImage: C:\Windows\explorer.exe
      - sourceImage|endswith: \WINWORD.EXE
        targetImage|startswith:
        - C:\Program Files (x86)\
        - C:\Program Files\
      - sourceImage|startswith:
        - C:\Program Files\Microsoft Office\
        - C:\Program Files (x86)\Microsoft Office\
        targetImage: System
  - not:
      sourceImage|endswith: \SysWOW64\explorer.exe
      targetImage|in:
      - C:\Program Files (x86)\VMware\VMware Tools\vmtoolsd.exe
      - C:\Program Files\VMware\VMware Tools\vmtoolsd.exe
