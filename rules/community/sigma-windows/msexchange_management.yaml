id: sigma-516376b4-05cd-4122-bae0-ad7641c38d48
title: Mailbox Export to Exchange Webserver
description: Detects a successful export of an Exchange mailbox to untypical directory or with aspx name suffix which can
  be used to place a webshell or the needed role assignment for it
severity: critical
source: events
attack:
- T1505.003
tags:
- sigma
- msexchange-management
- persistence
references:
- https://blog.orange.tw/2021/08/proxylogon-a-new-attack-surface-on-ms-exchange-part-1.html
where:
  channel|contains: msexchange management
  any_of:
  - raw|contains_all:
    - New-MailboxExportRequest
    - ' -Mailbox '
    raw|contains_any:
    - -FilePath "\\\\
    - .aspx
  - raw|contains_all:
    - New-ManagementRoleAssignment
    - ' -Role "Mailbox Import Export"'
    - ' -User '
