id: sigma-0d7ceeef-3539-4392-8953-3dc664912714
title: UAC Secure Desktop Prompt Disabled
description: Detects when an attacker tries to change User Account Control (UAC) elevation request destination via the "PromptOnSecureDesktop"
  value. The "PromptOnSecureDesktop" setting specifically determines whether UAC prompts are displayed on the secure desktop.
  The secure desktop is a separate desktop environment that's isolated from other processes running on the system. It's designed
  to prevent malicious software from intercepting or tampering with UAC prompts. When "PromptOnSecureDesktop" is set to 0,
  UAC prompts are displayed on the user's current desktop instead of the secure desktop. This reduces the level of security
  because it potentially exposes the prompts to manipulation by malicious software.
severity: medium
source: events
attack:
- T1548.002
tags:
- sigma
- registry_set
- privilege-escalation
references:
- https://github.com/redcanaryco/atomic-red-team/blob/7e11e9b79583545f208a6dc3fa062f2ed443d999/atomics/T1548.002/T1548.002.md
where:
  channel|contains: sysmon
  eventId: 13
  targetObject|contains: \Microsoft\Windows\CurrentVersion\Policies\System\PromptOnSecureDesktop
  details: DWORD (0x00000000)
