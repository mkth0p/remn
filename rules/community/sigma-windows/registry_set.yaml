id: sigma-3fd4c8d7-8362-4557-a8e6-83b29cc0d724
title: IE ZoneMap Setting Downgraded To MyComputer Zone For HTTP Protocols
description: Detects changes to Internet Explorer's (IE / Windows Internet properties) ZoneMap configuration of the "HTTP"
  and "HTTPS" protocols to point to the "My Computer" zone. This allows downloaded files from the Internet to be granted the
  same level of trust as files stored locally.
