id: sigma-73a883d0-0348-4be4-a8d8-51031c2564f8
title: Potential Registry Persistence Attempt Via Windows Telemetry
description: Detects potential persistence behavior using the windows telemetry registry key. Windows telemetry makes use
  of the binary CompatTelRunner.exe to run a variety of commands and perform the actual telemetry collections. This binary
  was created to be easily extensible, and to that end, it relies on the registry to instruct on which commands to run. The
  problem is, it will run any arbitrary command without restriction of location or type.
severity: high
source: events
attack:
- T1053.005
tags:
- sigma
- registry_set
- privilege-escalation
- execution
- persistence
references:
- https://www.trustedsec.com/blog/abusing-windows-telemetry-for-persistence/
where:
  channel|contains: sysmon
  eventId: 13
  targetObject|contains: \SOFTWARE\Microsoft\Windows NT\CurrentVersion\AppCompatFlags\TelemetryController\
  targetObject|endswith: \Command
  details|contains_any:
  - .bat
  - .bin
  - .cmd
  - .dat
  - .dll
  - .exe
  - .hta
  - .jar
  - .js
  - .msi
  - .ps
  - .sh
  - .vb
  not:
    details|contains_any:
    - \system32\CompatTelRunner.exe
    - \system32\DeviceCensus.exe
sigma:
  id: 73a883d0-0348-4be4-a8d8-51031c2564f8
