id: sigma-a07f0359-4c90-4dc4-a681-8ffea40b4f47
title: Service Binary in Suspicious Folder
description: Detect the creation of a service with a service binary located in a suspicious directory
severity: high
source: events
attack:
- T1112
tags:
- sigma
- registry_set
- persistence
- defense-impairment
references:
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1562.001/T1562.001.md
where:
  channel|contains: sysmon
  eventId: 13
  any_of:
  - targetObject|startswith: HKLM\System\CurrentControlSet\Services\
    targetObject|endswith: \Start
    image|contains_any:
    - \Users\Public\
    - \Perflogs\
    - \ADMIN$\
    - \Temp\
    details|in:
    - DWORD (0x00000000)
    - DWORD (0x00000001)
    - DWORD (0x00000002)
  - targetObject|startswith: HKLM\System\CurrentControlSet\Services\
    targetObject|endswith: \ImagePath
    details|contains_any:
    - \Users\Public\
    - \Perflogs\
    - \ADMIN$\
    - \Temp\
  not:
    any_of:
    - image|contains_all:
      - \Common Files\
      - \Temp\
    - targetObject|endswith: \CurrentControlSet\Services\MBAMInstallerService\ImagePath
      details|endswith: \AppData\Local\Temp\MBAMInstallerService.exe"
      image: C:\Windows\system32\services.exe
