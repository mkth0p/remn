id: sigma-fecfd1a1-cc78-4313-a1ea-2ee2e8ec27a7
title: PowerShell Logging Disabled Via Registry Key Tampering
description: Detects changes to the registry for the currently logged-in user. In order to disable PowerShell module logging,
  script block logging or transcription and script execution logging
severity: high
source: events
attack:
- T1564.001
- T1112
tags:
- sigma
- registry_set
- stealth
- defense-impairment
- persistence
