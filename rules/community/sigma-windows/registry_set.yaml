  process of exfiltrating data. With this enabled organization will lose visibility into data such as query type, response
  and originating IP that are used to determine bad actors.
severity: medium
source: events
attack:
- T1140
- T1112
tags:
- sigma
- registry_set
- persistence
- stealth
- defense-impairment
