where:
  channel|contains: sysmon
  eventId: 13
  targetObject|contains: \SOFTWARE\Microsoft\Windows\CurrentVersion\Explorer\VolumeCaches\
  any_of:
  - targetObject|contains: \Autorun
    details: DWORD (0x00000001)
  - targetObject|contains_any:
    - \CleanupString
    - \PreCleanupString
    details|contains_any:
    - cmd
    - powershell
    - rundll32
    - mshta
    - cscript
    - wscript
