id: sigma-fdbf0b9d-0182-4c43-893b-a1eaab92d085
title: Potential Persistence Via Custom Protocol Handler
description: Detects potential persistence activity via the registering of a new custom protocole handlers. While legitimate
  applications register protocole handlers often times during installation. And attacker can abuse this by setting a custom
  handler to be used as a persistence mechanism.
severity: medium
source: events
attack:
- T1112
tags:
- sigma
- registry_set
- persistence
- defense-impairment
references:
- https://ladydebug.com/blog/2019/06/21/custom-protocol-handler-cph/
where:
  channel|contains: sysmon
  eventId: 13
  targetObject|startswith: HKCR\
  details|startswith: 'URL:'
  not:
    any_of:
    - details|startswith: URL:ms-
    - image|startswith:
      - C:\Program Files (x86)
      - C:\Program Files\
      - C:\Windows\System32\
      - C:\Windows\SysWOW64\
sigma:
  id: fdbf0b9d-0182-4c43-893b-a1eaab92d085
  status: test
  author: Nasreddine Bencherchali (Nextron Systems)
  date: '2022-05-30'
  modified: '2023-05-12'
  level: medium
  logsource:
    category: registry_set
    product: windows
  falsepositives:
  - Many legitimate applications can register a new custom protocol handler. Additional filters needs to applied according
    to your environment.
