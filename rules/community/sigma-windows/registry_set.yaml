id: sigma-73921b9c-cafd-4446-b0c6-fdb0ace42bc0
title: Windows Credential Guard Disabled - Registry
description: Detects attempts to disable Windows Credential Guard by setting registry values to 0. Credential Guard uses virtualization-based
  security to isolate secrets so that only privileged system software can access them. Adversaries may disable Credential
  Guard to gain access to sensitive credentials stored in the system, such as NTLM hashes and Kerberos tickets, which can
  be used for lateral movement and privilege escalation.
severity: high
source: events
attack:
- T1685
tags:
- sigma
- registry_set
- defense-impairment
references:
- https://woshub.com/disable-credential-guard-windows/
where:
  channel|contains: sysmon
  eventId: 13
  targetObject|endswith:
  - \DeviceGuard\EnableVirtualizationBasedSecurity
  - \DeviceGuard\LsaCfgFlags
  - \Lsa\LsaCfgFlags
  details: DWORD (0x00000000)
