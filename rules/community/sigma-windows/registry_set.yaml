id: sigma-20f0ee37-5942-4e45-b7d5-c5b5db9df5cd
title: CurrentVersion Autorun Keys Modification
description: Detects modification of autostart extensibility point (ASEP) in registry.
severity: medium
source: events
attack:
- T1547.001
tags:
- sigma
- registry_set
- privilege-escalation
- persistence
references:
