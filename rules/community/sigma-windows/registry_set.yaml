id: sigma-ba226dcf-d390-4642-b9af-b534872f1156
title: Windows Event Log Access Tampering Via Registry
description: Detects changes to the Windows EventLog channel permission values. It focuses on changes to the Security Descriptor
  Definition Language (SDDL) string, as modifications to these values can restrict access to specific users or groups, potentially
  aiding in defense evasion by controlling who can view or modify a event log channel. Upon execution, the user shouldn't
  be able to access the event log channel via the event viewer or via utilities such as "Get-EventLog" or "wevtutil".
severity: high
source: events
attack:
- T1547.001
- T1112
tags:
- sigma
- registry_set
- privilege-escalation
- persistence
- defense-impairment
references:
- https://www.atomicredteam.io/atomic-red-team/atomics/T1562.002#atomic-test-8---modify-event-log-channel-access-permissions-via-registry---powershell
- https://www.youtube.com/watch?v=uSYvHUVU8xY
- https://learn.microsoft.com/en-us/windows/win32/secauthz/security-descriptor-definition-language
where:
  all_of:
  - channel|contains: sysmon
    eventId: 13
  - any_of:
    - targetObject|contains: \SYSTEM\CurrentControlSet\Services\EventLog\
      targetObject|endswith: \CustomSD
    - targetObject|contains_any:
      - \Policies\Microsoft\Windows\EventLog\
      - \Microsoft\Windows\CurrentVersion\WINEVT\Channels
      targetObject|endswith: \ChannelAccess
  - any_of:
    - details|contains: D:(D;
    - details|contains_all:
      - D:(
      - )(D;
  - not:
      any_of:
      - image: C:\Windows\servicing\TrustedInstaller.exe
      - image|startswith: C:\Windows\WinSxS\
        image|endswith: \TiWorker.exe
  - not:
      any_of:
      - image: ''
      - image|exists: false
