id: sigma-9d8f9bb8-01af-4e15-a3a2-349071530530
title: Suspicious Path In Keyboard Layout IME File Registry Value
description: Detects usage of Windows Input Method Editor (IME) keyboard layout feature, which allows an attacker to load
  a DLL into the process after sending the WM_INPUTLANGCHANGEREQUEST message. Before doing this, the client needs to register
  the DLL in a special registry key that is assumed to implement this keyboard layout. This registry key should store a value
  named "Ime File" with a DLL path. IMEs are essential for languages that have more characters than can be represented on
  a standard keyboard, such as Chinese, Japanese, and Korean.
severity: high
source: events
attack:
- T1685
tags:
- sigma
- registry_set
- defense-impairment
references:
- https://www.linkedin.com/pulse/guntior-story-advanced-bootkit-doesnt-rely-windows-disk-baranov-wue8e/
where:
  channel|contains: sysmon
  eventId: 13
  targetObject|contains_all:
  - \Control\Keyboard Layouts\
  - Ime File
  any_of:
  - details|contains_any:
    - :\Perflogs\
    - :\Users\Public\
    - :\Windows\Temp\
    - \AppData\Local\Temp\
    - \AppData\Roaming\
    - \Temporary Internet
  - details|contains_all:
    - :\Users\
    - \Favorites\
  - details|contains_all:
    - :\Users\
    - \Favourites\
  - details|contains_all:
    - :\Users\
    - \Contacts\
sigma:
  id: 9d8f9bb8-01af-4e15-a3a2-349071530530
