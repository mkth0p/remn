title: Potential Persistence Via AppCompat RegisterAppRestart Layer
description: Detects the setting of the REGISTERAPPRESTART compatibility layer on an application. This compatibility layer
  allows an application to register for restart using the "RegisterApplicationRestart" API. This can be potentially abused
  as a persistence mechanism.
severity: medium
source: events
attack:
- T1546.011
tags:
- sigma
- registry_set
- privilege-escalation
- persistence
