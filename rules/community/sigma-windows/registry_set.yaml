id: sigma-9e8894c0-0ae0-11ef-9d85-1f2942bec57c
title: Suspicious Shell Open Command Registry Modification
description: Detects modifications to shell open registry keys that point to suspicious locations typically used by malware
  for persistence. Generally, modifications to the `*\shell\open\command` registry key can indicate an attempt to change the
  default action for opening files, and various UAC bypass or persistence techniques involve modifying these keys to execute
  malicious scripts or binaries.
severity: medium
source: events
attack:
- T1548.002
- T1546.001
tags:
- sigma
- registry_set
- privilege-escalation
- persistence
references:
- https://www.trendmicro.com/en_us/research/25/f/water-curse.html
where:
  channel|contains: sysmon
  eventId: 13
  targetObject|contains: \shell\open\command\
  details|contains_any:
  - \$Recycle.Bin\
  - \AppData\Local\Temp\
  - \Contacts\
  - \Music\
  - \PerfLogs\
  - \Photos\
  - \Pictures\
  - \Users\Public\
  - \Videos\
  - \Windows\Temp\
  - '%AppData%'
  - '%LocalAppData%'
  - '%Temp%'
  - '%tmp%'
sigma:
  id: 9e8894c0-0ae0-11ef-9d85-1f2942bec57c
  status: experimental
  author: Swachchhanda Shrawan Poudel (Nextron Systems)
  date: '2026-01-24'
  level: medium
  logsource:
    category: registry_set
    product: windows
  falsepositives:
  - Legitimate software installations or updates that modify the shell open command registry keys to these locations.
