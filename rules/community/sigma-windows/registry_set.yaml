id: sigma-0e6a9e62-627e-496c-aef5-bfa39da29b5e
title: MaxMpxCt Registry Value Changed
description: Detects changes to the "MaxMpxCt" registry value. MaxMpxCt specifies the maximum outstanding network requests
  for the server per client, which is used when negotiating a Server Message Block (SMB) connection with a client. Note if
  the value is set beyond 125 older Windows 9x clients will fail to negotiate. Ransomware threat actors and operators (specifically
  BlackCat) were seen increasing this value in order to handle a higher volume of traffic.
severity: low
source: events
attack:
- T1070.005
tags:
- sigma
- registry_set
- stealth
references:
- https://www.huntress.com/blog/blackcat-ransomware-affiliate-ttps
