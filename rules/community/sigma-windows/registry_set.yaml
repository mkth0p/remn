id: sigma-a7df0e9e-91a5-459a-a003-4cde67c2ff5d
title: Potentially Suspicious Command Executed Via Run Dialog Box - Registry
description: Detects execution of commands via the run dialog box on Windows by checking values of the "RunMRU" registry key.
  This technique was seen being abused by threat actors to deceive users into pasting and executing malicious commands, often
  disguised as CAPTCHA verification steps.
severity: high
source: events
attack:
- T1059.001
tags:
- sigma
- registry_set
- execution
references:
- https://medium.com/@ahmed.moh.farou2/fake-captcha-campaign-on-arabic-pirated-movie-sites-delivers-lumma-stealer-4f203f7adabf
- https://medium.com/@shaherzakaria8/downloading-trojan-lumma-infostealer-through-capatcha-1f25255a0e71
- https://www.forensafe.com/blogs/runmrukey.html
- https://redcanary.com/blog/threat-intelligence/intelligence-insights-october-2024/
where:
  channel|contains: sysmon
  eventId: 13
  targetObject|contains: \Microsoft\Windows\CurrentVersion\Explorer\RunMRU
  any_of:
  - all_of:
    - details|contains_any:
      - powershell
      - pwsh
    - details|contains_any:
      - ' -e '
      - ' -ec '
      - ' -en '
      - ' -enc '
      - ' -enco'
      - ftp
      - Hidden
      - http
      - iex
      - Invoke-
  - details|contains: wmic
    details|contains_any:
    - shadowcopy
    - process call create
