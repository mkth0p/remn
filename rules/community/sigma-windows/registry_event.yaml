id: sigma-5a9e1b2c-8f7d-4a1e-9b3c-0f6d7e5a4b1f
title: Windows Defender Threat Severity Default Action Modified
description: Detects modifications or creations of Windows Defender's default threat action settings based on severity to
  'allow' or take 'no action'. This is a highly suspicious configuration change that effectively disables Defender's ability
  to automatically mitigate threats of a certain severity level, allowing malicious software to run unimpeded. An attacker
  might use this technique to bypass defenses before executing payloads.
severity: high
source: events
attack:
- T1685
tags:
- sigma
- registry_event
- defense-impairment
references:
- https://learn.microsoft.com/en-us/powershell/module/defender/set-mppreference
- https://learn.microsoft.com/en-us/windows-hardware/customize/desktop/unattend/security-malware-windows-defender-threatseveritydefaultaction
- https://research.splunk.com/endpoint/7215831c-8252-4ae3-8d43-db588e82f952
- https://gist.github.com/Dump-GUY/8daef859f382b895ac6fd0cf094555d2
- https://thedfirreport.com/2021/10/18/icedid-to-xinglocker-ransomware-in-24-hours/
where:
  channel|contains: sysmon
  eventId|in:
  - 12
  - 13
  - 14
  targetObject|contains: \Microsoft\Windows Defender\Threats\ThreatSeverityDefaultAction\
  targetObject|endswith:
  - \1
  - \2
  - \4
  - \5
  details|in:
  - DWORD (0x00000006)
  - DWORD (0x00000009)
sigma:
