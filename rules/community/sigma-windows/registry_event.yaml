id: sigma-7f4c43f9-b1a5-4c7d-b24a-b41bf3a3ebf2
title: Registry Tampering by Potentially Suspicious Processes
description: Detects suspicious registry modifications made by suspicious processes such as script engine processes such as
  WScript, or CScript etc. These processes are rarely used for legitimate registry modifications, and their activity may indicate
  an attempt to modify the registry without using standard tools like regedit.exe or reg.exe, potentially for evasion and
  persistence.
severity: medium
source: events
attack:
- T1112
- T1059.005
tags:
- sigma
- registry_event
- persistence
- execution
- defense-impairment
references:
- https://www.nextron-systems.com/2025/07/29/detecting-the-most-popular-mitre-persistence-method-registry-run-keys-startup-folder/
- https://www.linkedin.com/posts/mauricefielenbach_livingofftheland-redteam-persistence-activity-7344801774182051843-TE00/
where:
  channel|contains: sysmon
  eventId|in:
  - 12
  - 13
  - 14
  image|endswith:
  - \mshta.exe
  - \wscript.exe
  - \cscript.exe
  not:
    any_of:
    - details: Binary Data
    - details|exists: false
    - image|endswith: \wscript.exe
      targetObject|contains_any:
      - SOFTWARE\Microsoft\Windows NT\CurrentVersion\Notifications\Data\
      - \Services\bam\State\UserSettings\S-1-
      - Software\Microsoft\Windows Script\Settings\Telemetry\wscript.exe\
      - Software\Microsoft\Windows\CurrentVersion\Internet Settings\
    - image|endswith: \wscript.exe
      targetObject|contains: \wscript.exe
sigma:
  id: 7f4c43f9-b1a5-4c7d-b24a-b41bf3a3ebf2
  status: experimental
  author: Swachchhanda Shrawan Poudel (Nextron Systems)
  date: '2025-08-13'
  modified: '2026-04-14'
  level: medium
  logsource:
