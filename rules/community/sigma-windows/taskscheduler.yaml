id: sigma-424273ea-7cf8-43a6-b712-375f925e481f
title: Scheduled Task Executed From A Suspicious Location
description: Detects the execution of Scheduled Tasks where the Program being run is located in a suspicious location or it's
  an unusale program to be run from a Scheduled Task
severity: medium
source: events
attack:
- T1053.005
tags:
- sigma
- taskscheduler
- privilege-escalation
- execution
- persistence
references:
- Internal Research
where:
  channel|contains: taskscheduler
  eventId: 129
  path|contains_any:
  - C:\Windows\Temp\
  - \AppData\Local\Temp\
  - \Desktop\
  - \Downloads\
  - \Users\Public\
  - C:\Temp\
sigma:
  id: 424273ea-7cf8-43a6-b712-375f925e481f
  status: test
  author: Nasreddine Bencherchali (Nextron Systems)
