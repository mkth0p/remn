id: sigma-e7a21b5f-d8c4-4ae5-b8d9-93c5d3f28e1c
title: Suspicious DNS Query Indicating Kerberos Coercion via DNS Object SPN Spoofing
description: Detects DNS queries containing patterns associated with Kerberos coercion attacks via DNS object spoofing. The
  pattern "1UWhRCAAAAA..BAAAA" is a base64-encoded signature that corresponds to a marshaled CREDENTIAL_TARGET_INFORMATION
  structure. Attackers can use this technique to coerce authentication from victim systems to attacker-controlled hosts. It
  is one of the strong indicators of a Kerberos coercion attack, where adversaries manipulate DNS records to spoof Service
  Principal Names (SPNs) and redirect authentication requests like CVE-2025-33073.
severity: high
source: events
attack:
- T1557.001
- T1187
tags:
- sigma
- dns_query
- collection
- credential-access
- persistence
- privilege-escalation
references:
- https://www.synacktiv.com/publications/ntlm-reflection-is-dead-long-live-ntlm-reflection-an-in-depth-analysis-of-cve-2025
- https://googleprojectzero.blogspot.com/2021/10/using-kerberos-for-authentication-relay.html
where:
  channel|contains: sysmon
  eventId: 22
  query|contains_all:
  - UWhRCA
  - BAAAA
