id: sigma-2074e137-1b73-4e2d-88ba-5a3407dbdce0
title: Notepad++ Updater DNS Query to Uncommon Domains
description: Detects when the Notepad++ updater (gup.exe) makes DNS queries to domains that are not part of the known legitimate
  update infrastructure. This could indicate potential exploitation of the updater mechanism or suspicious network activity
  that warrants further investigation.
severity: medium
source: events
attack:
- T1195.002
- T1557
tags:
- sigma
- dns_query
- collection
- credential-access
- initial-access
references:
- https://notepad-plus-plus.org/news/v889-released/
- https://www.heise.de/en/news/Notepad-updater-installed-malware-11109726.html
- https://www.rapid7.com/blog/post/tr-chrysalis-backdoor-dive-into-lotus-blossoms-toolkit/
- https://www.validin.com/blog/exploring_notepad_plus_plus_network_indicators/
- https://securelist.com/notepad-supply-chain-attack/118708/
where:
  all_of:
  - channel|contains: sysmon
    eventId: 22
  - image|endswith: \gup.exe
  - not:
      query: notepad-plus-plus.org
  - not:
      any_of:
      - query|endswith: .sourceforge.net
      - query|endswith: .githubusercontent.com
      - query: github.com
      - query|endswith: .googleapis.com
      - query|endswith:
        - .azurewebsites.net
        - block.opendns.com
        - gateway.zscalerthree.net
