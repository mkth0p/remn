id: sigma-fdeebdf0-9f3f-4d08-84a6-4c4d13e39fe4
title: Network Connection Initiated To Mega.nz
description: Detects a network connection initiated by a binary to "api.mega.co.nz". Attackers were seen abusing file sharing
  websites similar to "mega.nz" in order to upload/download additional payloads.
severity: low
source: events
attack:
- T1567.002
tags:
- sigma
- network_connection
- exfiltration
references:
- https://megatools.megous.com/
- https://www.mandiant.com/resources/russian-targeting-gov-business
where:
  channel|contains: sysmon
  eventId: 3
  initiated: 'true'
  destinationHostname|endswith:
  - mega.co.nz
  - mega.nz
