    - destinationIp|startswith: '127.'
    - destinationIp|startswith: '10.'
    - destinationIp|startswith: 169.254.
    - destinationIp|re: ^172\.(?:16|17|18|19|2[0-9]|30|31)(?:\.[0-9]{1,3}){2}$
    - destinationIp|startswith: 192.168.
    - destinationIp|in:
      - 0000:0000:0000:0000:0000:0000:0000:0001
      - 0:0:0:0:0:0:0:1
      - ::1
    - destinationIp|re: '^fe[89ab][0-9a-f]:'
    - destinationIp|re: '^f[cd][0-9a-f][0-9a-f]:'
    - destinationIp|re: ^20\.(?:184|185|186|187|188|189|190|191)(?:\.[0-9]{1,3}){2}$
    - destinationIp|re: ^20\.(?:192|193|194|195|196|197|198|199|20[0-9]|21[0-9]|22[0-9]|23[0-9]|24[0-9]|250|251|252|253|254|255)(?:\.[0-9]{1,3}){2}$
    - destinationIp|startswith: 23.79.
    - destinationIp|re: ^51\.(?:10|11)(?:\.[0-9]{1,3}){2}$
    - destinationIp|startswith: 51.103.
    - destinationIp|re: ^51\.(?:104|105)(?:\.[0-9]{1,3}){2}$
    - destinationIp|re: ^52\.(?:224|225|226|227|228|229|23[0-9]|24[0-9]|250|251|252|253|254|255)(?:\.[0-9]{1,3}){2}$
