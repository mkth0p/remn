id: sigma-37e4024a-6c80-4d8f-b95d-2e7e94f3a8d1
title: Outbound Network Connection Initiated By Microsoft Dialer
description: Detects outbound network connection initiated by Microsoft Dialer. The Microsoft Dialer, also known as Phone
  Dialer, is a built-in utility application included in various versions of the Microsoft Windows operating system. Its primary
  function is to provide users with a graphical interface for managing phone calls via a modem or a phone line connected to
  the computer. This is an outdated process in the current conext of it's usage and is a common target for info stealers for
  process injection, and is used to make C2 connections, common example is "Rhadamanthys"
severity: high
source: events
attack:
- T1071.001
tags:
- sigma
- network_connection
- execution
- command-and-control
references:
- https://tria.ge/240301-rk34sagf5x/behavioral2
- https://app.any.run/tasks/6720b85b-9c53-4a12-b1dc-73052a78477d
- https://research.checkpoint.com/2023/rhadamanthys-v0-5-0-a-deep-dive-into-the-stealers-components/
- https://strontic.github.io/xcyclopedia/library/dialer.exe-0B69655F912619756C704A0BF716B61F.html
where:
  channel|contains: sysmon
  eventId: 3
  image|endswith: :\Windows\System32\dialer.exe
  initiated: 'true'
  not:
    any_of:
    - destinationIp|startswith: '127.'
    - destinationIp|startswith: '10.'
    - destinationIp|re: ^172\.(?:16|17|18|19|2[0-9]|30|31)(?:\.[0-9]{1,3}){2}$
    - destinationIp|startswith: 192.168.
    - destinationIp|startswith: 169.254.
    - destinationIp|in:
      - 0000:0000:0000:0000:0000:0000:0000:0001
      - 0:0:0:0:0:0:0:1
      - ::1
    - destinationIp|re: '^fe[89ab][0-9a-f]:'
    - destinationIp|re: '^f[cd][0-9a-f][0-9a-f]:'
