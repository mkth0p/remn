id: sigma-5c80b618-0dbb-46e6-acbb-03d90bcb6d83
title: Network Connection Initiated To AzureWebsites.NET By Non-Browser Process
description: Detects an initiated network connection by a non browser process on the system to "azurewebsites.net". The latter
  was often used by threat actors as a malware hosting and exfiltration site.
severity: medium
source: events
attack:
- T1102
- T1102.001
tags:
- sigma
- network_connection
- command-and-control
references:
- https://www.sentinelone.com/labs/wip26-espionage-threat-actors-abuse-cloud-infrastructure-in-targeted-telco-attacks/
- https://symantec-enterprise-blogs.security.com/threat-intelligence/harvester-new-apt-attacks-asia
