id: sigma-0531e43a-d77d-47c2-b89f-5fe50321c805
title: RegAsm.EXE Initiating Network Connection To Public IP
description: Detects "RegAsm.exe" initiating a network connection to public IP adresses
severity: medium
source: events
attack:
- T1218.009
tags:
- sigma
- network_connection
- stealth
references:
- https://app.any.run/tasks/ec207948-4916-47eb-a0f4-4c6abb2e7668/
- https://research.splunk.com/endpoint/07921114-6db4-4e2e-ae58-3ea8a52ae93f/
- https://lolbas-project.github.io/lolbas/Binaries/Regasm/
where:
  channel|contains: sysmon
  eventId: 3
  initiated: 'true'
  image|endswith: \regasm.exe
  not:
    any_of:
    - destinationIp|startswith: '127.'
    - destinationIp|startswith: '10.'
    - destinationIp|re: ^172\.(?:16|17|18|19|2[0-9]|30|31)(?:\.[0-9]{1,3}){2}$
    - destinationIp|startswith: 192.168.
    - destinationIp|startswith: 169.254.
    - destinationIp|in:
      - 0000:0000:0000:0000:0000:0000:0000:0001
      - 0:0:0:0:0:0:0:1
      - ::1
    - destinationIp|re: '^fe[89ab][0-9a-f]:'
    - destinationIp|re: '^f[cd][0-9a-f][0-9a-f]:'
