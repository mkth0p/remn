id: sigma-bef0bc5a-b9ae-425d-85c6-7b2d705980c6
title: Python Initiated Connection
description: Detects a Python process initiating a network connection. While this often relates to package installation, it
  can also indicate a potential malicious script communicating with a C&C server.
severity: medium
source: events
attack:
- T1046
tags:
- sigma
- network_connection
- discovery
references:
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1046/T1046.md#atomic-test-4---port-scan-using-python
- https://pypi.org/project/scapy/
where:
  all_of:
  - channel|contains: sysmon
    eventId: 3
  - initiated: 'true'
    image|contains_all:
    - \python
    - .exe
  - not:
      any_of:
      - destinationIp: 127.0.0.1
        sourceIp: 127.0.0.1
      - commandLine|contains_all:
        - pip.exe
        - install
  - not:
      any_of:
      - parentImage: C:\ProgramData\Anaconda3\Scripts\conda.exe
        commandLine|contains_all:
        - :\ProgramData\Anaconda3\Scripts\conda-script.py
        - update
      - parentImage: C:\ProgramData\Anaconda3\python.exe
        commandLine|contains: C:\ProgramData\Anaconda3\Scripts\jupyter-notebook-script.py
