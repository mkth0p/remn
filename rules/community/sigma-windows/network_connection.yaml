id: sigma-2fdaf50b-9fd5-449f-ba69-f17248119af6
title: Network Connection Initiated via Finger.EXE
description: Detects network connections via finger.exe, which can be abused by threat actors to retrieve remote commands
  for execution on Windows devices. In one ClickFix malware campaign, adversaries leveraged the finger protocol to fetch commands
  from a remote server. Since the finger utility is not commonly used in modern Windows environments, its presence already
  raises suspicion. Investigating such network connections can also help identify potential malicious infrastructure used
  by threat actors
severity: high
source: events
attack:
- T1071.004
- T1059.003
tags:
- sigma
- network_connection
- command-and-control
- execution
references:
- https://www.bleepingcomputer.com/news/security/decades-old-finger-protocol-abused-in-clickfix-malware-attacks/
where:
  channel|contains: sysmon
  eventId: 3
  initiated: 'true'
  image|endswith: \finger.exe
