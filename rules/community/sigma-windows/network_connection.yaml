id: sigma-cdc8da7d-c303-42f8-b08c-b4ab47230263
title: Rundll32 Internet Connection
description: Detects a rundll32 that communicates with public IP addresses
severity: medium
source: events
attack:
- T1218.011
tags:
- sigma
- network_connection
- stealth
- execution
references:
- https://www.hybrid-analysis.com/sample/759fb4c0091a78c5ee035715afe3084686a8493f39014aea72dae36869de9ff6?environmentId=100
where:
  channel|contains: sysmon
  eventId: 3
  image|endswith: \rundll32.exe
  initiated: 'true'
  not:
    any_of:
    - destinationIp|startswith: '127.'
    - destinationIp|startswith: '10.'
    - destinationIp|re: ^172\.(?:16|17|18|19|2[0-9]|30|31)(?:\.[0-9]{1,3}){2}$
    - destinationIp|startswith: 192.168.
    - destinationIp|startswith: 169.254.
    - destinationIp|in:
      - 0000:0000:0000:0000:0000:0000:0000:0001
      - 0:0:0:0:0:0:0:1
      - ::1
    - destinationIp|re: '^fe[89ab][0-9a-f]:'
    - destinationIp|re: '^f[cd][0-9a-f][0-9a-f]:'
    - destinationIp|startswith: '20.'
    - destinationIp|startswith: 51.103.
    - destinationIp|startswith: 51.104.
    - destinationIp|startswith: 51.105.
    - commandLine|endswith: \system32\PcaSvc.dll,PcaPatchSdbTask
    - sourceHostname|endswith: .internal.cloudapp.net
    - parentImage: C:\Windows\System32\svchost.exe
      destinationPort: 443
