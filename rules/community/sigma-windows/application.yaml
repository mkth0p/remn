id: sigma-ebfe73c2-5bc9-4ed9-aaa8-8b54b2b4777d
title: MSSQL Server Failed Logon From External Network
description: Detects failed logon attempts from clients with external network IP to an MSSQL server. This can be a sign of
  a bruteforce attack.
severity: medium
source: events
attack:
- T1110
tags:
- sigma
- application
- credential-access
references:
- https://cybersecthreat.com/2020/07/08/enable-mssql-authentication-log-to-eventlog/
- https://www.experts-exchange.com/questions/27800944/EventID-18456-Failed-to-open-the-explicitly-specified-database.html
where:
  channel: Application
  provider|contains: MSSQL
  eventId: 18456
  not:
    dataList|contains_any:
    - 'CLIENT: 10.'
    - 'CLIENT: 172.16.'
    - 'CLIENT: 172.17.'
    - 'CLIENT: 172.18.'
    - 'CLIENT: 172.19.'
    - 'CLIENT: 172.20.'
    - 'CLIENT: 172.21.'
    - 'CLIENT: 172.22.'
    - 'CLIENT: 172.23.'
    - 'CLIENT: 172.24.'
    - 'CLIENT: 172.25.'
    - 'CLIENT: 172.26.'
    - 'CLIENT: 172.27.'
    - 'CLIENT: 172.28.'
    - 'CLIENT: 172.29.'
    - 'CLIENT: 172.30.'
    - 'CLIENT: 172.31.'
    - 'CLIENT: 192.168.'
    - 'CLIENT: 127.'
    - 'CLIENT: 169.254.'
    - 'CLIENT: <local machine>'
sigma:
  id: ebfe73c2-5bc9-4ed9-aaa8-8b54b2b4777d
  status: test
  author: j4son
