title: MSI Installation From Suspicious Locations
description: Detects MSI package installation from suspicious locations
severity: medium
source: events
tags:
- sigma
- application
- execution
references:
- https://www.trendmicro.com/en_us/research/22/h/ransomware-actor-abuses-genshin-impact-anti-cheat-driver-to-kill-antivirus.html
where:
  channel: Application
  provider: MsiInstaller
  eventId|in:
  - 1040
  - 1042
  dataList|contains_any:
  - :\Windows\TEMP\
  - \\
  - \Desktop\
  - \PerfLogs\
  - \Users\Public\
  not:
    any_of:
    - dataList|contains: \AppData\Local\Temp\WinGet\
    - dataList|contains: C:\Windows\TEMP\UpdHealthTools.msi
sigma:
  id: c7c8aa1c-5aff-408e-828b-998e3620b341
  status: test
  author: Nasreddine Bencherchali (Nextron Systems)
  date: '2022-08-31'
  modified: '2023-10-23'
  level: medium
  logsource:
    product: windows
    service: application
  falsepositives:
  - False positives may occur if you allow installation from folders such as the desktop, the public folder or remote shares.
    A baseline is required before production use.
---
id: sigma-d08dd86f-681e-4a00-a92c-1db218754417
title: MSSQL XPCmdshell Option Change
description: Detects when the MSSQL "xp_cmdshell" stored procedure setting is changed.
severity: high
source: events
tags:
- sigma
- application
- execution
references:
- https://www.netspi.com/blog/technical/network-penetration-testing/sql-server-persistence-part-1-startup-stored-procedures/
- https://thedfirreport.com/2022/07/11/select-xmrig-from-sqlserver/
where:
  channel: Application
  provider|contains: MSSQL
  eventId: 15457
  dataList|contains: xp_cmdshell
sigma:
  id: d08dd86f-681e-4a00-a92c-1db218754417
  status: test
  author: Nasreddine Bencherchali (Nextron Systems)
  date: '2022-07-12'
  modified: '2024-06-26'
  level: high
  logsource:
    product: windows
    service: application
  falsepositives:
  - Legitimate enable/disable of the setting
  - Note that since the event contain the change for both values. This means that this will trigger on both enable and disable
