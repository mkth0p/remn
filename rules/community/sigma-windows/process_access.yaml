id: sigma-9f5c1d59-33be-4e60-bcab-85d2f566effd
title: Suspicious Process Access to LSASS with Dbgcore/Dbghelp DLLs
description: Detects suspicious process access to LSASS.exe from processes located in uncommon locations with dbgcore.dll
  or dbghelp.dll in the call trace. These DLLs contain functions like MiniDumpWriteDump that can be abused for credential
  dumping purposes. While modern tools like Mimikatz have moved to using ntdll.dll, dbgcore.dll and dbghelp.dll are still
  used by basic credential dumping utilities and legacy tools for LSASS memory access and process suspension techniques.
severity: high
source: events
attack:
- T1003.001
- T1685
tags:
- sigma
- process_access
- credential-access
- defense-impairment
references:
- https://www.splunk.com/en_us/blog/security/you-bet-your-lsass-hunting-lsass-access.html
- https://docs.microsoft.com/en-us/windows/win32/api/minidumpapiset/nf-minidumpwritedump
where:
  channel|contains: sysmon
  eventId: 10
  targetImage|endswith: \lsass.exe
  callTrace|contains_any:
  - dbgcore.dll
  - dbghelp.dll
  sourceImage|contains_any:
  - :\Perflogs\
  - :\Temp\
  - :\Users\Public\
  - \$Recycle.Bin\
  - \AppData\Roaming\
  - \Contacts\
  - \Desktop\
  - \Documents\
  - \Downloads\
  - \Favorites\
  - \Favourites\
  - \inetpub\wwwroot\
  - \Music\
  - \Pictures\
  - \Start Menu\Programs\Startup\
  - \Users\Default\
  - \Videos\
  - \Windows\Temp\
