id: sigma-aa35a627-33fb-4d04-a165-d33b4afca3e8
title: Remote LSASS Process Access Through Windows Remote Management
description: Detects remote access to the LSASS process via WinRM. This could be a sign of credential dumping from tools like
  mimikatz.
severity: high
source: events
attack:
- T1003.001
- T1059.001
- T1021.006
tags:
- sigma
- process_access
- credential-access
- execution
- lateral-movement
- s0002
references:
- https://pentestlab.blog/2018/05/15/lateral-movement-winrm/
where:
  channel|contains: sysmon
  eventId: 10
  targetImage|endswith: \lsass.exe
  sourceImage|endswith: :\Windows\system32\wsmprovhost.exe
  not:
    grantedAccess: '0x80000000'
