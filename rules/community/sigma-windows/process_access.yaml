id: sigma-5ef9853e-4d0e-4a70-846f-a9ca37d876da
title: Potential Credential Dumping Activity Via LSASS
description: Detects process access requests to the LSASS process with specific call trace calls and access masks. This behaviour
  is expressed by many credential dumping tools such as Mimikatz, NanoDump, Invoke-Mimikatz, Procdump and even the Taskmgr
  dumping feature.
severity: medium
source: events
attack:
- T1003.001
tags:
- sigma
- process_access
- credential-access
- s0002
references:
- https://web.archive.org/web/20230329170326/https://blog.menasec.net/2019/02/threat-hunting-21-procdump-or-taskmgr.html
- https://web.archive.org/web/20230208123920/https://cyberwardog.blogspot.com/2017/03/chronicles-of-threat-hunter-hunting-for_22.html
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1003.001/T1003.001.md
- https://research.splunk.com/endpoint/windows_possible_credential_dumping/
where:
  all_of:
  - channel|contains: sysmon
    eventId: 10
  - targetImage|endswith: \lsass.exe
    grantedAccess|contains_any:
    - '0x1038'
    - '0x1438'
    - '0x143a'
    - '0x1fffff'
    callTrace|contains_any:
    - dbgcore.dll
    - dbghelp.dll
    - kernel32.dll
    - kernelbase.dll
    - ntdll.dll
  - not:
      data.SourceUser|contains_any:
      - AUTHORI
      - AUTORI
  - not:
      any_of:
      - callTrace|contains_all:
        - :\Windows\Temp\asgard2-agent\
        - \thor\thor64.exe+
        - '|UNKNOWN('
        grantedAccess: '0x103800'
      - sourceImage|endswith:
        - :\Windows\Sysmon64.exe
        - :\Windows\Sysmon64a.exe
