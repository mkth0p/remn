id: sigma-387df17d-3b04-448f-8669-9e7fd5e5fd8c
title: Suspicious Process Access of MsMpEng by WerFaultSecure - EDR-Freeze
description: Detects process access events where WerFaultSecure accesses MsMpEng.exe with dbgcore.dll or dbghelp.dll in the
  call trace, indicating potential EDR freeze techniques. This technique leverages WerFaultSecure.exe running as a Protected
  Process Light (PPL) with WinTCB protection level to call MiniDumpWriteDump and suspend EDR/AV processes, allowing malicious
  activity to execute undetected during the suspension period.
severity: high
source: events
attack:
- T1685
tags:
- sigma
- process_access
- defense-impairment
references:
- https://blog.axelarator.net/hunting-for-edr-freeze/
where:
  channel|contains: sysmon
  eventId: 10
  sourceImage|endswith: \WerFaultSecure.exe
  targetImage|endswith: \MsMpEng.exe
  callTrace|contains_any:
  - \dbgcore.dll
  - \dbghelp.dll
sigma:
  id: 387df17d-3b04-448f-8669-9e7fd5e5fd8c
  status: experimental
  author: Swachchhanda Shrawan Poudel (Nextron Systems)
  date: '2025-11-27'
  level: high
  logsource:
    category: process_access
    product: windows
    definition: "Requires Sysmon Event ID 10 (ProcessAccess) with CallTrace enabled.\nExample sysmon config snippet with grouping,
      as logging individual ProcessAccess events can generate excessive logs:\n<ProcessAccess onmatch=\"include\">\n    <Rule
      groupRelation=\"and\">\n    <TargetImage condition=\"end with\">\\MsMpEng.exe</TargetImage>\n    <SourceImage condition=\"end
      with\">\\WerFaultSecure.exe</SourceImage>\n    </Rule>\n</ProcessAccess>\n"
  falsepositives:
  - Legitimate Windows Error Reporting operations
