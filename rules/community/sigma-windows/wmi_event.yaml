where:
  channel|contains: sysmon
  eventId|in:
  - 19
  - 20
  - 21
  any_of:
  - destination|contains_all:
    - new-object
    - net.webclient
    - .downloadstring
  - destination|contains_all:
    - new-object
    - net.webclient
    - .downloadfile
