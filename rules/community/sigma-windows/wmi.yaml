id: sigma-0b7889b4-5577-4521-a60a-3376ee7f9f7b
title: WMI Persistence
description: Detects suspicious WMI event filter and command line event consumer based on WMI and Security Logs.
severity: medium
source: events
attack:
- T1546.003
tags:
- sigma
- wmi
- persistence
- privilege-escalation
references:
- https://twitter.com/mattifestation/status/899646620148539397
- https://www.eideon.com/2018-03-02-THL03-WMIBackdoors/
where:
  channel|contains: wmi-activity
  any_of:
  - eventId: 5861
    raw|contains_any:
    - ActiveScriptEventConsumer
    - CommandLineEventConsumer
    - CommandLineTemplate
  - eventId: 5859
  not:
    provider: SCM Event Provider
    wmiQuery|re: ^select\ .*\ from\ MSFT_SCMEventLogEvent$
    user: S-1-5-32-544
    data.PossibleCause: Permanent
sigma:
  id: 0b7889b4-5577-4521-a60a-3376ee7f9f7b
  status: test
  author: Florian Roth (Nextron Systems), Gleb Sukhodolskiy, Timur Zinniatullin oscd.community
  date: '2017-08-22'
