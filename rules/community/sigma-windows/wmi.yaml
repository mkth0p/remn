id: sigma-d4f1a2b3-7c8e-4d5f-b6a9-1e0c2d3f4e5b
title: Failed Event Log Clear Via WMI NTEventLogFile ClearEventLog
description: Detects failed attempts to clear Windows event logs via the WMI NTEventLogFile ClearEventLog method. Event 5858
  in the WMI-Activity operational log is an error event, meaning it is only generated when the WMI operation encounters an
  error (e.g. access denied, provider failure). It could be an indication of an attacker attempting to clear event logs via
  WMI, but failing due to insufficient privileges or other issues. Successful clearing operations will NOT produce this event;
  for those, correlate with Security event 1102 or System event 104.
severity: medium
source: events
attack:
- T1685.005
tags:
- sigma
- wmi
- defense-impairment
references:
- https://learn.microsoft.com/en-us/windows/win32/cimwin32prov/cleareventlog-method-in-class-win32-nteventlogfile
where:
  channel|contains: wmi-activity
  eventId: 5858
  operation|contains_all:
  - Win32_NTEventlogFile
  - cleareventlog
sigma:
  id: d4f1a2b3-7c8e-4d5f-b6a9-1e0c2d3f4e5b
  status: test
  author: Swachchhanda Shrawan Poudel (Nextron Systems)
  date: '2026-07-01'
