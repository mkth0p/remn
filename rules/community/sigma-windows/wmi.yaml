  level: medium
  logsource:
    product: windows
    service: wmi
    definition: WMI Namespaces Auditing and SACL should be configured, EventID 5861 and 5859 detection requires Windows 10,
      2012 and higher
  falsepositives:
  - Unknown (data set is too small; further testing needed)
