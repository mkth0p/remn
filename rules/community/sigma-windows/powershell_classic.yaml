id: sigma-f65e22f9-819e-4f96-9c7b-498364ae7a25
title: Potential RemoteFXvGPUDisablement.EXE Abuse
description: Detects PowerShell module creation where the module Contents are set to "function Get-VMRemoteFXPhysicalVideoAdapter".
  This could be a sign of potential abuse of the "RemoteFXvGPUDisablement.exe" binary which is known to be vulnerable to module
  load-order hijacking.
severity: high
source: events
attack:
- T1218
tags:
- sigma
- powershell-classic
- stealth
references:
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1218/T1218.md
- https://github.com/redcanaryco/AtomicTestHarnesses/blob/7e1e4da116801e3d6fcc6bedb207064577e40572/TestHarnesses/T1218_SignedBinaryProxyExecution/InvokeRemoteFXvGPUDisablementCommand.ps1
where:
  channel: Windows PowerShell
  dataList|contains: ModuleContents=function Get-VMRemoteFXPhysicalVideoAdapter {
