id: sigma-71ff406e-b633-4989-96ec-bc49d825a412
title: Zip A Folder With PowerShell For Staging In Temp - PowerShell
description: Detects PowerShell scripts that make use of the "Compress-Archive" Cmdlet in order to compress folders and files
  where the output is stored in a potentially suspicious location that is used often by malware for exfiltration. An adversary
  might compress data (e.g., sensitive documents) that is collected prior to exfiltration in order to make it portable and
  minimize the amount of data sent over the network.
severity: medium
source: events
attack:
- T1074.001
tags:
- sigma
- powershell-classic
- collection
references:
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1074.001/T1074.001.md
- https://www.cisa.gov/news-events/cybersecurity-advisories/aa23-347a
where:
  channel: Windows PowerShell
  dataList|re:
  - Compress\-Archive\ \-Path.*\-DestinationPath\ \$env:TEMP
  - Compress\-Archive\ \-Path.*\-DestinationPath.*\\AppData\\Local\\Temp\\
  - Compress\-Archive\ \-Path.*\-DestinationPath.*:\\Windows\\Temp\\
sigma:
  id: 71ff406e-b633-4989-96ec-bc49d825a412
  status: test
  author: Nasreddine Bencherchali (Nextron Systems), frack113
  date: '2021-07-20'
  modified: '2023-12-18'
  level: medium
  logsource:
    product: windows
    service: powershell-classic
  falsepositives:
  - Unknown
