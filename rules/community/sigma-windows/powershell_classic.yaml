id: sigma-df9a0e0e-fedb-4d6c-8668-d765dfc92aa7
title: Suspicious Non PowerShell WSMAN COM Provider
description: Detects suspicious use of the WSMAN provider without PowerShell.exe as the host application.
severity: medium
source: events
attack:
- T1059.001
- T1021.003
tags:
- sigma
- powershell-classic
- execution
- lateral-movement
references:
- https://twitter.com/chadtilbury/status/1275851297770610688
- https://bohops.com/2020/05/12/ws-management-com-another-approach-for-winrm-lateral-movement/
- https://github.com/bohops/WSMan-WinRM
where:
  all_of:
  - channel: Windows PowerShell
  - dataList|contains: ProviderName=WSMan
  - not:
      any_of:
      - dataList|contains_any:
        - HostApplication=powershell
        - HostApplication=C:\Windows\System32\WindowsPowerShell\v1.0\powershell
        - HostApplication=C:\Windows\SysWOW64\WindowsPowerShell\v1.0\powershell
        - HostApplication=C:/Windows/System32/WindowsPowerShell/v1.0/powershell
        - HostApplication=C:/Windows/SysWOW64/WindowsPowerShell/v1.0/powershell
      - dataList|re: HostId=[a-zA-Z0-9-]{36}\s+EngineVersion=
  - not:
      dataList|contains: HostApplication=C:\Hexnode\Hexnode Agent\Current\HexnodeAgent.exe
