  class. This technique is often abused by attackers to download additional payloads.
severity: low
source: events
attack:
- T1059.001
- T1105
tags:
- sigma
- ps_classic_start
- execution
- command-and-control
references:
- https://www.trendmicro.com/en_us/research/22/j/lv-ransomware-exploits-proxyshell-in-attack.html
where:
