id: sigma-999bff6d-dc15-44c9-9f5c-e1051bfc86e1
title: Nslookup PowerShell Download Cradle
description: Detects a powershell download cradle using nslookup. This cradle uses nslookup to extract payloads from DNS records.
severity: medium
source: events
attack:
- T1059.001
tags:
- sigma
- ps_classic_start
- execution
references:
- https://twitter.com/Alh4zr3d/status/1566489367232651264
where:
  channel: Windows PowerShell
  eventId: 400
  dataList|contains_all:
  - powershell
  - nslookup
  - '[1]'
  dataList|contains_any:
  - -q=txt http
  - -querytype=txt http
  - -type=txt http
