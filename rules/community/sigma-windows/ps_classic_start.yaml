id: sigma-30a8cb77-8eb3-4cfb-8e79-ad457c5a4592
title: Renamed Powershell Under Powershell Channel
description: Detects a renamed Powershell execution, which is a common technique used to circumvent security controls and
  bypass detection logic that's dependent on process names and process paths.
severity: low
source: events
attack:
- T1059.001
- T1036.003
tags:
- sigma
- ps_classic_start
- execution
- stealth
references:
- https://speakerdeck.com/heirhabarov/hunting-for-powershell-abuse
where:
  channel: Windows PowerShell
  eventId: 400
  dataList|contains: HostName=ConsoleHost
  not:
    any_of:
    - dataList|contains_any:
      - HostApplication=powershell
      - HostApplication=C:\Windows\System32\WindowsPowerShell\v1.0\powershell
      - HostApplication=C:\Windows\SysWOW64\WindowsPowerShell\v1.0\powershell
      - HostApplication=C:/Windows/System32/WindowsPowerShell/v1.0/powershell
      - HostApplication=C:/Windows/SysWOW64/WindowsPowerShell/v1.0/powershell
      - HostApplication=C:\\WINDOWS\\system32\\WindowsPowerShell\\v1.0\\powershell.exe
      - HostApplication=C:\\WINDOWS\\SysWOW64\\WindowsPowerShell\\v1.0\\powershell.exe
    - dataList|re: HostId=[a-zA-Z0-9-]{36}\s+EngineVersion=
sigma:
  id: 30a8cb77-8eb3-4cfb-8e79-ad457c5a4592
  status: test
