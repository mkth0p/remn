id: sigma-002bdb95-0cf1-46a6-9e08-d38c128a6127
title: WScript or CScript Dropper - File
description: Detects a file ending in jse, vbe, js, vba, vbs, wsf, wsh written by cscript.exe or wscript.exe
severity: high
source: events
attack:
- T1059.005
- T1059.007
tags:
- sigma
- file_event
- execution
references:
- WScript or CScript Dropper (cea72823-df4d-4567-950c-0b579eaf0846)
where:
  channel|contains: sysmon
  eventId: 11
  image|endswith:
  - \wscript.exe
  - \cscript.exe
  targetFilename|contains_any:
  - :\Perflogs\
  - :\ProgramData\
  - :\Temp\
  - :\Tmp\
  - :\Users\
  - :\Windows\Temp\
  - \AppData\Local\Temp
  - \AppData\Roaming\Temp
  - \Start Menu\Programs\Startup\
  - \Temporary Internet
  targetFilename|endswith:
  - .js
  - .jse
  - .vba
  - .vbe
  - .vbs
  - .wsf
  - .wsh
