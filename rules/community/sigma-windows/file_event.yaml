  a common persistence technique used by threat actors. These files (.ps1, .vbs, .js, .bat, etc.) are automatically executed
  when a user logs in, making the Startup folder an attractive target for attackers. This technique is frequently observed
  in malvertising campaigns and malware distribution where attackers attempt to maintain long-term access to compromised systems.
