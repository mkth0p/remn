id: sigma-fec96f39-988b-4586-b746-b93d59fd1922
title: ScreenConnect Temporary Installation Artefact
description: 'An adversary may use legitimate desktop support and remote access software, such as Team Viewer, Go2Assist,
  LogMein, AmmyyAdmin, etc, to establish an interactive command and control channel to target systems within networks. These
  services are commonly used as legitimate technical support software, and may be allowed by application control within a
  target environment. Remote access tools like VNC, Ammyy, and Teamviewer are used frequently when compared with other legitimate
  software commonly used by adversaries. (Citation: Symantec Living off the Land)'
severity: medium
source: events
attack:
- T1219.002
tags:
- sigma
- file_event
- command-and-control
references:
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1219/T1219.md#atomic-test-5---screenconnect-application-download-and-install-on-windows
where:
  channel|contains: sysmon
  eventId: 11
  targetFilename|contains: \Bin\ScreenConnect.
