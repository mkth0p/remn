id: sigma-a7f3c891-2e4d-4b6a-9f8c-d5e2a1b04c73
title: Registry Hive File Staged Outside Standard User Profile Path
description: Detects the creation of a registry hive file (UsrClass.dat or NTUSER.DAT) outside of the standard user profile
  path. These files generally contain various user-specific registry settings and are typically located in the user's profile
  directory. Staging these files outside of the standard path can be indicative of an attacker attempting to manipulate user
  registry settings for persistence, privilege escalation, or dump user registry hives for credential harvesting.
severity: high
source: events
attack:
- T1548
- T1003
tags:
- sigma
- file_event
- privilege-escalation
- credential-access
references:
- https://github.com/MSNightmare/LegacyHive
- https://git.projectnightcrawler.dev/NightmareEclipse/LegacyHive
where:
  channel|contains: sysmon
  eventId: 11
  targetFilename|endswith:
  - \UsrClass.dat
  - \NTUSER.DAT
  not:
    any_of:
    - targetFilename|endswith: \AppData\Local\Microsoft\Windows\UsrClass.dat
    - targetFilename|re: ^C:\\Users\\[^\\]+\\NTUSER\.DAT$
    - targetFilename|startswith:
      - C:\Windows\System32\config\
      - C:\Windows\SYSVOL\
      - C:\Windows\ServiceProfiles\
