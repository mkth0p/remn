id: sigma-fabb0e80-030c-4e3e-a104-d09676991ac3
title: Suspicious File Created in Outlook Temporary Directory
description: Detects the creation of files with suspicious file extensions in the temporary directory that Outlook uses when
  opening attachments. This can be used to detect spear-phishing campaigns that use suspicious files as attachments, which
  may contain malicious code.
severity: high
source: events
attack:
- T1566.001
tags:
- sigma
- file_event
- initial-access
references:
- https://vipre.com/blog/svg-phishing-attacks-the-new-trick-in-the-cybercriminals-playbook/
- https://thecyberexpress.com/rogue-rdp-files-used-in-ukraine-cyberattacks/
- https://www.microsoft.com/en-us/security/blog/2024/10/29/midnight-blizzard-conducts-large-scale-spear-phishing-campaign-using-rdp-files/
where:
  channel|contains: sysmon
  eventId: 11
  targetFilename|endswith:
  - .cpl
  - .hta
  - .iso
  - .rdp
  - .svg
  - .vba
  - .vbe
  - .vbs
  any_of:
  - targetFilename|contains_any:
    - \AppData\Local\Packages\Microsoft.Outlook_
    - \AppData\Local\Microsoft\Olk\Attachments\
  - targetFilename|contains_all:
    - \AppData\Local\Microsoft\Windows\
    - \Content.Outlook\
sigma:
  id: fabb0e80-030c-4e3e-a104-d09676991ac3
  status: experimental
  author: Florian Roth (Nextron Systems), Swachchhanda Shrawan Poudel (Nextron Systems)
  date: '2025-07-22'
  level: high
  logsource:
    product: windows
    category: file_event
  falsepositives:
  - Opening of headers or footers in email signatures that include SVG images or legitimate SVG attachments
