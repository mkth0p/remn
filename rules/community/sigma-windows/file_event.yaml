id: sigma-0a1255c5-d732-4b62-ac02-b5152d34fb83
title: ADExplorer Writing Complete AD Snapshot Into .dat File
description: Detects the dual use tool ADExplorer writing a complete AD snapshot into a .dat file. This can be used by attackers
  to extract data for Bloodhound, usernames for password spraying or use the meta data for social engineering. The snapshot
  doesn't contain password hashes but there have been cases, where administrators put passwords in the comment field.
