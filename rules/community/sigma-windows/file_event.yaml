id: sigma-0c3fac91-5627-46e8-a6a8-a0d7b9b8ae1b
title: Suspicious Get-Variable.exe Creation
description: Get-Variable is a valid PowerShell cmdlet WindowsApps is by default in the path where PowerShell is executed.
  So when the Get-Variable command is issued on PowerShell execution, the system first looks for the Get-Variable executable
  in the path and executes the malicious binary instead of looking for the PowerShell cmdlet.
severity: high
source: events
attack:
- T1546
- T1027
tags:
- sigma
- file_event
- privilege-escalation
- persistence
- stealth
references:
- https://blog.malwarebytes.com/threat-intelligence/2022/04/colibri-loader-combines-task-scheduler-and-powershell-in-clever-persistence-technique/
- https://www.joesandbox.com/analysis/465533/0/html
where:
  channel|contains: sysmon
  eventId: 11
  targetFilename|endswith: Local\Microsoft\WindowsApps\Get-Variable.exe
