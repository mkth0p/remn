id: sigma-fc028194-969d-4122-8abe-0470d5b8f12f
title: Access to Browser Login Data
description: Adversaries may acquire credentials from web browsers by reading files specific to the target browser. Web browsers
  commonly save credentials such as website usernames and passwords so that they do not need to be entered manually in the
  future. Web browsers typically store the credentials in an encrypted format within a credential store.
severity: medium
source: events
attack:
- T1555.003
tags:
- sigma
- ps_script
- credential-access
references:
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1555.003/T1555.003.md
where:
  channel|contains: powershell/operational
  eventId: 4104
  scriptBlockText|contains_all:
  - Copy-Item
  - -Destination
  scriptBlockText|contains_any:
  - \Opera Software\Opera Stable\Login Data
  - \Mozilla\Firefox\Profiles
  - \Microsoft\Edge\User Data\Default
  - \Google\Chrome\User Data\Default\Login Data
  - \Google\Chrome\User Data\Default\Login Data For Account
sigma:
  id: fc028194-969d-4122-8abe-0470d5b8f12f
