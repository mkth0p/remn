id: sigma-02122374-b74e-495c-b285-9e4da973f3d6
title: DMSA Service Account Created in Specific OUs - PowerShell
description: Detects the creation of a dMSA service account using the New-ADServiceAccount cmdlet in certain OUs. The fact
  that the cmdlet is used to create a dMSASvc account in a specific OU is highly suspicious. It is a pattern trying to exploit
  the BadSuccessor privilege escalation vulnerability in Windows Server 2025. On top of that, if the user that is creating
  the dMSASvc account is not a legitimate administrator or does not have the necessary permissions, it is a strong signal
  of an attempted or successful abuse of the BaDSuccessor vulnerability for privilege escalation within the Windows Server
  2025 Active Directory environment.
severity: medium
source: events
attack:
- T1078.002
- T1098
tags:
- sigma
- ps_script
- privilege-escalation
- initial-access
- persistence
- stealth
references:
- https://www.akamai.com/blog/security-research/abusing-bad-successor-for-privilege-escalation-in-active-directory
where:
  channel|contains: powershell/operational
  eventId: 4104
  scriptBlockText|contains_all:
  - New-ADServiceAccount
  - -CreateDelegatedServiceAccount
  - -path
