description: Detects call to "Win32_QuickFixEngineering" in order to enumerate installed hotfixes often used in "enum" scripts
  by attackers
severity: medium
source: events
tags:
- sigma
- ps_script
- discovery
references:
- https://github.com/411Hall/JAWS/blob/233f142fcb1488172aa74228a666f6b3c5c48f1d/jaws-enum.ps1
where:
  channel|contains: powershell/operational
  eventId: 4104
  scriptBlockText|contains_all:
  - Win32_QuickFixEngineering
  - HotFixID
sigma:
  id: f5d1def8-1de0-4a0e-9794-1f6f27dd605c
  status: test
  author: Nasreddine Bencherchali (Nextron Systems)
  date: '2022-06-21'
  level: medium
  logsource:
    product: windows
    category: ps_script
    definition: 'Requirements: Script Block Logging must be enabled'
  falsepositives:
  - Legitimate administration scripts
