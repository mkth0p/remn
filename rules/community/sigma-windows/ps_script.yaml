id: sigma-c6438007-e081-42ce-9483-b067fbef33c3
title: Powershell Timestomp
description: Adversaries may modify file time attributes to hide new or changes to existing files. Timestomping is a technique
  that modifies the timestamps of a file (the modify, access, create, and change times), often to mimic files that are in
  the same folder.
severity: medium
source: events
attack:
- T1070.006
tags:
- sigma
- ps_script
- stealth
references:
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1070.006/T1070.006.md
- https://www.offensive-security.com/metasploit-unleashed/timestomp/
where:
  channel|contains: powershell/operational
  eventId: 4104
  scriptBlockText|contains_any:
  - .CreationTime =
  - .LastWriteTime =
  - .LastAccessTime =
  - '[IO.File]::SetCreationTime'
  - '[IO.File]::SetLastAccessTime'
  - '[IO.File]::SetLastWriteTime'
