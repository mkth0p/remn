id: sigma-03d83090-8cba-44a0-b02f-0b756a050306
title: Potential WinAPI Calls Via PowerShell Scripts
description: Detects usage of WinAPI functions in PowerShell scripts. It may indicate attempts to perform actions such as
  process injection, token stealing, or other malicious activities that leverage Windows API calls. These techniques are commonly
  used to evade traditional file-based detections by loading and executing code directly in memory.
severity: high
source: events
attack:
- T1059.001
- T1106
- T1620
tags:
- sigma
- ps_script
- execution
- stealth
references:
- https://speakerdeck.com/heirhabarov/hunting-for-powershell-abuse
- https://github.com/PowerShellMafia/PowerSploit/blob/1980f403ee78234eae4d93b50890d02f827a099f/CodeExecution/Invoke-Shellcode.ps1
- https://thedfirreport.com/2021/08/29/cobalt-strike-a-defenders-guide/
where:
  channel|contains: powershell/operational
  eventId: 4104
  any_of:
  - scriptBlockText|contains_all:
    - VirtualAlloc
    - OpenProcess
    - WriteProcessMemory
    - CreateRemoteThread
  - scriptBlockText|contains_all:
    - OpenProcessToken
    - LookupPrivilegeValue
    - AdjustTokenPrivileges
  - scriptBlockText|contains_all:
    - OpenProcessToken
    - DuplicateTokenEx
    - CloseHandle
  - scriptBlockText|contains_all:
    - WriteProcessMemory
    - VirtualAlloc
    - ReadProcessMemory
    - VirtualFree
  - scriptBlockText|contains_all:
    - VirtualAlloc
    - GetDelegateForFunctionPointer
    - Marshal.Copy
