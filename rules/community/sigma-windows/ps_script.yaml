title: Registry Modification Attempt Via VBScript - PowerShell
description: Detects attempts to modify the registry using VBScript's CreateObject("Wscript.shell") and RegWrite methods embedded
  within PowerShell scripts or commands. Threat actors commonly embed VBScript code within PowerShell to perform registry
  modifications, attempting to evade detection that monitors for direct registry access through traditional tools. This technique
  can be used for persistence, defense evasion, and privilege escalation by modifying registry keys without using regedit.exe,
  reg.exe, or PowerShell's native registry cmdlets.
