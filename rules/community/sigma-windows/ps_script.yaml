id: sigma-fa6a5a45-3ee2-4529-aa14-ee5edc9e29cb
title: Suspicious Get Local Groups Information - PowerShell
description: Detects the use of PowerShell modules and cmdlets to gather local group information. Adversaries may use local
  system permission groups to determine which groups exist and which users belong to a particular group such as the local
  administrators group.
severity: low
source: events
attack:
- T1069.001
tags:
- sigma
- ps_script
- discovery
references:
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1069.001/T1069.001.md
where:
  channel|contains: powershell/operational
  eventId: 4104
  any_of:
  - scriptBlockText|contains_any:
    - 'get-localgroup '
    - 'get-localgroupmember '
  - scriptBlockText|contains_any:
    - 'get-wmiobject '
    - 'gwmi '
    - 'get-ciminstance '
    - 'gcim '
    scriptBlockText|contains: win32_group
sigma:
  id: fa6a5a45-3ee2-4529-aa14-ee5edc9e29cb
  status: test
  author: frack113
  date: '2021-12-12'
  modified: '2025-08-22'
  level: low
  logsource:
    product: windows
    category: ps_script
    definition: 'Requirements: Script Block Logging must be enabled'
  falsepositives:
  - Inventory scripts or admin tasks
