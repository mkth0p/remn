id: sigma-851c506b-6b7c-4ce2-8802-c703009d03c0
title: Winlogon Helper DLL
description: Winlogon.exe is a Windows component responsible for actions at logon/logoff as well as the secure attention sequence
  (SAS) triggered by Ctrl-Alt-Delete. Registry entries in HKLM\Software[Wow6432Node]Microsoft\Windows NT\CurrentVersion\Winlogon\
  and HKCU\Software\Microsoft\Windows NT\CurrentVersion\Winlogon\ are used to manage additional helper programs and functionalities
  that support Winlogon. Malicious modifications to these Registry keys may cause Winlogon to load and execute malicious DLLs
  and/or executables.
