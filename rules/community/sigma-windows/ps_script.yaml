id: sigma-c1337eb8-921a-4b59-855b-4ba188ddcc42
title: Deletion of Volume Shadow Copies via WMI with PowerShell - PS Script
description: Detects deletion of Windows Volume Shadow Copies with PowerShell code and Get-WMIObject. This technique is used
  by numerous ransomware families such as Sodinokibi/REvil
severity: high
source: events
attack:
- T1490
tags:
- sigma
- ps_script
- impact
references:
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1490/T1490.md#atomic-test-5---windows---delete-volume-shadow-copies-via-wmi-with-powershell
- https://www.elastic.co/guide/en/security/current/volume-shadow-copy-deletion-via-powershell.html
where:
  all_of:
  - channel|contains: powershell/operational
    eventId: 4104
  - scriptBlockText|contains_any:
    - Get-WmiObject
    - gwmi
    - Get-CimInstance
    - gcim
  - scriptBlockText|contains: Win32_ShadowCopy
  - scriptBlockText|contains_any:
    - .Delete()
    - Remove-WmiObject
    - rwmi
    - Remove-CimInstance
    - rcim
