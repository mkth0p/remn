id: sigma-d645ef86-2396-48a1-a2b6-b629ca3f57ff
title: Windows Credential Guard Related Registry Value Deleted - Registry
description: Detects attempts to disable Windows Credential Guard by deleting registry values. Credential Guard uses virtualization-based
  security to isolate secrets so that only privileged system software can access them. Adversaries may disable Credential
  Guard to gain access to sensitive credentials stored in the system, such as NTLM hashes and Kerberos tickets, which can
  be used for lateral movement and privilege escalation.
severity: high
source: events
attack:
- T1685
tags:
- sigma
- registry_delete
- defense-impairment
references:
- https://github.com/DambergC/SaveFolder/blob/90e945eba80fae85f2d54b4616e05a44ec90c500/Cygate%20Installation%20tool%206.22/Script/OSD/OSDeployment-CredentialGuardDisable.ps1#L50
- https://learn.microsoft.com/en-us/windows/security/identity-protection/credential-guard/configure
where:
  channel|contains: sysmon
  eventId: 12
  targetObject|endswith:
  - \DeviceGuard\EnableVirtualizationBasedSecurity
  - \DeviceGuard\LsaCfgFlags
  - \DeviceGuard\RequirePlatformSecurityFeatures
  - \Lsa\LsaCfgFlags
