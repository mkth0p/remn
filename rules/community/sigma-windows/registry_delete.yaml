id: sigma-5dfc1465-8f65-4fde-8eb5-6194380c6a62
title: Windows Recall Feature Enabled - DisableAIDataAnalysis Value Deleted
description: Detects the enabling of the Windows Recall feature via registry manipulation. Windows Recall can be enabled by
  deleting the existing "DisableAIDataAnalysis" registry value. Adversaries may enable Windows Recall as part of post-exploitation
  discovery and collection activities. This rule assumes that Recall is already explicitly disabled on the host, and subsequently
  enabled by the adversary.
severity: medium
source: events
attack:
- T1113
tags:
- sigma
- registry_delete
- collection
references:
- https://learn.microsoft.com/en-us/windows/client-management/manage-recall
- https://learn.microsoft.com/en-us/windows/client-management/mdm/policy-csp-windowsai#disableaidataanalysis
where:
  channel|contains: sysmon
  eventId: 12
  eventType: DeleteValue
  targetObject|endswith: \Microsoft\Windows\WindowsAI\DisableAIDataAnalysis
