id: sigma-06125661-3814-4e03-bfa2-1e4411c60ac3
title: Backup Files Deleted
description: Detects deletion of files with extensions often used for backup files. Adversaries may delete or remove built-in
  operating system data and turn off services designed to aid in the recovery of a corrupted system to prevent recovery.
severity: medium
source: events
attack:
- T1490
tags:
- sigma
- file_delete
- impact
references:
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1490/T1490.md#atomic-test-6---windows---delete-backup-files
where:
  channel|contains: sysmon
  eventId|in:
  - 23
  - 26
  image|endswith:
  - \cmd.exe
  - \powershell.exe
  - \pwsh.exe
  - \wt.exe
  - \rundll32.exe
  - \regsvr32.exe
  targetFilename|endswith:
  - .VHD
  - .bac
  - .bak
  - .wbcat
  - .bkf
  - .set
  - .win
  - .dsk
sigma:
  id: 06125661-3814-4e03-bfa2-1e4411c60ac3
  status: test
