id: sigma-6ddab845-b1b8-49c2-bbf7-1a11967f64bc
title: File Deleted Via Sysinternals SDelete
description: Detects the deletion of files by the Sysinternals SDelete utility. It looks for the common name pattern used
  to rename files.
severity: medium
source: events
attack:
- T1070.004
tags:
- sigma
- file_delete
- stealth
references:
- https://github.com/OTRF/detection-hackathon-apt29/issues/9
- https://github.com/OTRF/ThreatHunter-Playbook/blob/2d4257f630f4c9770f78d0c1df059f891ffc3fec/docs/evals/apt29/detections/4.B.4_83D62033-105A-4A02-8B75-DAB52D8D51EC.md
where:
  channel|contains: sysmon
  eventId|in:
  - 23
  - 26
  targetFilename|endswith:
  - .AAA
  - .ZZZ
  not:
    targetFilename|endswith: \Wireshark\radius\dictionary.alcatel-lucent.aaa
