id: sigma-4b60e527-ec73-4b47-8cb3-f02ad927ca65
title: Access To Browser Credential Files By Uncommon Applications - Security
description: Detects file access requests to browser credential stores by uncommon processes. Could indicate potential attempt
  of credential stealing This rule requires heavy baselining before usage.
severity: low
source: events
attack:
- T1555.003
tags:
- sigma
- security
- credential-access
- detection.threat-hunting
references:
- https://ipurple.team/2024/09/10/browser-stored-credentials/
where:
  all_of:
  - channel: Security
  - eventId: 4663
    objectType: File
    accessMask: '0x1'
  - any_of:
    - objectName|contains_any:
      - \User Data\Default\Login Data
      - \User Data\Local State
      - \User Data\Default\Network\Cookies
    - data.FileName|endswith:
      - \cookies.sqlite
      - \places.sqlite
      - release\key3.db
      - release\key4.db
      - release\logins.json
  - not:
      any_of:
      - processName: System
      - processName|startswith:
        - C:\Program Files (x86)\
        - C:\Program Files\
        - C:\Windows\system32\
        - C:\Windows\SysWOW64\
  - not:
      processName|startswith: C:\ProgramData\Microsoft\Windows Defender\
      processName|endswith:
      - \MpCopyAccelerator.exe
      - \MsMpEng.exe
sigma:
  id: 4b60e527-ec73-4b47-8cb3-f02ad927ca65
  status: test
  author: Daniel Koifman (@Koifsec), Nasreddine Bencherchali
  date: '2024-10-21'
  level: low
  logsource:
    product: windows
    service: security
    definition: 'Requirements: Audit File System subcategory must be enabled. Additionally, each listed ObjectName must have
      "List folder/read data" auditing enabled.'
  falsepositives:
  - Unknown
