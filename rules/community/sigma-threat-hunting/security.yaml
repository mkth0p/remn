id: sigma-4f86b304-3e02-40e3-aa5d-e88a167c9617
title: Scheduled Task Deletion
description: Detects scheduled task deletion events. Scheduled tasks are likely to be deleted if not used for persistence.
  Malicious Software often creates tasks directly under the root node e.g. \TASKNAME
severity: low
source: events
attack:
- T1053.005
tags:
- sigma
- security
- execution
- privilege-escalation
- persistence
- car.2013-08-001
- detection.threat-hunting
references:
- https://twitter.com/matthewdunwoody/status/1352356685982146562
- https://docs.microsoft.com/en-us/windows/security/threat-protection/auditing/event-4699
where:
  channel: Security
  eventId: 4699
  not:
    any_of:
    - taskName: \Microsoft\Windows\RemovalTools\MRT_ERROR_HB
    - taskName|contains: '\Mozilla\Firefox Default Browser Agent '
