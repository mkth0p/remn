id: sigma-04580eed-e1d6-426b-a570-f6e64a4577f7
title: Inbox Rules Creation Or Update Activity Via ExchangePowerShell Cmdlet
description: Detects inbox rule creation or update via ExchangePowerShell cmdlet, a technique commonly observed in Business
  Email Compromise (BEC) attacks to hide emails. The usage of inbox rules can be a sign of a compromised mailbox, where an
  attacker is attempting to evade detections by suppressing or redirecting incoming emails. Analysts should review these rules
  in context, validate whether they reflect normal user behavior, and correlate with other indicators such as unusual login
  activity or recent mailbox rule modifications.
severity: medium
source: events
attack:
- T1564.008
- T1114.003
tags:
- sigma
- ps_script
- stealth
- exfiltration
- collection
- detection.threat-hunting
references:
- https://redcanary.com/threat-detection-report/techniques/email-hiding-rules/
- https://learn.microsoft.com/it-it/powershell/module/exchangepowershell/new-inboxrule?view=exchange-ps
- https://learn.microsoft.com/it-it/powershell/module/exchangepowershell/set-inboxrule?view=exchange-ps
where:
  all_of:
  - channel|contains: powershell/operational
    eventId: 4104
  - scriptBlockText|contains_any:
    - New-InboxRule
    - Set-InboxRule
  - scriptBlockText|contains_any:
    - DeleteMessage
    - MarkAsRead
    - MoveToFolder
    - SubjectOrBodyContainsWords
sigma:
  id: 04580eed-e1d6-426b-a570-f6e64a4577f7
  status: experimental
  author: Marco Pedrinazzi (@pedrinazziM) (InTheCyber)
  date: '2026-02-10'
  level: medium
  logsource:
    product: windows
    category: ps_script
    definition: 'Requirements: Script Block Logging must be enabled'
  falsepositives:
  - Legitimate inbox rules created by users or administrators to manage email flow such as filtering, organizing, or automating
    email handling.
