id: sigma-f3a98ce4-6164-4dd4-867c-4d83de7eca51
title: Powershell Token Obfuscation - Powershell
description: Detects TOKEN OBFUSCATION technique from Invoke-Obfuscation in Powershell scripts. Use this rule as a threat-hunting
  baseline to find obfuscated scripts in your environment. Once tested and tuned, consider deploying a production detection
  rule based on this hunting rule.
severity: medium
source: events
attack:
- T1027.009
tags:
- sigma
- ps_script
- stealth
- detection.threat-hunting
references:
- https://github.com/danielbohannon/Invoke-Obfuscation
where:
  channel|contains: powershell/operational
  eventId: 4104
  any_of:
  - scriptBlockText|re: \w+`(\w+|-|.)`[\w+|\s]
  - scriptBlockText|re: '"(\{\d\}){2,}"\s*-f'
  - scriptBlockText|re: (?i)\$\{`?e`?n`?v`?:`?p`?a`?t`?h`?\}
  not:
    any_of:
    - scriptBlockText|contains: ${env:path}
    - scriptBlockText|contains_any:
      - it will return true or false instead
      - The function also prevents `Get-ItemProperty` from failing
    - path|startswith: C:\Program Files\Microsoft\Exchange Server\
      path|endswith: \bin\servicecontrol.ps1
      scriptBlockText|contains: '`r`n'
sigma:
  id: f3a98ce4-6164-4dd4-867c-4d83de7eca51
  status: test
  author: frack113
