id: sigma-289dfa9e-e378-4a56-a9d4-7ed5ee218029
title: Successful MSIX/AppX Package Installation
description: Detects successful MSIX/AppX package installations on Windows systems by monitoring EventID 854 in the Microsoft-Windows-AppXDeployment-Server/Operational
  log. While most installations are legitimate, this can help identify unauthorized or suspicious package installations. It
  is crucial to monitor such events as threat actors may exploit MSIX/AppX packages to deliver and execute malicious payloads.
