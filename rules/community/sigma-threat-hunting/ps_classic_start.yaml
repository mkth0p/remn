id: sigma-812837bb-b17f-45e9-8bd0-0ec35d2e3bd6
title: bXOR Operator Usage In PowerShell Command Line - PowerShell Classic
description: Detects powershell execution with that make use of to the bxor (Bitwise XOR). Attackers might use as an alternative
  obfuscation method to Base64 encoded commands. Investigate the CommandLine and process tree to determine if the activity
  is malicious.
severity: low
source: events
attack:
- T1059.001
tags:
- sigma
- ps_classic_start
- execution
- detection.threat-hunting
references:
- https://speakerdeck.com/heirhabarov/hunting-for-powershell-abuse?slide=46
- https://learn.microsoft.com/en-us/powershell/module/microsoft.powershell.core/about/about_arithmetic_operators?view=powershell-5.1
where:
  channel: Windows PowerShell
  eventId: 400
  dataList|contains_all:
  - HostName=ConsoleHost
  - ' -bxor '
sigma:
  id: 812837bb-b17f-45e9-8bd0-0ec35d2e3bd6
  status: test
  author: Teymur Kheirkhabarov, Harish Segar
  date: '2020-06-29'
  modified: '2024-12-11'
  level: low
