id: sigma-dca1b3e8-e043-4ec8-85d7-867f334b5724
title: PFX File Creation
description: 'Detects the creation of PFX files (Personal Information Exchange format). PFX files contain private keys and
  certificates bundled together, making them valuable targets for attackers seeking to: - Exfiltrate digital certificates
  for impersonation or signing malicious code - Establish persistent access through certificate-based authentication - Bypass
  security controls that rely on certificate validation Analysts should investigate PFX file creation events by examining
  which process created the PFX file and its parent process chain, as well as unusual locations outside standard certificate
  stores or development environments.'
severity: low
source: events
attack:
- T1552.004
tags:
- sigma
- file_event
- credential-access
- detection.threat-hunting
references:
- https://github.com/OTRF/detection-hackathon-apt29/issues/14
- https://github.com/OTRF/ThreatHunter-Playbook/blob/2d4257f630f4c9770f78d0c1df059f891ffc3fec/docs/evals/apt29/detections/6.B.1_6392C9F1-D975-4F75-8A70-433DEDD7F622.md
where:
  channel|contains: sysmon
  eventId: 11
  targetFilename|endswith: .pfx
  not:
    any_of:
    - image|in:
      - C:\Program Files\Microsoft OneDrive\OneDrive.exe
      - C:\Program Files (x86)\Microsoft OneDrive\OneDrive.exe
      targetFilename|endswith: \OneDrive\CodeSigning.pfx
    - targetFilename|startswith:
      - C:\Program Files (x86)\Microsoft Visual Studio\
      - C:\Program Files\Microsoft Visual Studio\
    - targetFilename|startswith: C:\Program Files\CMake\
sigma:
