id: sigma-caf02a0a-1e1c-4552-9b48-5e070bd88d11
title: Suspicious Creation TXT File in User Desktop
description: Detects creation of .txt files in user desktop folders via cmd.exe. This behavior may indicate ransomware deploying
  ransom notes, but can also occur during legitimate administrative tasks. Analysts should investigate for suspicious filenames
  (e.g., "RANSOM", "DECRYPT", "READ_ME"), bulk file creation patterns, or concurrent encryption activity to determine if this
  is part of a ransomware attack.
severity: medium
source: events
attack:
- T1486
tags:
- sigma
- file_event
- impact
- detection.threat-hunting
references:
