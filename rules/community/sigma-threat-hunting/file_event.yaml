id: sigma-e3652ba3-0ad8-4010-a957-b7ba369e7bac
title: Python Path Configuration File Creation - Windows
description: Detects creation of a Python path configuration file (.pth) in Python library folders, which can be maliciously
  abused for code execution and persistence. Modules referenced by these files are run at every Python startup (v3.5+), regardless
  of whether the module is imported by the calling script. Default paths are '\lib\site-packages\*.pth' (Windows) and '/lib/pythonX.Y/site-packages/*.pth'
  (Unix and macOS).
severity: medium
source: events
attack:
- T1059.006
tags:
- sigma
- file_event
- execution
- detection.threat-hunting
references:
- https://www.volexity.com/blog/2024/04/12/zero-day-exploitation-of-unauthenticated-remote-code-execution-vulnerability-in-globalprotect-cve-2024-3400/
- https://www.virustotal.com/gui/file/3de2a4392b8715bad070b2ae12243f166ead37830f7c6d24e778985927f9caac
- https://docs.python.org/3/library/site.html
where:
  channel|contains: sysmon
  eventId: 11
  targetFilename|re: (?i)\\(venv|python(.+)?)\\lib\\site-packages\\
  targetFilename|endswith: .pth
  not:
    image|endswith: \python.exe
    targetFilename|endswith:
    - \pywin32.pth
    - \distutils-precedence.pth
sigma:
  id: e3652ba3-0ad8-4010-a957-b7ba369e7bac
  status: test
  author: Andreas Braathen (mnemonic.io), Nasreddine Bencherchali (Nextron Systems)
  date: '2024-04-25'
  level: medium
  logsource:
    product: windows
    category: file_event
  falsepositives:
  - Although .pth files are discouraged due to potential security implications, these are legitimate files by specification.
