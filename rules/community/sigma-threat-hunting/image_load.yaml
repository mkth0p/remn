id: sigma-8a2f4b1c-3d5e-4f7a-9b2c-1e4f6d8a9c2b
title: WerFaultSecure Loading DbgCore or DbgHelp - EDR-Freeze
description: Detects the loading of dbgcore.dll or dbghelp.dll by WerFaultSecure.exe, which has been observed in EDR-Freeze
  attacks to suspend processes and evade detection. However, this behavior has also been observed during normal software installations,
  so further investigation is required to confirm malicious activity. When threat hunting, look for this activity in conjunction
  with other suspicious processes starting, network connections, or file modifications that occur shortly after the DLL load.
  Pay special attention to timing - if other malicious activities occur during or immediately after this library loading,
  it may indicate EDR evasion attempts. Also correlate with any EDR/AV process suspension events or gaps in security monitoring
  during the timeframe.
severity: medium
source: events
attack:
- T1685
tags:
- sigma
- image_load
- defense-impairment
- detection.threat-hunting
references:
- https://github.com/TwoSevenOneT/EDR-Freeze
- https://blog.axelarator.net/hunting-for-edr-freeze/
where:
  channel|contains: sysmon
  eventId: 7
  image|endswith: \WerFaultSecure.exe
