id: sigma-0e277796-5f23-4e49-a490-483131d4f6e1
title: Dbghelp/Dbgcore DLL Loaded By Uncommon/Suspicious Process
description: Detects the load of dbghelp/dbgcore DLL by a potentially uncommon or potentially suspicious process. The Dbghelp
  and Dbgcore DLLs export functions that allow for the dump of process memory. Tools like ProcessHacker, Task Manager and
  some attacker tradecraft use the MiniDumpWriteDump API found in dbghelp.dll or dbgcore.dll. As an example, SilentTrynity
  C2 Framework has a module that leverages this API to dump the contents of Lsass.exe and transfer it over the network back
  to the attacker's machine. Keep in mind that many legitimate Windows processes and services might load the aforementioned
  DLLs for debugging or other related purposes. Investigate the CommandLine and the Image location of the process loading
  the DLL.
severity: medium
source: events
attack:
- T1003.001
tags:
- sigma
- image_load
- credential-access
- detection.threat-hunting
references:
- https://docs.microsoft.com/en-us/windows/win32/api/minidumpapiset/nf-minidumpapiset-minidumpwritedump
- https://www.pinvoke.net/default.aspx/dbghelp/MiniDumpWriteDump.html
- https://medium.com/@fsx30/bypass-edrs-memory-protection-introduction-to-hooking-2efb21acffd6
where:
  channel|contains: sysmon
  eventId: 7
  imageLoaded|endswith:
  - \dbghelp.dll
  - \dbgcore.dll
  image|endswith:
  - \bash.exe
  - \cmd.exe
  - \cscript.exe
  - \dnx.exe
  - \excel.exe
  - \monitoringhost.exe
  - \msbuild.exe
  - \mshta.exe
  - \outlook.exe
  - \powerpnt.exe
  - \regsvcs.exe
  - \rundll32.exe
  - \sc.exe
  - \scriptrunner.exe
  - \winword.exe
  - \wmic.exe
  - \wscript.exe
  not:
    any_of:
    - commandLine|startswith: C:\WINDOWS\WinSxS\
      commandLine|endswith: \TiWorker.exe -Embedding
    - image|endswith: \svchost.exe
      commandLine|endswith:
      - -k LocalServiceNetworkRestricted
      - -k WerSvcGroup
    - image|endswith: \rundll32.exe
      commandLine|contains_any:
      - /d srrstr.dll,ExecuteScheduledSPPCreation
      - aepdu.dll,AePduRunUpdate
      - shell32.dll,OpenAs_RunDL
      - Windows.Storage.ApplicationData.dll,CleanupTemporaryState
