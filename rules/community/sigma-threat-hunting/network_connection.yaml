id: sigma-1f21ec3f-810d-4b0e-8045-322202e22b4b
title: Network Connection Initiated By PowerShell Process
description: Detects a network connection that was initiated from a PowerShell process. Often times malicious powershell scripts
  download additional payloads or communicate back to command and control channels via uncommon ports or IPs. Use this rule
  as a basis for hunting for anomalies.
severity: low
source: events
attack:
- T1059.001
tags:
- sigma
- network_connection
- execution
- detection.threat-hunting
references:
- https://www.youtube.com/watch?v=DLtJTxMWZ2o
where:
  channel|contains: sysmon
  eventId: 3
  image|endswith:
  - \powershell.exe
  - \pwsh.exe
  initiated: 'true'
  not:
    any_of:
    - any_of:
      - destinationIp|startswith: '127.'
      - destinationIp|startswith: '10.'
      - destinationIp|startswith: 169.254.
      - destinationIp|re: ^172\.(?:16|17|18|19|2[0-9]|30|31)(?:\.[0-9]{1,3}){2}$
      - destinationIp|startswith: 192.168.
      - destinationIp|in:
        - 0000:0000:0000:0000:0000:0000:0000:0001
        - 0:0:0:0:0:0:0:1
        - ::1
      - destinationIp|re: '^fe[89ab][0-9a-f]:'
      - destinationIp|re: '^f[cd][0-9a-f][0-9a-f]:'
      user|contains_any:
      - AUTHORI
      - AUTORI
    - destinationIp|re: ^20\.(?:184|185|186|187|188|189|190|191)(?:\.[0-9]{1,3}){2}$
    - destinationIp|re: ^51\.103\.(?:210|211)(?:\.[0-9]{1,3}){1}$
sigma:
  id: 1f21ec3f-810d-4b0e-8045-322202e22b4b
  status: test
  author: Florian Roth (Nextron Systems)
  date: '2017-03-13'
  modified: '2024-03-13'
  level: low
  logsource:
    category: network_connection
    product: windows
  falsepositives:
  - Administrative scripts
  - Microsoft IP range
  - Additional filters are required. Adjust to your environment (e.g. extend filters with company's ip range')
