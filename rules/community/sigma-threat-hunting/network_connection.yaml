id: sigma-468a8cea-2920-4909-a593-0cbe1d96674a
title: HH.EXE Initiated HTTP Network Connection
description: Detects a network connection initiated by the "hh.exe" process to HTTP destination ports, which could indicate
  the execution/download of remotely hosted .chm files.
severity: medium
source: events
attack:
- T1218.001
tags:
- sigma
- network_connection
- stealth
- detection.threat-hunting
references:
- https://www.splunk.com/en_us/blog/security/follina-for-protocol-handlers.html
- https://github.com/redcanaryco/atomic-red-team/blob/1cf4dd51f83dcb0ebe6ade902d6157ad2dbc6ac8/atomics/T1218.001/T1218.001.md
where:
  channel|contains: sysmon
  eventId: 3
  image|endswith: \hh.exe
  initiated: 'true'
  destinationPort|in:
  - 80
  - 443
sigma:
  id: 468a8cea-2920-4909-a593-0cbe1d96674a
  status: test
  author: Nasreddine Bencherchali (Nextron Systems)
  date: '2022-10-05'
  level: medium
  logsource:
    category: network_connection
    product: windows
  falsepositives:
  - False positive is expected from launching "hh.exe" for the first time on a machine in a while or simply from help files
    containing reference to external sources. Best correlate this with process creation and file events.
