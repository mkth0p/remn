id: sigma-bcb03938-9f8b-487d-8d86-e480691e1d71
title: Network Connection Initiated From Users\Public Folder
description: Detects a network connection initiated from a process located in the "C:\Users\Public" folder. Attacker are known
  to drop their malicious payloads and malware in this directory as its writable by everyone. Use this rule to hunt for potential
  suspicious or uncommon activity in your environement.
severity: medium
source: events
attack:
- T1105
tags:
- sigma
- network_connection
- command-and-control
- detection.threat-hunting
references:
- https://docs.google.com/spreadsheets/d/17pSTDNpa0sf6pHeRhusvWG6rThciE8CsXTSlDUAZDyo
where:
  channel|contains: sysmon
  eventId: 3
  initiated: 'true'
  image|contains: :\Users\Public\
  not:
    image|contains: :\Users\Public\IBM\ClientSolutions\Start_Programs\
sigma:
  id: bcb03938-9f8b-487d-8d86-e480691e1d71
  status: test
