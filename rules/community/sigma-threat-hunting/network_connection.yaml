id: sigma-4c5fba4a-9ef6-4f16-823d-606246054741
title: Dfsvc.EXE Initiated Network Connection Over Uncommon Port
description: Detects an initiated network connection over uncommon ports from "dfsvc.exe". A utility used to handled ClickOnce
  applications.
severity: high
source: events
attack:
- T1203
tags:
- sigma
- network_connection
- execution
- detection.threat-hunting
references:
- https://posts.specterops.io/less-smartscreen-more-caffeine-ab-using-clickonce-for-trusted-code-execution-1446ea8051c5
where:
  all_of:
  - channel|contains: sysmon
    eventId: 3
  - image|contains: :\Windows\Microsoft.NET\
    image|endswith: \dfsvc.exe
    initiated: 'true'
  - not:
      destinationPort|in:
      - 80
      - 443
  - not:
      data.DestinationIsIpv6: 'true'
      destinationPort: 53
sigma:
  id: 4c5fba4a-9ef6-4f16-823d-606246054741
  status: test
  author: Nasreddine Bencherchali (Nextron Systems)
  date: '2023-06-12'
  modified: '2024-01-31'
  level: high
  logsource:
    category: network_connection
    product: windows
  falsepositives:
  - Unknown
