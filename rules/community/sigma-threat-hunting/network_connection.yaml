id: sigma-8cb4d14e-776e-43c2-8fb9-91e7fcea32b4
title: Potentially Suspicious Azure Front Door Connection
description: Detects connections with Azure Front Door (known legitimate service that can be leveraged for C2) that fall outside
  of known benign behavioral baseline (not using common apps or common azurefd.net endpoints)
severity: medium
source: events
attack:
- T1102.002
- T1090.004
tags:
- sigma
- network_connection
- command-and-control
- detection.threat-hunting
references:
- https://lots-project.com/site/2a2e617a75726566642e6e6574
- https://medium.com/r3d-buck3t/red-teaming-in-cloud-leverage-azure-frontdoor-cdn-for-c2-redirectors-79dd9ca98178
- https://www.fortalicesolutions.com/posts/hiding-behind-the-front-door-with-azure-domain-fronting
where:
  channel|contains: sysmon
  eventId: 3
  destinationHostname|contains: azurefd.net
  not:
    any_of:
    - image|endswith:
      - brave.exe
      - chrome.exe
      - chromium.exe
      - firefox.exe
      - msedge.exe
      - msedgewebview2.exe
      - opera.exe
      - vivaldi.exe
    - image|endswith: searchapp.exe
    - destinationHostname|contains_any:
      - afdxtest.z01.azurefd.net
      - fp-afd.azurefd.net
      - fp-afdx-bpdee4gtg6frejfd.z01.azurefd.net
      - roxy.azurefd.net
      - powershellinfraartifacts-gkhedzdeaghdezhr.z01.azurefd.net
      - storage-explorer-publishing-feapcgfgbzc2cjek.b01.azurefd.net
      - graph.azurefd.net
sigma:
