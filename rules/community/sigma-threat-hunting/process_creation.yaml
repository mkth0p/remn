id: sigma-aa3168fb-d594-4f93-a92d-7a9ba675b766
title: Remote Access Tool - Action1 Arbitrary Code Execution and Remote Sessions
description: 'Detects the execution of Action1 in order to execute arbitrary code or establish a remote session. Action1 is
  a powerful Remote Monitoring and Management tool that enables users to execute commands, scripts, and binaries. Through
  the web interface of action1, the administrator must create a new policy or an app to establish remote execution and then
  points that the agent is installed. Hunting Opportunity 1- Weed Out The Noise When threat actors execute a script, a command,
  or a binary through these new policies and apps, the names of these become visible in the command line during the execution
  process. Below is an example of the command line that contains the deployment of a binary through a policy with name "test_app_1":
  ParentCommandLine: "C:\WINDOWS\Action1\action1_agent.exe schedule:Deploy_App__test_app_1_1681327673425 runaction:0" After
  establishing a baseline, we can split the command to extract the policy name and group all the policy names and inspect
  the results with a list of frequency occurrences. Hunting Opportunity 2 - Remote Sessions On Out Of Office Hours If you
  have admins within your environment using remote sessions to administer endpoints, you can create a threat-hunting query
  and modify the time of the initiated sessions looking for abnormal activity.'
severity: medium
source: events
attack:
- T1219.002
tags:
- sigma
- process_creation
- command-and-control
- detection.threat-hunting
references:
- https://twitter.com/Kostastsale/status/1646256901506605063?s=20
- https://www.action1.com/documentation/
where:
  any_of:
  - channel|contains: sysmon
    eventId: 1
  - channel: Security
    eventId: 4688
  any_of_2:
  - any_of:
    - parentImage|endswith: \action1_agent.exe
    - parentProcessName|endswith: \action1_agent.exe
    any_of_2:
    - image|contains: \Windows\Action1\package_downloads\
    - processName|contains: \Windows\Action1\package_downloads\
  - any_of:
    - parentImage|endswith:
      - \cmd.exe
      - \powershell.exe
    - parentProcessName|endswith:
      - \cmd.exe
      - \powershell.exe
    parentCommandLine|contains_any:
    - \Action1\scripts\Run_Command_
    - \Action1\scripts\Run_PowerShell_
  - image|endswith: \agent1_remote.exe
  - processName|endswith: \agent1_remote.exe
