id: sigma-65e4c134-ee52-4099-9e35-5e17a4b45c62
title: Potential File Override/Append Via SET Command
description: 'Detects the use of the "SET" internal command of Cmd.EXE with the /p flag followed directly by an "=" sign.
  Attackers used this technique along with an append redirection operator ">>" in order to update the content of a file indirectly.
  Ex: cmd /c >> example.txt set /p="test data". This will append "test data" to contents of "example.txt". The typical use
  case of the "set /p=" command is to prompt the user for input.'
severity: low
source: events
tags:
- sigma
- process_creation
- execution
- detection.threat-hunting
- stealth
references:
- https://news.sophos.com/en-us/2024/08/07/sophos-mdr-hunt-tracks-mimic-ransomware-campaign-against-organizations-in-india/
- https://learn.microsoft.com/en-us/windows-server/administration/windows-commands/set_1
- https://ss64.com/nt/set.html
where:
  any_of:
  - channel|contains: sysmon
    eventId: 1
  - channel: Security
    eventId: 4688
  any_of_2:
  - image|endswith: \cmd.exe
  - processName|endswith: \cmd.exe
  - originalFileName: Cmd.Exe
  commandLine|re:
  - /c\ set\ /p=
  - '"set\ /p='
  - '>>.*set\ /p='
sigma:
  id: 65e4c134-ee52-4099-9e35-5e17a4b45c62
  status: test
  author: Nasreddine Bencherchali (Nextron Systems), MahirAli Khan (in/mahiralikhan)
  date: '2024-08-22'
  level: low
  logsource:
    category: process_creation
    product: windows
  falsepositives:
  - Legitimate use of the SET with the "/p" flag for user prompting. command in administrative scripts or user-generated scripts.
