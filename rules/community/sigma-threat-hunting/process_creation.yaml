id: sigma-349d891d-fef0-4fe4-bc53-eee623a15969
title: Use Short Name Path in Command Line
description: 'Detects the use of short name paths (8.3 format) in command lines, which can be used to obfuscate paths or access
  restricted locations. Windows creates short 8.3 filenames (like PROGRA~1) for compatibility with MS-DOS-based or 16-bit
  Windows programs. When investigating, examine: - Commands using short paths to access sensitive directories or files - Web
  servers on Windows (especially Apache) where short filenames could bypass security controls - Correlation with other suspicious
  behaviors - baseline of short name usage in your environment and look for deviations'
severity: medium
source: events
attack:
- T1564.004
tags:
- sigma
- process_creation
- stealth
- detection.threat-hunting
references:
- https://www.acunetix.com/blog/articles/windows-short-8-3-filenames-web-security-problem/
- https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-2000-server/cc959352(v=technet.10)
- https://twitter.com/frack113/status/1555830623633375232
where:
  all_of:
  - any_of:
    - channel|contains: sysmon
      eventId: 1
    - channel: Security
      eventId: 4688
  - commandLine|contains_any:
    - ~1\
    - ~2\
  - not:
      any_of:
      - parentImage|in:
        - C:\Windows\System32\Dism.exe
        - C:\Windows\System32\cleanmgr.exe
      - parentProcessName|in:
        - C:\Windows\System32\Dism.exe
        - C:\Windows\System32\cleanmgr.exe
      - parentImage|endswith: \winget.exe
      - parentProcessName|endswith: \winget.exe
      - parentImage|contains: \AppData\Local\Temp\WinGet\
      - parentProcessName|contains: \AppData\Local\Temp\WinGet\
      - any_of:
        - parentImage|startswith: C:\Windows\Microsoft.NET\Framework64\v
        - parentProcessName|startswith: C:\Windows\Microsoft.NET\Framework64\v
        any_of_2:
        - parentImage|endswith: \csc.exe
        - parentProcessName|endswith: \csc.exe
      - image|contains_all:
        - \AppData\
        - \Temp\
      - processName|contains_all:
        - \AppData\
        - \Temp\
      - commandLine|contains: \AppData\Local\Temp\
  - not:
      any_of:
      - parentImage: C:\Program Files\GPSoftware\Directory Opus\dopus.exe
      - parentProcessName: C:\Program Files\GPSoftware\Directory Opus\dopus.exe
      - parentImage|endswith:
        - \aurora-agent-64.exe
        - \aurora-agent.exe
      - parentProcessName|endswith:
        - \aurora-agent-64.exe
        - \aurora-agent.exe
      - parentImage|endswith: \thor\thor64.exe
      - parentProcessName|endswith: \thor\thor64.exe
      - commandLine|contains_any:
        - C:\Program Files\Git\post-install.bat
        - C:\Program Files\Git\cmd\scalar.exe
      - parentImage|endswith: \WebEx\webexhost.exe
      - parentProcessName|endswith: \WebEx\webexhost.exe
      - commandLine|contains: \appdata\local\webex\webex64\meetings\wbxreport.exe
      - parentImage|endswith: \veeam.backup.shell.exe
      - parentProcessName|endswith: \veeam.backup.shell.exe
      - parentImage|endswith: \Everything\Everything.exe
      - parentProcessName|endswith: \Everything\Everything.exe
sigma:
