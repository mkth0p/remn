title: Potentially Suspicious PowerShell Child Processes
description: Detects potentially suspicious child processes spawned by PowerShell. Use this rule to hunt for potential anomalies
  initiating from PowerShell scripts and commands.
severity: medium
source: events
attack:
- T1059.001
tags:
- sigma
- process_creation
- execution
- detection.threat-hunting
references:
