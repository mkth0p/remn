id: sigma-95724fc1-a258-4674-97db-a30351981c5a
title: Manual Execution of Script Inside of a Compressed File
description: This is a threat-hunting query to collect information related to the interactive execution of a script from inside
  a compressed file (zip/rar). Windows will automatically run the script using scripting interpreters such as wscript and
  cscript binaries. From the query below, the child process is the script interpreter that will execute the script. The script
  extension is also a set of standard extensions that Windows OS recognizes. Selections 1-3 contain three different execution
  scenarios. 1. Compressed file opened using 7zip. 2. Compressed file opened using WinRar. 3. Compressed file opened using
  native windows File Explorer capabilities. When the malicious script is double-clicked, it will be extracted to the respected
  directories as signified by the CommandLine on each of the three Selections. It will then be executed using the relevant
  script interpreter."
severity: medium
source: events
attack:
- T1059
tags:
- sigma
- process_creation
- execution
- detection.threat-hunting
references:
- https://app.any.run/tasks/25970bb5-f864-4e9e-9e1b-cc8ff9e6386a
- https://app.any.run/tasks/fa99cedc-9d2f-4115-a08e-291429ce3692
where:
  any_of:
  - channel|contains: sysmon
    eventId: 1
  - channel: Security
    eventId: 4688
  any_of_2:
  - any_of:
    - parentImage|re: \\7z.*\.exe$
    - parentProcessName|re: \\7z.*\.exe$
    commandLine|re: \\AppData\\local\\temp\\7z.*\\
  - any_of:
    - parentImage|endswith: \winrar.exe
    - parentProcessName|endswith: \winrar.exe
    commandLine|re: \\AppData\\local\\temp\\rar.*\\
  - any_of:
    - parentImage|endswith: \explorer.exe
    - parentProcessName|endswith: \explorer.exe
    commandLine|contains_any:
    - \AppData\local\temp*.rar\
    - \AppData\local\temp*.zip\
  any_of_3:
  - image|endswith:
    - \cscript.exe
    - \mshta.exe
    - \powershell.exe
    - \pwsh.exe
    - \wscript.exe
  - processName|endswith:
    - \cscript.exe
    - \mshta.exe
    - \powershell.exe
    - \pwsh.exe
    - \wscript.exe
  commandLine|endswith:
  - .hta
  - .js
  - .jse
  - .ps1
  - .vbe
  - .vbs
  - .wsf
  - .wsh
sigma:
  id: 95724fc1-a258-4674-97db-a30351981c5a
  status: test
  author: '@kostastsale'
  date: '2023-02-15'
  modified: '2024-08-13'
  level: medium
  logsource:
    category: process_creation
    product: windows
  falsepositives:
  - Batch files may produce a lot of noise, as many applications appear to bundle them as part of their installation process.
    You should baseline your environment and generate a new query excluding the noisy and expected activity. Some false positives
    may come up depending on your environment. All results should be investigated thoroughly before filtering out results.
