where:
  all_of:
  - any_of:
    - channel|contains: sysmon
      eventId: 1
    - channel: Security
      eventId: 4688
  - any_of:
    - parentImage|endswith:
      - \powershell_ise.exe
      - \powershell.exe
      - \pwsh.exe
    - parentProcessName|endswith:
      - \powershell_ise.exe
      - \powershell.exe
      - \pwsh.exe
    any_of_2:
    - image|endswith:
      - \bash.exe
      - \bitsadmin.exe
      - \certutil.exe
      - \cscript.exe
      - \forfiles.exe
      - \hh.exe
      - \mshta.exe
      - \regsvr32.exe
      - \rundll32.exe
      - \schtasks.exe
      - \scrcons.exe
      - \scriptrunner.exe
      - \sh.exe
      - \wmic.exe
      - \wscript.exe
    - processName|endswith:
      - \bash.exe
      - \bitsadmin.exe
      - \certutil.exe
      - \cscript.exe
      - \forfiles.exe
      - \hh.exe
      - \mshta.exe
      - \regsvr32.exe
      - \rundll32.exe
      - \schtasks.exe
      - \scrcons.exe
      - \scriptrunner.exe
      - \sh.exe
      - \wmic.exe
      - \wscript.exe
