- https://curl.se/docs/manpage.html
where:
  any_of:
  - channel|contains: sysmon
    eventId: 1
  - channel: Security
    eventId: 4688
  any_of_2:
  - image|endswith: \curl.exe
  - processName|endswith: \curl.exe
  - product: The curl executable
  any_of_3:
  - commandLine|contains_any:
    - ' --form'
    - ' --upload-file '
