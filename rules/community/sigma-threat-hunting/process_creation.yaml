id: sigma-fb0b815b-f5f6-4f50-970f-ffe21f253f7a
title: Potential DLL Sideloading Activity Via ExtExport.EXE
description: Detects the execution of "Extexport.exe".A utility that is part of the Internet Explorer browser and is used
  to export and import various settings and data, particularly when switching between Internet Explorer and other web browsers
  like Firefox. It allows users to transfer bookmarks, browsing history, and other preferences from Internet Explorer to Firefox
  or vice versa. It can be abused as a tool to side load any DLL. If a folder is provided in the command line it'll load any
  DLL with one of the following names "mozcrt19.dll", "mozsqlite3.dll", or "sqlite.dll". Arbitrary DLLs can also be loaded
  if a specific number of flags was provided.
severity: medium
source: events
attack:
- T1218
