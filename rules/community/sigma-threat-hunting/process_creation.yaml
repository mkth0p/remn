title: CMD Shell Output Redirect
description: Detects the use of the redirection character ">" to redirect information on the command line. This technique
  is sometimes used by malicious actors in order to redirect the output of reconnaissance commands such as "hostname" and
  "dir" to files for future exfiltration.
severity: low
source: events
