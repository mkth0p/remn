title: Process Terminated Via Taskkill
description: Detects execution of "taskkill.exe" in order to stop a service or a process. Look for suspicious parents executing
  this command in order to hunt for potential malicious activity. Attackers might leverage this in order to conduct data destruction
  or data encrypted for impact on the data stores of services like Exchange and SQL Server.
severity: low
source: events
attack:
- T1489
tags:
- sigma
- process_creation
- impact
- detection.threat-hunting
references:
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1489/T1489.md#atomic-test-3---windows---stop-service-by-killing-process
- https://unit42.paloaltonetworks.com/snipbot-romcom-malware-variant/
where:
  any_of:
  - channel|contains: sysmon
    eventId: 1
  - channel: Security
    eventId: 4688
  any_of_2:
  - image|endswith: \taskkill.exe
  - processName|endswith: \taskkill.exe
  - originalFileName: taskkill.exe
  any_of_3:
  - commandLine|contains_any:
    - ' -f '
    - ' /f '
    - ' –f '
    - ' —f '
    - ' ―f '
  - commandLine|endswith:
    - ' -f'
    - ' /f'
    - ' –f'
    - ' —f'
    - ' ―f'
  commandLine|contains_any:
  - ' -im '
  - ' /im '
  - ' –im '
  - ' —im '
  - ' ―im '
  - ' -pid '
  - ' /pid '
  - ' –pid '
  - ' —pid '
  - ' ―pid '
  not:
    any_of:
    - parentImage|contains_any:
      - \AppData\Local\Temp\
      - :\Windows\Temp
    - parentProcessName|contains_any:
      - \AppData\Local\Temp\
      - :\Windows\Temp
    any_of_2:
    - parentImage|endswith: .tmp
    - parentProcessName|endswith: .tmp
