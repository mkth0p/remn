id: sigma-ce2c44b5-a6ac-412a-afba-9e89326fa972
title: Regsvr32.EXE Calling of DllRegisterServer Export Function Implicitly
description: Detects execution of regsvr32 with the silent flag and no other flags on a DLL located in an uncommon or potentially
  suspicious location. When Regsvr32 is called in such a way, it implicitly calls the DLL export function 'DllRegisterServer'.
severity: medium
source: events
attack:
- T1218
tags:
- sigma
- process_creation
- stealth
- detection.threat-hunting
references:
- https://thedfirreport.com/2023/08/28/html-smuggling-leads-to-domain-wide-ransomware/
- https://www.virustotal.com/gui/file/288fc4f954f98d724e6fab32a89477943df5c0e9662cb199a19b90ae0c63aebe/detection
- https://learn.microsoft.com/en-us/windows/win32/api/olectl/nf-olectl-dllregisterserver
- https://ss64.com/nt/regsvr32.html
where:
  any_of:
  - channel|contains: sysmon
    eventId: 1
  - channel: Security
    eventId: 4688
  any_of_2:
  - image|endswith: \regsvr32.exe
  - processName|endswith: \regsvr32.exe
  - originalFileName: REGSVR32.EXE
  commandLine|contains_any:
  - ' /s '
  - ' /e '
  not:
    any_of:
    - commandLine|contains_any:
      - :\Program Files (x86)
      - :\Program Files\
      - :\Windows\System32\
      - :\Windows\SysWOW64\
    - currentDirectory|contains_any:
      - :\Program Files (x86)
      - :\Program Files\
      - :\Windows\System32\
      - :\Windows\SysWOW64\
    - commandLine|contains_any:
      - ' /i:'
      - '/U '
    - parentCommandLine|endswith: :\Windows\System32\RpcProxy\RpcProxy.dll
      commandLine: regsvr32 /s rpcproxy.dll
