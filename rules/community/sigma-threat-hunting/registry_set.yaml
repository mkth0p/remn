id: sigma-277dc340-0540-42e7-8efb-5ff460045e07
title: Service Binary in User Controlled Folder
description: Detects the setting of the "ImagePath" value of a service registry key to a path controlled by a non-administrator
  user such as "\AppData\" or "\ProgramData\". Attackers often use such directories for staging purposes. This rule might
  also trigger on badly written software, where if an attacker controls an auto starting service, they might achieve persistence
  or privilege escalation. Note that while ProgramData is a user controlled folder, software might apply strict ACLs which
  makes them only accessible to admin users. Remove such folders via filters if you experience a lot of noise.
severity: medium
source: events
attack:
- T1112
tags:
- sigma
- registry_set
- persistence
- defense-impairment
- detection.threat-hunting
references:
- https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1562.001/T1562.001.md
where:
  all_of:
  - channel|contains: sysmon
    eventId: 13
  - targetObject|contains_all:
    - ControlSet
    - \Services\
    targetObject|endswith: \ImagePath
    details|contains_any:
    - :\ProgramData\
    - \AppData\Local\
    - \AppData\Roaming\
  - not:
      targetObject|contains_any:
      - \Services\WinDefend\
      - \Services\MpKs
      details|contains: C:\ProgramData\Microsoft\Windows Defender\
  - not:
      any_of:
      - targetObject|contains: \Services\ZoomCptService
        details|contains: C:\Program Files\Common Files\Zoom\Support\CptService.exe
      - targetObject|contains: \Services\MBAMInstallerService
        details|contains_all:
        - C:\Users\
        - AppData\Local\Temp\MBAMInstallerService.exe
