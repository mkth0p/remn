id: sigma-1c2a3268-3881-414a-80af-a5b313b14c0e
title: Registry Set With Crypto-Classes From The "Cryptography" PowerShell Namespace
description: Detects the setting of a registry inside the "\Shell\Open\Command" value with PowerShell classes from the "System.Security.Cryptography"
  namespace. The PowerShell namespace "System.Security.Cryptography" provides classes for on-the-fly encryption and decryption.
  These can be used for example in decrypting malicious payload for defense evasion.
severity: medium
source: events
attack:
- T1059.001
- T1027.010
- T1547.001
tags:
- sigma
- registry_set
- execution
- persistence
- privilege-escalation
- stealth
- detection.threat-hunting
references:
- https://learn.microsoft.com/en-us/dotnet/api/system.security.cryptography?view=net-8.0
- https://squiblydoo.blog/2023/11/07/october-2023-solarmarker/
where:
  all_of:
  - channel|contains: sysmon
    eventId: 13
  - targetObject|contains: \Shell\Open\Command
  - details|contains_any:
    - powershell
    - pwsh
  - details|contains: System.Security.Cryptography.
  - details|contains_any:
    - .AesCryptoServiceProvider
    - .DESCryptoServiceProvider
    - .DSACryptoServiceProvider
    - .RC2CryptoServiceProvider
    - .Rijndael
    - .RSACryptoServiceProvider
    - .TripleDESCryptoServiceProvider
sigma:
  id: 1c2a3268-3881-414a-80af-a5b313b14c0e
  status: test
  author: Andreas Braathen (mnemonic.io)
  date: '2023-12-01'
  level: medium
  logsource:
    product: windows
    category: registry_set
  falsepositives:
  - Classes are legitimately used, but less so when e.g. parents with low prevalence or decryption of content in temporary
    folders.
