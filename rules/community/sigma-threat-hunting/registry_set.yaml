id: sigma-a0bed973-45fa-4625-adb5-6ecdf9be70ac
title: Microsoft Office Trusted Location Updated
description: Detects changes to the registry keys related to "Trusted Location" of Microsoft Office. Attackers might add additional
  trusted locations to avoid macro security restrictions.
severity: medium
source: events
attack:
- T1112
tags:
- sigma
- registry_set
- persistence
- defense-impairment
- detection.threat-hunting
references:
- https://admx.help/?Category=Office2016&Policy=excel16.Office.Microsoft.Policies.Windows::L_TrustedLoc01
where:
  channel|contains: sysmon
  eventId: 13
  targetObject|contains: Security\Trusted Locations\Location
  targetObject|endswith: \Path
  not:
    any_of:
    - image|contains: :\Program Files\Common Files\Microsoft Shared\ClickToRun\
      image|endswith: \OfficeClickToRun.exe
    - image|contains_any:
      - :\Program Files\Microsoft Office\
      - :\Program Files (x86)\Microsoft Office\
sigma:
  id: a0bed973-45fa-4625-adb5-6ecdf9be70ac
  status: test
  author: Nasreddine Bencherchali (Nextron Systems)
