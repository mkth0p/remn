id: sigma-eeb2e3dc-c1f4-40dd-9bd5-149ee465ad50
title: Remote Thread Creation Via PowerShell
description: Detects the creation of a remote thread from a Powershell process to another process
severity: medium
source: events
attack:
- T1059.001
tags:
- sigma
- create_remote_thread
- execution
- detection.threat-hunting
references:
- https://speakerdeck.com/heirhabarov/hunting-for-powershell-abuse
where:
  channel|contains: sysmon
  eventId: 8
  sourceImage|endswith:
  - \powershell.exe
  - \pwsh.exe
  not:
    data.SourceParentImage|endswith: :\Windows\System32\CompatTelRunner.exe
