id: sigma-a9d4d3fa-8fc0-41bc-80b1-30b9fda79d6f
title: Remote Thread Created In Shell Application
description: Detects remote thread creation in command shell applications, such as "Cmd.EXE" and "PowerShell.EXE". It is a
  common technique used by malware, such as IcedID, to inject malicious code and execute it within legitimate processes.
severity: medium
source: events
attack:
- T1055
tags:
- sigma
- create_remote_thread
- privilege-escalation
- stealth
- detection.threat-hunting
references:
- https://research.splunk.com/endpoint/10399c1e-f51e-11eb-b920-acde48001122/
- https://www.binarydefense.com/resources/blog/icedid-gziploader-analysis/
where:
  all_of:
  - channel|contains: sysmon
    eventId: 8
  - targetImage|endswith:
    - \cmd.exe
    - \powershell.exe
    - \pwsh.exe
  - not:
      sourceImage|startswith:
      - C:\Windows\System32\
      - C:\Windows\SysWOW64\
      - C:\Program Files (x86)\
      - C:\Program Files\
  - not:
      sourceImage|endswith: \MsMpEng.exe
sigma:
  id: a9d4d3fa-8fc0-41bc-80b1-30b9fda79d6f
