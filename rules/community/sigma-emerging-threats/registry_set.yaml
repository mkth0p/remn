id: sigma-c9b86500-1ec2-4de6-9120-d744c8fb5caf
title: Potential KamiKakaBot Activity - Winlogon Shell Persistence
description: Detects changes to the "Winlogon" registry key where a process will set the value of the "Shell" to a value that
  was observed being used by KamiKakaBot samples in order to achieve persistence.
severity: high
source: events
attack:
- T1547.001
tags:
- sigma
- registry_set
- privilege-escalation
- persistence
- detection.emerging-threats
references:
- https://www.nextron-systems.com/2024/03/22/unveiling-kamikakabot-malware-analysis/
where:
  channel|contains: sysmon
  eventId: 13
  targetObject|endswith: \Microsoft\Windows NT\CurrentVersion\Winlogon\Shell
  details|contains_all:
