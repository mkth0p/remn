id: sigma-83314318-052a-4c90-a1ad-660ece38d276
title: Blackbyte Ransomware Registry
description: Detects specific windows registry modifications made by BlackByte ransomware variants. BlackByte set three different
  registry values to escalate privileges and begin setting the stage for lateral movement and encryption. This rule triggers
  when any of the following registry keys are set to DWORD 1, however all three should be investigated as part of a larger
  BlackByte ransomware detection and response effort.
severity: high
source: events
attack:
- T1112
tags:
- sigma
- registry_set
- persistence
- defense-impairment
- detection.emerging-threats
references:
- https://redcanary.com/blog/blackbyte-ransomware/?utm_source=twitter&utm_medium=social
- https://www.trustwave.com/en-us/resources/blogs/spiderlabs-blog/blackbyte-ransomware-pt-1-in-depth-analysis/
where:
  channel|contains: sysmon
  eventId: 13
  targetObject|in:
  - HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System\LocalAccountTokenFilterPolicy
  - HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System\EnableLinkedConnections
  - HKLM\SYSTEM\CurrentControlSet\Control\FileSystem\LongPathsEnabled
  details: DWORD (0x00000001)
