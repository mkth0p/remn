id: sigma-fc06e655-d98c-412f-ac76-05c2698b1cb2
title: Outlook Task/Note Reminder Received
description: Detects changes to the registry values related to outlook that indicates that a reminder was triggered for a
  Note or Task item. This could be a sign of exploitation of CVE-2023-23397. Further investigation is required to determine
  the success of an exploitation.
severity: low
source: events
attack:
- T1137
tags:
- sigma
- registry_set
- persistence
- cve.2023-23397
- detection.emerging-threats
references:
- https://www.microsoft.com/en-us/security/blog/2023/03/24/guidance-for-investigating-attacks-using-cve-2023-23397/
where:
  channel|contains: sysmon
  eventId: 13
  targetObject|contains_all:
  - \SOFTWARE\Microsoft\Office\
  - \Outlook\
  targetObject|contains_any:
  - \Tasks\
  - \Notes\
sigma:
  id: fc06e655-d98c-412f-ac76-05c2698b1cb2
  status: test
  author: Nasreddine Bencherchali (Nextron Systems)
  date: '2023-04-05'
  modified: '2023-08-17'
  level: low
  logsource:
    category: registry_set
    product: windows
  falsepositives:
  - Legitimate reminders received for a task or a note will also trigger this rule.
