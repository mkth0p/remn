id: sigma-9b4e7c2a-3f6d-4a8b-b5e9-1c7d3f2e6a4b
title: RedSun - Named Pipe Created
description: Detects the creation of a named pipe with the hardcoded name "REDSUN". The RedSun exploit tool uses a pipe with
  this name for synchronisation and command communication between its components during the Cloud Files API + oplock-based
  AV bypass and privilege escalation chain. RedSun creates the pipe as \\??\pipe\REDSUN. The pipe server listens for the token-duplicated
  elevated process to connect and respond, completing the privilege escalation from user to SYSTEM. Presence of this pipe
  name indicates active or recent RedSun execution.
severity: critical
source: events
attack:
- T1055
- T1685
tags:
- sigma
- pipe_created
- privilege-escalation
- stealth
- defense-impairment
- detection.emerging-threats
references:
- https://github.com/Nightmare-Eclipse/RedSun/blob/7456cc8cf066f5e5fc6cdf7d3272a466ebd6b2f6/RedSun.cpp#L591
- https://deadeclipse666.blogspot.com/2026/04/public-disclosure-response-for-cve-2026.html
where:
  channel|contains: sysmon
  eventId|in:
  - 17
  - 18
  pipeName: \REDSUN
