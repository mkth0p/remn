sigma:
  id: bae7c70b-8569-44e9-accf-b30073da8a5d
  status: experimental
  author: Swachchhanda Shrawan Poudel (Nextron Systems)
  date: '2025-11-28'
  level: high
  logsource:
    category: process_creation
    product: windows
  falsepositives:
  - Unknown
---
id: sigma-bbb2dedd-a0e3-46ab-ba6c-6c82ae7a9aa7
title: HAFNIUM Exchange Exploitation Activity
description: Detects activity observed by different researchers to be HAFNIUM group activity (or related) on Exchange servers
severity: critical
source: events
attack:
- T1546
- T1053
tags:
- sigma
- process_creation
- privilege-escalation
- execution
- persistence
- g0125
- detection.emerging-threats
references:
- https://blog.truesec.com/2021/03/07/exchange-zero-day-proxylogon-and-hafnium/
- https://www.microsoft.com/security/blog/2021/03/02/hafnium-targeting-exchange-servers/
- https://discuss.elastic.co/t/detection-and-response-for-hafnium-activity/266289/3
- https://twitter.com/GadixCRK/status/1369313704869834753?s=20
- https://twitter.com/BleepinComputer/status/1372218235949617161
where:
  any_of:
  - channel|contains: sysmon
    eventId: 1
  - channel: Security
    eventId: 4688
  any_of_2:
  - commandLine|contains_all:
    - attrib
    - ' +h '
    - ' +s '
    - ' +r '
    - .aspx
  - image|contains: \ProgramData\VSPerfMon\
  - processName|contains: \ProgramData\VSPerfMon\
  - commandLine|contains_all:
    - schtasks
    - VSPerfMon
  - any_of:
    - image|endswith: Opera_browser.exe
    - processName|endswith: Opera_browser.exe
    any_of_2:
    - parentImage|endswith:
      - \services.exe
      - \svchost.exe
    - parentProcessName|endswith:
      - \services.exe
      - \svchost.exe
  - image|endswith: Users\Public\opera\Opera_browser.exe
  - processName|endswith: Users\Public\opera\Opera_browser.exe
  - commandLine|contains_all:
    - vssadmin list shadows
    - Temp\__output
  - any_of:
    - image|endswith: \makecab.exe
    - processName|endswith: \makecab.exe
    commandLine|contains_all:
    - inetpub\wwwroot\
    - .dmp.zip
  - any_of:
    - image|endswith: \makecab.exe
    - processName|endswith: \makecab.exe
    commandLine|contains_any:
    - Microsoft\Exchange Server\
    - compressionmemory
    - .gif
  - commandLine|contains_all:
    - ' -t7z '
    - C:\Programdata\pst
    - \it.zip
  - commandLine|contains_all:
    - \comsvcs.dll
    - Minidump
    - 'full '
    - \inetpub\wwwroot
  - commandLine|contains_any:
    - Windows\Temp\xx.bat
    - Windows\WwanSvcdcs
    - Windows\Temp\cw.exe
sigma:
  id: bbb2dedd-a0e3-46ab-ba6c-6c82ae7a9aa7
  status: test
  author: Florian Roth (Nextron Systems)
  date: '2021-03-09'
  modified: '2023-03-09'
  level: critical
  logsource:
    category: process_creation
    product: windows
  falsepositives:
  - Unlikely
---
id: sigma-bc309b7a-3c29-4937-a4a3-e232473f9168
title: Qakbot Uninstaller Execution
description: Detects the execution of the Qakbot uninstaller file mentioned in the USAO-CDCA document on the disruption of
  the Qakbot malware and botnet
severity: high
source: events
tags:
- sigma
- process_creation
- execution
- detection.emerging-threats
references:
- https://www.justice.gov/usao-cdca/divisions/national-security-division/qakbot-resources
- https://www.virustotal.com/gui/file/7cdee5a583eacf24b1f142413aabb4e556ccf4ef3a4764ad084c1526cc90e117/community
- https://www.virustotal.com/gui/file/fab408536aa37c4abc8be97ab9c1f86cb33b63923d423fdc2859eb9d63fa8ea0/community
where:
  any_of:
  - channel|contains: sysmon
    eventId: 1
  - channel: Security
    eventId: 4688
  any_of_2:
  - image|endswith: \QbotUninstall.exe
