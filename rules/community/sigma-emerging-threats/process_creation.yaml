id: sigma-7c3a5b1d-9e2f-4a8c-b5d7-1e0f3c6a9b2d
title: Potential CVE-2026-33829 Exploitation - Windows Snipping Tool Remote File Path URI
description: Detects potential exploitation of CVE-2026-33829, a vulnerability in the Windows Snipping Tool URI handler (ms-screensketch:).
  An attacker can abuse the 'filePath' parameter to supply a UNC path or HTTP URL, causing SnippingTool.exe to initiate a
  connection to a remote resource. When a UNC path is used (e.g. \\attacker.com\share), this triggers an outbound NTLM authentication
  attempt, allowing the attacker to capture or relay the victim's Net-NTLMv2 hash. HTTP-based paths may result in remote file
  loading or server-side request forgery (SSRF)-style access. The URI can be delivered via a malicious hyperlink, phishing
  email, or web page.
severity: high
source: events
attack:
- T1187
tags:
- sigma
- process_creation
- credential-access
- detection.emerging-threats
- cve.2026-33829
references:
- https://x.com/BlackArrowSec/status/2044374743491424508
- https://x.com/SBousseaden/status/2044417029721997635
where:
  any_of:
  - channel|contains: sysmon
    eventId: 1
  - channel: Security
    eventId: 4688
  any_of_2:
  - image|endswith: \SnippingTool.exe
  - processName|endswith: \SnippingTool.exe
  commandLine|re:
  - ms\-screensketch:edit.\&filePath=\\\\
  - ms\-screensketch:edit.\&filePath=%%5C
  - ms\-screensketch:edit.\&filePath=%5C
  - ms\-screensketch:edit.\&filePath=http
