    - \netsh.exe
    - \makecab.exe
    - \dxdiag.exe
    - \ipconfig.exe
    - \explorer.exe
  - processName|endswith:
    - \route.exe
    - \netsh.exe
    - \makecab.exe
    - \dxdiag.exe
    - \ipconfig.exe
    - \explorer.exe
  not:
    any_of:
    - image|startswith:
      - C:\Windows\System32\
      - C:\Windows\SysWOW64\
