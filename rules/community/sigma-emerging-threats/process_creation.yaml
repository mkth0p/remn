id: sigma-0033cf83-fb87-446d-9cac-43d63ad4d5a9
title: Qakbot Regsvr32 Calc Pattern
description: Detects a specific command line of "regsvr32" where the "calc" keyword is used in conjunction with the "/s" flag.
  This behavior is often seen used by Qakbot
severity: high
source: events
tags:
- sigma
- process_creation
- execution
- detection.emerging-threats
- stealth
references:
- https://github.com/pr0xylife/Qakbot/
where:
  any_of:
  - channel|contains: sysmon
    eventId: 1
  - channel: Security
    eventId: 4688
  any_of_2:
  - image|endswith: \regsvr32.exe
  - processName|endswith: \regsvr32.exe
  commandLine|contains_any:
  - ' -s'
  - ' /s'
  - ' –s'
  - ' —s'
  - ' ―s'
  commandLine|endswith: ' calc'
sigma:
  id: 0033cf83-fb87-446d-9cac-43d63ad4d5a9
  status: test
  author: Nasreddine Bencherchali (Nextron Systems)
  date: '2023-05-26'
  modified: '2024-03-05'
