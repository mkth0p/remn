id: sigma-abe06362-a5b9-4371-8724-ebd00cd48a04
title: Potential Exploitation of RCE Vulnerability CVE-2025-33053
description: Detects potential exploitation of remote code execution vulnerability CVE-2025-33053 which involves unauthorized
  code execution via WebDAV through external control of file names or paths. The exploit abuses legitimate utilities like
  iediagcmd.exe or CustomShellHost.exe by manipulating their working directories to point to attacker-controlled WebDAV servers,
  causing them to execute malicious executables (like route.exe) from the WebDAV path instead of legitimate system binaries
  through Process.Start() search order manipulation.
