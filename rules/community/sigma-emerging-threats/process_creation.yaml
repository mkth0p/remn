id: sigma-f6c27ecc-d890-4452-80e6-2e274a10e097
title: Axios NPM Compromise Indicators - Windows
description: Detects the specific Windows execution chain and process tree associated with the Axios NPM supply chain compromise.
  On March 30, 2026, malicious versions (1.14.1, 0.30.4) were published to npm, injecting a dependency (plain-crypto-js@4.2.1)
  that executed a postinstall script as a cross-platform RAT dropper. The dropper contacted a C2 server, delivered platform-specific
  payloads, deleted itself, and replaced package.json to evade detection. The attack used cscript.exe (VBScript), curl.exe
  (C2), and PowerShell masquerading as Windows Terminal.
severity: high
source: events
attack:
- T1195.002
- T1059.003
- T1059.005
- T1105
tags:
- sigma
- process_creation
- initial-access
- execution
- command-and-control
- detection.emerging-threats
references:
- https://www.stepsecurity.io/blog/axios-compromised-on-npm-malicious-versions-drop-remote-access-trojan
- https://thehackernews.com/2026/03/axios-supply-chain-attack-pushes-cross.html?m=1
- https://www.derp.ca/research/axios-npm-supply-chain-rat/
- https://www.elastic.co/security-labs/axios-supply-chain-compromise-detections
- https://www.virustotal.com/gui/file/e10b1fa84f1d6481625f741b69892780140d4e0e7769e7491e5f4d894c2e0e09
where:
  any_of:
  - channel|contains: sysmon
    eventId: 1
  - channel: Security
    eventId: 4688
  any_of_2:
  - any_of:
    - parentImage|endswith:
      - \node.exe
      - \bun.exe
    - parentProcessName|endswith:
      - \node.exe
      - \bun.exe
    any_of_2:
    - image|endswith: \cmd.exe
    - processName|endswith: \cmd.exe
    commandLine|contains_all:
    - cscript
    - AppData\Local\Temp
    - //nologo && del
    - 6202033.vbs
  - any_of:
    - image|endswith:
      - \curl.exe
      - \powershell.exe
    - processName|endswith:
      - \curl.exe
      - \powershell.exe
    commandLine|contains: http://sfrclak.com
  - originalFileName: PowerShell.EXE
    commandLine|contains: '"C:\ProgramData\wt.exe" -w hidden -ep bypass -file'
