where:
  any_of:
  - channel|contains: sysmon
    eventId: 1
  - channel: Security
    eventId: 4688
  any_of_2:
  - commandLine|contains_all:
    - Invoke-WMIMethod win32_process -name create -argumentlist
    - rundll32 c:\windows
  - commandLine|contains_all:
    - 'wmic /node:'
    - process call create "rundll32 c:\windows
