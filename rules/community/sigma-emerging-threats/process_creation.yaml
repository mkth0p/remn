id: sigma-fe9e8ba9-4419-41e6-a574-bd9f7b3af961
title: Potential KamiKakaBot Activity - Shutdown Schedule Task Creation
description: Detects the creation of a schedule task that runs weekly and execute the "shutdown /l /f" command. This behavior
  was observed being used by KamiKakaBot samples in order to achieve persistence on a system.
severity: medium
source: events
tags:
- sigma
- process_creation
- persistence
- detection.emerging-threats
references:
- https://www.nextron-systems.com/2024/03/22/unveiling-kamikakabot-malware-analysis/
- https://tria.ge/240123-rapteaahhr/behavioral1
where:
  any_of:
  - channel|contains: sysmon
    eventId: 1
  - channel: Security
    eventId: 4688
  any_of_2:
  - image|endswith: \schtasks.exe
  - processName|endswith: \schtasks.exe
  commandLine|contains_all:
  - ' /create '
  - shutdown /l /f
  - WEEKLY
  not:
    any_of:
    - user|contains_any:
      - AUTHORI
      - AUTORI
    - subjectUser|contains_any:
      - AUTHORI
      - AUTORI
