id: sigma-e98f741c-6a5b-4c83-bc2a-1f4e58d07b12
title: Kapeka Backdoor Execution Via RunDLL32.EXE
description: Detects Kapeka backdoor process execution pattern, where the dropper launch the backdoor binary by calling rundll32
  and passing the backdoor's first export ordinal (#1) with a "-d" argument.
severity: high
source: events
attack:
- T1218.011
tags:
- sigma
- process_creation
- stealth
- detection.emerging-threats
references:
- https://labs.withsecure.com/publications/kapeka
- https://app.any.run/tasks/1efb3ed4-cc0f-4690-a0ed-24516809bc72/
where:
  any_of:
  - channel|contains: sysmon
    eventId: 1
  - channel: Security
    eventId: 4688
  any_of_2:
  - image|endswith: \rundll32.exe
  - processName|endswith: \rundll32.exe
  - originalFileName: RUNDLL32.EXE
  commandLine|contains_any:
  - :\ProgramData
  - \AppData\Local
  any_of_3:
  - commandLine|contains_all:
    - .wll
    - '#1'
    - ' -d'
  - commandLine|contains: .wll
    commandLine|endswith: '#1'
