id: sigma-459628e3-1b00-4e9b-9e5b-7da8961aea35
title: Suspicious CrushFTP Child Process
description: Detects suspicious child processes spawned by the CrushFTP service that may indicate exploitation of remote code
  execution vulnerabilities such as CVE-2025-31161, where attackers can achieve RCE through crafted HTTP requests. The detection
  focuses on commonly abused Windows executables (like powershell.exe, cmd.exe etc.) that attackers typically use post-exploitation
  to execute malicious commands.
severity: medium
source: events
attack:
- T1059.001
- T1059.003
- T1190
tags:
- sigma
- process_creation
- initial-access
- execution
- cve.2025-31161
- detection.emerging-threats
references:
- https://nvd.nist.gov/vuln/detail/CVE-2025-2825
- https://www.crushftp.com/crush11wiki/Wiki.jsp?page=Update
- https://outpost24.com/blog/crushftp-auth-bypass-vulnerability/
- https://attackerkb.com/topics/k0EgiL9Psz/cve-2025-2825/rapid7-analysis
- https://projectdiscovery.io/blog/crushftp-authentication-bypass
where:
  any_of:
  - channel|contains: sysmon
    eventId: 1
  - channel: Security
    eventId: 4688
  any_of_2:
  - parentImage|endswith: \crushftpservice.exe
  - parentProcessName|endswith: \crushftpservice.exe
  any_of_3:
  - image|endswith:
    - \bash.exe
    - \cmd.exe
    - \cscript.exe
    - \mshta.exe
    - \powershell.exe
    - \powershell_ise.exe
    - \pwsh.exe
    - \sh.exe
    - \wscript.exe
  - processName|endswith:
    - \bash.exe
    - \cmd.exe
    - \cscript.exe
    - \mshta.exe
    - \powershell.exe
    - \powershell_ise.exe
    - \pwsh.exe
    - \sh.exe
    - \wscript.exe
