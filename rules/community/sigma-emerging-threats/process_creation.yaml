id: sigma-032f5fb3-d959-41a5-9263-4173c802dc2b
title: Formbook Process Creation
description: Detects Formbook like process executions that inject code into a set of files in the System32 folder, which executes
  a special command command line to delete the dropper from the AppData Temp folder. We avoid false positives by excluding
  all parent process with command line parameters.
severity: high
source: events
attack:
- T1587.001
tags:
- sigma
- process_creation
- resource-development
- detection.emerging-threats
references:
- https://inquest.net/blog/2018/06/22/a-look-at-formbook-stealer
- https://app.any.run/tasks/388d5802-aa48-4826-b069-250420504758/
- https://app.any.run/tasks/8e22486b-5edc-4cef-821c-373e945f296c/
- https://app.any.run/tasks/62bb01ae-25a4-4180-b278-8e464a90b8d7/
where:
  any_of:
  - channel|contains: sysmon
    eventId: 1
  - channel: Security
    eventId: 4688
  parentCommandLine|startswith:
  - C:\Windows\System32\
  - C:\Windows\SysWOW64\
  parentCommandLine|endswith: .exe
  any_of_2:
  - commandLine|contains_all:
    - /c
    - del
    - C:\Users\
    - \AppData\Local\Temp\
  - commandLine|contains_all:
    - /c
    - del
    - C:\Users\
    - \Desktop\
  - commandLine|contains_all:
    - /C
    - type nul >
    - C:\Users\
    - \Desktop\
  commandLine|endswith: .exe
