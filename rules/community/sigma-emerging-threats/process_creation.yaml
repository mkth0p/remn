id: sigma-e5144106-8198-4f6e-bfc2-0a551cc8dd94
title: Potential Pikabot Infection - Suspicious Command Combinations Via Cmd.EXE
description: Detects the execution of concatenated commands via "cmd.exe". Pikabot often executes a combination of multiple
  commands via the command handler "cmd /c" in order to download and execute additional payloads. Commands such as "curl",
  "wget" in order to download extra payloads. "ping" and "timeout" are abused to introduce delays in the command execution
  and "Rundll32" is also used to execute malicious DLL files. In the observed Pikabot infections, a combination of the commands
  described above are used to orchestrate the download and execution of malicious DLL files.
severity: medium
source: events
attack:
- T1059.003
- T1105
- T1218
tags:
- sigma
- process_creation
- command-and-control
- execution
- stealth
- detection.emerging-threats
