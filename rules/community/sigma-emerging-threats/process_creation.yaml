id: sigma-933f0bb5-0681-4fe7-8a17-4e6cccbaac44
title: Potential Notepad++ CVE-2025-49144 Exploitation
description: Detects potential exploitation of CVE-2025-49144, a local privilege escalation vulnerability in Notepad++ installers
  (v8.8.1 and prior) where the installer calls regsvr32.exe without specifying the full path. This allows an attacker to execute
  arbitrary code with elevated privileges by placing a malicious regsvr32.exe alongside this Legitimate Notepad++ installer.
  The vulnerability is triggered when the installer attempts to register the NppShell.dll file, which is a component of Notepad++.
severity: high
source: events
attack:
- T1574.008
tags:
- sigma
- process_creation
- persistence
- privilege-escalation
- execution
- stealth
- cve.2025-49144
- detection.emerging-threats
references:
- https://cve.mitre.org/cgi-bin/cvename.cgi?name=CVE-2025-49144
- https://x.com/NullSecurityX/status/1937444064867029179
where:
  any_of:
  - channel|contains: sysmon
    eventId: 1
  - channel: Security
    eventId: 4688
  any_of_2:
  - image|endswith: \regsvr32.exe
  - processName|endswith: \regsvr32.exe
  commandLine|startswith: regsvr32 /s
  commandLine|contains: \contextMenu\NppShell.dll
  not:
    any_of:
    - image|in:
      - C:\Windows\System32\regsvr32.exe
      - C:\Windows\SysWOW64\regsvr32.exe
    - processName|in:
      - C:\Windows\System32\regsvr32.exe
      - C:\Windows\SysWOW64\regsvr32.exe
