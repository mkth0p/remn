- https://github.com/pr0xylife/Pikabot/blob/7f7723a74ca325ec54c6e61e076acce9a4b20538/Pikabot_22.12.2023.txt
where:
  all_of:
  - any_of:
    - channel|contains: sysmon
      eventId: 1
    - channel: Security
      eventId: 4688
  - commandLine|contains_all:
    - cmd
    - /c
  - commandLine|contains_any:
    - ' & '
    - ' || '
  - commandLine|contains_any:
    - ' curl'
    - ' wget'
    - ' timeout '
    - ' ping '
  - commandLine|contains_any:
    - ' rundll32'
    - ' mkdir '
