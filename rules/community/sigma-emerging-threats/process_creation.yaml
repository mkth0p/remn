id: sigma-64a871dd-83f6-4e5f-80fc-5a7ca3a8a819
title: Kapeka Backdoor Persistence Activity
description: Detects Kapeka backdoor persistence activity. Depending on the process privileges, the Kapeka dropper then sets
  persistence for the backdoor either as a scheduled task (if admin or SYSTEM) or autorun registry (if not). For the scheduled
  task, it creates a scheduled task called "Sens Api" via schtasks command, which is set to run upon system startup as SYSTEM.
  To establish persistence through the autorun utility, it adds an autorun entry called "Sens Api" under HKCU\SOFTWARE\Microsoft\Windows\CurrentVersion\Run
  via the "reg add" command. Both persistence mechanisms are set to launch the binary by calling rundll32 and passing the
  backdoor's first export ordinal (#1) without any additional argument.
severity: high
source: events
attack:
- T1053.005
tags:
- sigma
- process_creation
- privilege-escalation
- execution
- persistence
- detection.emerging-threats
references:
- https://labs.withsecure.com/publications/kapeka
- https://app.any.run/tasks/1efb3ed4-cc0f-4690-a0ed-24516809bc72/
- https://www.virustotal.com/gui/file/bd07fb1e9b4768e7202de6cc454c78c6891270af02085c51fce5539db1386c3f/behavior
where:
  any_of:
  - channel|contains: sysmon
    eventId: 1
  - channel: Security
    eventId: 4688
  any_of_2:
  - any_of:
    - image|endswith: \schtasks.exe
    - processName|endswith: \schtasks.exe
    - originalFileName: schtasks.exe
    commandLine|contains_all:
    - create
    - ONSTART
  - any_of:
    - image|endswith: \reg.exe
    - processName|endswith: \reg.exe
    - originalFileName: reg.exe
    commandLine|contains_all:
    - add
    - \Software\Microsoft\Windows\CurrentVersion\Run
  commandLine|contains_all:
  - rundll32
  - .wll
  - '#1'
  commandLine|contains_any:
  - Sens Api
  - OneDrive
