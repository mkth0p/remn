id: sigma-271de298-cc0e-4842-acd8-079a0a99ea65
title: Windows Suspicious Child Process from Node.js - React2Shell
description: Detects suspicious child processes started by Node.js server processes on Windows, which may indicate exploitation
  of vulnerabilities like CVE-2025-55182 (React2Shell). Attackers can abuse the Node.js 'child_process' module to run system
  commands or scripts using methods such as spawn(), exec(), execFile(), fork(), or execSync(). If execSync() or exec() is
  used in the exploit, the command line often shows a shell (e.g., cmd.exe /d /s /c ...) running a suspicious command unless
  other shells are explicitly invoked. For other methods, the spawned process appears directly in the Image field unless a
  shell is explicitly used.
severity: high
source: events
attack:
- T1059
- T1190
tags:
- sigma
- process_creation
- execution
- initial-access
- detection.emerging-threats
- cve.2025-55182
references:
- https://github.com/msanft/CVE-2025-55182
- https://nodejs.org/api/child_process.html#class-childprocess
- https://gist.github.com/swachchhanda000/a0228130f86a2dedfbcebb415b47f870
- https://github.com/nasbench/Misc-Research/blob/2f651ede832ab34027a7ba005b63bb78f1ade378/Other/React-Next-Child-Processes-Notes.md
where:
  any_of:
  - channel|contains: sysmon
    eventId: 1
  - channel: Security
    eventId: 4688
  any_of_2:
  - parentImage|endswith: \node.exe
  - parentProcessName|endswith: \node.exe
  parentCommandLine|contains_any:
  - --experimental-https
  - --experimental-next-config-strip-types
  - \node_modules\next
  - next dev
  - next start
  - next" start
  - node_modules\.bin\\..\next
  - react-scripts start
  - start-server.js
  any_of_3:
  - image|endswith:
    - \bash.exe
    - \bitsadmin.exe
    - \certutil.exe
    - \cscript.exe
    - \curl.exe
    - \ipconfig.exe
    - \mshta.exe
    - \net.exe
    - \net1.exe
    - \netsh.exe
    - \nslookup.exe
    - \OpenConsole.exe
    - \perl.exe
    - \ping.exe
    - \powershell.exe
    - \pwsh.exe
    - \py.exe
    - \python.exe
    - \pythonw.exe
    - \pyw.exe
    - \reg.exe
    - \regsvr32.exe
    - \rundll32.exe
    - \sc.exe
    - \sh.exe
    - \systeminfo.exe
    - \wget.exe
    - \whoami.exe
    - \wmic.exe
    - \wscript.exe
    - \wt.exe
  - processName|endswith:
    - \bash.exe
    - \bitsadmin.exe
    - \certutil.exe
    - \cscript.exe
    - \curl.exe
    - \ipconfig.exe
    - \mshta.exe
    - \net.exe
    - \net1.exe
    - \netsh.exe
    - \nslookup.exe
    - \OpenConsole.exe
    - \perl.exe
    - \ping.exe
    - \powershell.exe
    - \pwsh.exe
    - \py.exe
    - \python.exe
    - \pythonw.exe
    - \pyw.exe
    - \reg.exe
    - \regsvr32.exe
    - \rundll32.exe
    - \sc.exe
    - \sh.exe
    - \systeminfo.exe
    - \wget.exe
    - \whoami.exe
    - \wmic.exe
    - \wscript.exe
    - \wt.exe
  - image|contains: \python
  - processName|contains: \python
  - commandLine|contains_any:
    - \net
    - bitsadmin
    - 'certutil '
    - conhost --headless
    - 'cscript '
    - curl
    - ipconfig
    - java
    - lua
    - mshta
    - netsh
    - 'nslookup '
    - perl
    - 'ping '
    - powershell
    - pwsh
    - python
    - 'reg '
    - reg.exe
    - regsvr32
    - ruby
    - rundll32
    - sc.exe
    - systeminfo
    - wget
    - whoami
    - wmic
    - wscript
  - any_of:
    - image|endswith: \cmd.exe
    - processName|endswith: \cmd.exe
    not:
      commandLine|contains: '/d /s /c '
  - any_of:
    - image|endswith: \cmd.exe
    - processName|endswith: \cmd.exe
    commandLine|contains: '/d /s /c '
    not:
      any_of:
      - commandLine|contains: git config --local --get remote.origin.url
      - commandLine|contains_all:
        - 'netstat -ano | findstr /C:'
        - ' | findstr LISTENING'
      - commandLine|contains_all:
        - \mkcert\
        - ' -install '
      - commandLine|contains_all:
        - \mkcert\
        - ' -CAROOT'
