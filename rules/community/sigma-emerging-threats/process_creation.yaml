id: sigma-1bf0ba65-9a39-42a2-9271-31d31bf2f0bf
title: Pikabot Fake DLL Extension Execution Via Rundll32.EXE
description: Detects specific process tree behavior linked to "rundll32" executions, wherein the associated DLL lacks a common
  ".dll" extension, often signaling potential Pikabot activity.
severity: high
source: events
tags:
- sigma
- process_creation
- execution
- detection.emerging-threats
- stealth
references:
- https://github.com/pr0xylife/Pikabot
- https://tria.ge/231004-tp8k6sch9t/behavioral2
- https://www.virustotal.com/gui/file/56db0c4842a63234ab7fe2dda6eeb63aa7bb68f9a456985b519122f74dea37e2/behavior
