id: sigma-cae6cee6-0244-44d2-84ed-e65f548eb7dc
title: Potential Pikabot C2 Activity
description: Detects the execution of rundll32 that leads to an external network connection. The malware Pikabot has been
  seen to use this technique to initiate C2-communication through hard-coded Windows binaries.
severity: high
source: events
attack:
- T1573
tags:
- sigma
- network_connection
- command-and-control
- detection.emerging-threats
references:
- https://www.virustotal.com/gui/file/d72af640b71b8e3eca3eba660dd7c7f029ff8852bcacaa379e7b6c57cf4d9b44
- https://www.virustotal.com/gui/file/6bb4cdbaef03b732a93559a58173e7f16b29bfb159a1065fae9185000ff23b4b
- https://github.com/pr0xylife/Pikabot/blob/7f7723a74ca325ec54c6e61e076acce9a4b20538/Pikabot_06.12.2023.txt
where:
  channel|contains: sysmon
  eventId: 3
  parentImage|endswith: \rundll32.exe
  image|endswith:
  - \SearchFilterHost.exe
  - \SearchProtocolHost.exe
  - \sndvol.exe
  - \wermgr.exe
  - \wwahost.exe
  protocol: tcp
  initiated: 'true'
