id: sigma-9a2d8b3e-f5a1-4c68-9e21-7d9e1cf8a123
title: Potential Exploitation of RCE Vulnerability CVE-2025-33053 - Process Access
description: Detects potential exploitation of remote code execution vulnerability CVE-2025-33053 by looking for process access
  that involves legitimate Windows executables (iediagcmd.exe, CustomShellHost.exe) accessing suspicious executables hosted
  on WebDAV shares. This indicates an attacker may be exploiting Process.Start() search order manipulation to execute malicious
  code from attacker-controlled WebDAV servers instead of legitimate system binaries. The vulnerability allows unauthorized
  code execution through external control of file names or paths via WebDAV.
severity: high
source: events
attack:
- T1218
- T1105
tags:
- sigma
- process_access
- command-and-control
- execution
- stealth
- lateral-movement
- detection.emerging-threats
- cve.2025-33053
references:
- https://msrc.microsoft.com/update-guide/en-US/vulnerability/CVE-2025-33053
- https://research.checkpoint.com/2025/stealth-falcon-zero-day/
where:
  channel|contains: sysmon
  eventId: 10
  sourceImage|in:
  - C:\Program Files\internet explorer\iediagcmd.exe
  - C:\Windows\System32\CustomShellHost.exe
  any_of:
  - targetImage|startswith: \\
  - targetImage|contains: \DavWWWRoot\
  targetImage|endswith:
  - \route.exe
  - \netsh.exe
  - \makecab.exe
  - \dxdiag.exe
  - \ipconfig.exe
  - \explorer.exe
sigma:
  id: 9a2d8b3e-f5a1-4c68-9e21-7d9e1cf8a123
  status: experimental
  author: Swachchhanda Shrawan Poudel (Nextron Systems)
  date: '2025-06-13'
  level: high
  logsource:
    category: process_access
    product: windows
  falsepositives:
  - Unknown
