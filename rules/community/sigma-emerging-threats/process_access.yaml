id: sigma-b7967e22-3d7e-409b-9ed5-cdae3f9243a1
title: Malware Shellcode in Verclsid Target Process
description: Detects a process access to verclsid.exe that injects shellcode from a Microsoft Office application / VBA macro
severity: high
source: events
attack:
- T1055
tags:
- sigma
- process_access
- privilege-escalation
- stealth
- detection.emerging-threats
references:
- https://twitter.com/JohnLaTwC/status/837743453039534080
where:
  channel|contains: sysmon
  eventId: 10
  targetImage|endswith: \verclsid.exe
  grantedAccess: '0x1FFFFF'
  any_of:
  - callTrace|contains_all:
    - '|UNKNOWN('
    - VBE7.DLL
  - sourceImage|contains: \Microsoft Office\
    callTrace|contains: '|UNKNOWN'
sigma:
  id: b7967e22-3d7e-409b-9ed5-cdae3f9243a1
  status: test
  author: John Lambert (tech), Florian Roth (Nextron Systems)
  date: '2017-03-04'
  modified: '2021-11-27'
  level: high
  logsource:
    category: process_access
    product: windows
    definition: 'Requirements: The following config is required to generate the necessary Event ID 10 Process Access events:
      <ProcessAccess onmatch="include"><CallTrace condition="contains">VBE7.DLL</CallTrace></ProcessAccess><ProcessAccess
      onmatch="exclude"><CallTrace condition="excludes">UNKNOWN</CallTrace></ProcessAccess>'
  falsepositives:
  - Unknown
