id: sigma-f8a66a02-4a16-46e5-b7fd-a42c8a93d137
title: LSASS Crash Via Netlogon Stack Buffer Overflow - CVE-2026-41089
description: Detects a crash of the LSASS process where netlogon.dll is the faulting module and the exception code is STATUS_STACK_BUFFER_OVERRUN
  (0xc0000409). This crash, especially on Domain Controllers, might indicate the exploitation of CVE-2026-41089, a denial
  of service (DoS) vulnerability, which exists in the Netlogon component of Windows and can be triggered by sending specially
  crafted requests to the Netlogon service, leading to a stack-based buffer overflow and subsequent crash of the LSASS process.
severity: high
source: events
attack:
- T1499
tags:
- sigma
- application
- impact
- cve.2026-41089
- detection.emerging-threats
references:
- https://aretiq.ai/research/vul260513-cve-2026-41089-microsoft-windows-netlogon-buildsamlogonresponse-stack-based-buffer-overflow-rce/
- https://learn.microsoft.com/en-us/shows/inside/c0000409
- https://github.com/p3Nt3st3r-sTAr/CVE-2026-41089
- https://msrc.microsoft.com/update-guide/vulnerability/CVE-2026-41089
where:
  channel: Application
  provider: Application Error
  eventId: 1000
  data.AppName: lsass.exe
  data.ModuleName: netlogon.dll
  data.ExceptionCode: c0000409
