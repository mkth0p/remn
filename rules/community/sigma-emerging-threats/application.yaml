title: Potential Exploitation of CVE-2022-21919 or CVE-2021-34484 for LPE
description: 'Detects potential exploitation attempts of CVE-2022-21919 or CVE-2021-34484 leading to local privilege escalation
  via the User Profile Service. During exploitation of this vulnerability, two logs (Provider_Name: Microsoft-Windows-User
  Profiles Service) with EventID 1511 and 1515 are created (EventID 1515 may generate many false positives). Additionally,
  the directory \Users\TEMP may be created during exploitation. This behavior was observed on Windows Server 2008.'
