id: sigma-37dc5463-f7e3-4f61-ad76-ba59cd02a651
title: Lace Tempest PowerShell Launcher
description: Detects a PowerShell script used by Lace Tempest APT to launch their malware loader by exploiting CVE-2023-47246
  as reported by SysAid Team
severity: high
source: events
attack:
- T1059.001
tags:
- sigma
- ps_script
- execution
- detection.emerging-threats
references:
- https://www.sysaid.com/blog/service-desk/on-premise-software-security-vulnerability-notification
where:
  channel|contains: powershell/operational
  eventId: 4104
  scriptBlockText|contains_all:
  - \SysAidServer\tomcat\webapps
  - Starting user.exe
  - \usersfiles\user.exe
  - Remove-Item -Force "$wapps
  - (Sophos).
