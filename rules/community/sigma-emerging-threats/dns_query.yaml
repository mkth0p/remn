id: sigma-ac5a4e3f-7f9d-6abc-d8ea-3b4c5f6a7b8c
title: TanStack Supply-Chain Attack DNS Indicators
description: Detects DNS queries to attacker-controlled infrastructure used by the Mini Shai-Hulud campaign targeting TanStack
  npm packages along with other packages such as mistralai, uipath and so on. The domain git-tanstack.com (registered May
  9, 2026) hosted secondary payloads including transformers.pyz. The filev2.getsession.org endpoint was used for credential
  exfiltration via the Session protocol.
severity: medium
source: events
attack:
- T1071.001
- T1048
tags:
- sigma
- dns_query
- command-and-control
- exfiltration
- detection.emerging-threats
references:
- https://socket.dev/blog/tanstack-npm-packages-compromised-mini-shai-hulud-supply-chain-attack
- https://socket.dev/supply-chain-attacks/mini-shai-hulud
- https://safedep.io/mass-npm-supply-chain-attack-tanstack-mistral/
where:
  channel|contains: sysmon
  eventId: 22
  any_of:
  - query: git-tanstack.com
  - query: filev2.getsession.org
