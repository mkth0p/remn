id: sigma-02fb90de-c321-4e63-a6b9-25f4b03dfd14
title: Windows Spooler Service Suspicious Binary Load
description: Detect DLL Load from Spooler Service backup folder. This behavior has been observed during the exploitation of
  the Print Spooler Vulnerability CVE-2021-1675 and CVE-2021-34527 (PrinterNightmare).
severity: info
source: events
attack:
- T1574
tags:
- sigma
- image_load
- persistence
- privilege-escalation
- execution
- stealth
- cve.2021-1675
- cve.2021-34527
- detection.emerging-threats
references:
- https://web.archive.org/web/20210629055600/https://github.com/hhlxf/PrintNightmare/
- https://github.com/ly4k/SpoolFool
where:
  channel|contains: sysmon
  eventId: 7
  image|endswith: \spoolsv.exe
  imageLoaded|contains_any:
  - \Windows\System32\spool\drivers\x64\3\
  - \Windows\System32\spool\drivers\x64\4\
  imageLoaded|endswith: .dll
sigma:
  id: 02fb90de-c321-4e63-a6b9-25f4b03dfd14
  status: test
  author: FPT.EagleEye, Thomas Patzke (improvements)
