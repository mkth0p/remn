id: sigma-4e64668a-4da1-49f5-a8df-9e2d5b866718
title: Possible CVE-2021-1675 Print Spooler Exploitation
description: Detects events of driver load errors in print service logs that could be a sign of successful exploitation attempts
  of print spooler vulnerability CVE-2021-1675
severity: high
source: events
attack:
- T1569
tags:
- sigma
- printservice-admin
- execution
- cve.2021-1675
- detection.emerging-threats
references:
- https://web.archive.org/web/20210629055600/https://github.com/hhlxf/PrintNightmare/
- https://web.archive.org/web/20210701042336/https://github.com/afwu/PrintNightmare
- https://twitter.com/fuzzyf10w/status/1410202370835898371
where:
  channel|contains: printservice/admin
  any_of:
  - eventId: 808
    data.ErrorCode|in:
    - '0x45A'
    - '0x7e'
  - raw|contains_any:
    - The print spooler failed to load a plug-in module
    - MyExploit.dll
    - evil.dll
    - \addCube.dll
    - \rev.dll
    - \rev2.dll
    - \main64.dll
    - \mimilib.dll
    - \mimispool.dll
  not:
    raw|contains_any:
    - ' registration timed out'
