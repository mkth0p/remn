id: sigma-de96b824-02b0-4241-9356-7e9b47f04bac
title: Potential CVE-2023-23397 Exploitation Attempt - SMB
description: Detects (failed) outbound connection attempts to internet facing SMB servers. This could be a sign of potential
  exploitation attempts of CVE-2023-23397.
severity: medium
source: events
tags:
- sigma
- smbclient-connectivity
- exfiltration
- cve.2023-23397
- detection.emerging-threats
references:
- https://www.microsoft.com/en-us/security/blog/2023/03/24/guidance-for-investigating-attacks-using-cve-2023-23397/
- https://github.com/nasbench/Misc-Research/blob/fc46f6da34ff7e0076da28fd3e66d6e1100f1c2f/ETW/Microsoft-Windows-SMBClient.md
where:
  channel|contains: smbclient/connectivity
  eventId|in:
  - 30803
  - 30804
  - 30806
  not:
    any_of:
    - data.ServerAddress|startswith: '10.'
    - data.ServerAddress|startswith: '127.'
    - data.ServerAddress|startswith: 169.254.
    - data.ServerAddress|re: ^172\.(?:16|17|18|19|2[0-9]|30|31)(?:\.[0-9]{1,3}){2}$
    - data.ServerAddress|startswith: 192.168.
    - data.ServerAddress|in:
      - 0000:0000:0000:0000:0000:0000:0000:0001
      - 0:0:0:0:0:0:0:1
      - ::1
    - data.ServerAddress|re: '^fe[89ab][0-9a-f]:'
    - data.ServerAddress|re: '^f[cd][0-9a-f][0-9a-f]:'
    - ipAddress|startswith:
      - '10.'
      - '127.'
      - 169.254.
      - '172.'
      - 192.168.
      - ::1
      - 'fe80::'
      - 'fc00::'
    - ipAddress|re:
      - '00000000000000000000000000000001'
      - FE80000000000000
      - FC00000000000000
      - 0200....C0A8
      - 0200....AC
      - 0200....0A
      - 0200....7F
      - 0200....A9FE
    - data.ServerAddress|re:
      - '00000000000000000000000000000001'
      - FE80000000000000
      - FC00000000000000
      - 0200....C0A8
      - 0200....AC
      - 0200....0A
      - 0200....7F
      - 0200....A9FE
    - data.RemoteAddress|re:
      - '00000000000000000000000000000001'
      - FE80000000000000
      - FC00000000000000
      - 0200....C0A8
      - 0200....AC
      - 0200....0A
      - 0200....7F
      - 0200....A9FE
