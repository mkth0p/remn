id: sigma-1a433e1d-03d2-47a6-8063-ece992cf4e73
title: DarkGate - Autoit3.EXE File Creation By Uncommon Process
description: Detects the usage of curl.exe, KeyScramblerLogon, or other non-standard/suspicious processes used to create Autoit3.exe.
  This activity has been associated with DarkGate malware, which uses Autoit3.exe to execute shellcode that performs process
  injection and connects to the DarkGate command-and-control server. Curl, KeyScramblerLogon, and these other processes consitute
  non-standard and suspicious ways to retrieve the Autoit3 executable.
severity: medium
source: events
attack:
- T1105
- T1059
tags:
- sigma
- file_event
- command-and-control
- execution
- detection.emerging-threats
references:
- https://github.security.telekom.com/2023/08/darkgate-loader.html
- https://www.kroll.com/en/insights/publications/cyber/microsoft-teams-used-as-initial-access-for-darkgate-malware
- https://github.com/pr0xylife/DarkGate/tree/main
where:
  channel|contains: sysmon
  eventId: 11
  image|endswith:
  - \Autoit3.exe
  - \curl.exe
  - \ExtExport.exe
  - \KeyScramblerLogon.exe
  - \wmprph.exe
  targetFilename|endswith: \Autoit3.exe
