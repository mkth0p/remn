id: sigma-05164d17-8e11-4d7d-973e-9e4962436b87
title: ScreenConnect - SlashAndGrab Exploitation Indicators
description: Detects indicators of exploitation by threat actors during exploitation of the "SlashAndGrab" vulnerability related
  to ScreenConnect as reported Team Huntress
severity: high
source: events
tags:
- sigma
- file_event
- detection.emerging-threats
- stealth
references:
- https://www.huntress.com/blog/slashandgrab-screen-connect-post-exploitation-in-the-wild-cve-2024-1709-cve-2024-1708
where:
  channel|contains: sysmon
  eventId: 11
  any_of:
  - targetFilename|contains_all:
    - C:\Windows\Temp\ScreenConnect\
    - \LB3.exe
  - targetFilename|contains_any:
    - C:\mpyutd.msi
    - C:\perflogs\RunSchedulerTaskOnce.ps1
    - C:\ProgramData\1.msi
    - C:\ProgramData\Microsoft\Windows\Start Menu\Programs\Startup\mpyutd.msi
    - C:\ProgramData\update.dat
    - C:\Users\oldadmin\Documents\MilsoftConnect\Files\ta.exe
    - C:\Windows\Help\Help\SentinelAgentCore.dll
    - C:\Windows\Help\Help\SentinelUI.exe
    - C:\Windows\spsrv.exe
    - C:\Windows\Temp\svchost.exe
