id: sigma-cd6386fa-bb9a-4b67-b006-786b6ab5d2ba
title: Axios NPM Compromise File Creation Indicators - Windows
description: Detects file creation events linked to the Axios NPM supply chain compromise. Axios is a popular JavaScript HTTP
  client. On March 30, 2026, malicious versions (1.14.1, 0.30.4) were published to npm, injecting a dependency (plain-crypto-js@4.2.1)
  that executed a postinstall script as a cross-platform RAT dropper. The dropper contacted a C2 server, delivered platform-specific
  payloads, deleted itself, and replaced package.json to evade detection. The attack used cscript.exe (VBScript), curl.exe
  (C2), and PowerShell masquerading as Windows Terminal.
severity: high
source: events
attack:
- T1195.002
tags:
- sigma
- file_event
