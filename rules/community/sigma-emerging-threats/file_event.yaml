id: sigma-20228d05-dd68-435d-8b4e-e7e64938880c
title: Potential Kapeka Decrypted Backdoor Indicator
description: Detects the presence of a file that is decrypted backdoor binary dropped by the Kapeka Dropper, which disguises
  itself as a hidden file under a folder named "Microsoft" within "CSIDL_COMMON_APPDATA" or "CSIDL_LOCAL_APPDATA", depending
  on the process privileges. The file, typically 5-6 characters long with a random combination of consonants and vowels followed
  by a ".wll" extension to pose as a legitimate file to evade detection.
severity: high
source: events
tags:
- sigma
- file_event
- detection.emerging-threats
- stealth
references:
- https://labs.withsecure.com/publications/kapeka
- https://app.any.run/tasks/1efb3ed4-cc0f-4690-a0ed-24516809bc72/
where:
  channel|contains: sysmon
  eventId: 11
  any_of:
  - targetFilename|contains_any:
    - :\ProgramData\
    - \AppData\Local\
    targetFilename|re: \\[a-zA-Z]{5,6}\.wll
  - targetFilename|endswith:
    - \win32log.exe
    - \crdss.exe
