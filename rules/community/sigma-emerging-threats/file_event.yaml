id: sigma-5a7132c0-86db-4e6b-95c0-f0e9d7f461aa
title: Suspicious Creation of .library-ms File — Potential CVE-2025-24054 Exploit
description: Detects creation of '.library-ms' files, which may indicate exploitation of CVE-2025-24054. This vulnerability
  allows an attacker to trigger an automatic outbound SMB or WebDAV authentication request to a remote server upon archive
  extraction. If the system is unpatched, no user interaction is required beyond extracting a malicious archive—potentially
  exposing the user's NTLMv2-SSP hash to the attacker.
severity: medium
source: events
attack:
- T1187
tags:
- sigma
- file_event
- detection.emerging-threats
- credential-access
- cve.2025-24054
references:
- https://msrc.microsoft.com/update-guide/vulnerability/CVE-2025-24054
- https://research.checkpoint.com/2025/cve-2025-24054-ntlm-exploit-in-the-wild/
where:
  channel|contains: sysmon
  eventId: 11
  targetFilename|endswith: .library-ms
  image|endswith:
  - \7z.exe
  - \winrar.exe
  - \explorer.exe
