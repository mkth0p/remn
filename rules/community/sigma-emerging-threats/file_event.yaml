id: sigma-44d7af7e-88e6-4490-be11-55f7ff4d9fc1
title: CVE-2024-1708 - ScreenConnect Path Traversal Exploitation
description: This detects file modifications to ASPX and ASHX files within the root of the App_Extensions directory, which
  is allowed by a ZipSlip vulnerability in versions prior to 23.9.8. This occurs during exploitation of CVE-2024-1708.
severity: medium
source: events
tags:
- sigma
- file_event
- persistence
- cve.2024-1708
- detection.emerging-threats
references:
- https://www.connectwise.com/company/trust/security-bulletins/connectwise-screenconnect-23.9.8
- https://www.cve.org/CVERecord?id=CVE-2024-1709
- https://www.huntress.com/blog/a-catastrophe-for-control-understanding-the-screenconnect-authentication-bypass
where:
  channel|contains: sysmon
  eventId: 11
  image|endswith: \ScreenConnect.Service.exe
  targetFilename|re:
  - ScreenConnect\\App_Extensions\\.*\.ashx$
  - ScreenConnect\\App_Extensions\\.*\.aspx$
  not:
    targetFilename|re: ScreenConnect\\App_Extensions\\.*\\
