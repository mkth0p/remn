id: sigma-4109cb6a-a4af-438a-9f0c-056abba41c6f
title: ScreenConnect User Database Modification - Security
description: This detects file modifications to the temporary xml user database file indicating local user modification in
  the ScreenConnect server. This will occur during exploitation of the ScreenConnect Authentication Bypass vulnerability (CVE-2024-1709)
  in versions <23.9.8, but may also be observed when making legitimate modifications to local users or permissions. This requires
  an Advanced Auditing policy to log a successful Windows Event ID 4663 events and with a SACL set on the directory.
severity: medium
source: events
tags:
- sigma
- security
- cve.2024-1709
- detection.emerging-threats
- defense-impairment
references:
- https://www.connectwise.com/company/trust/security-bulletins/connectwise-screenconnect-23.9.8
- https://www.cve.org/CVERecord?id=CVE-2024-1709
- https://www.huntress.com/blog/a-catastrophe-for-control-understanding-the-screenconnect-authentication-bypass
where:
  channel: Security
  eventId: 4663
  objectType: File
  accessMask: '0x6'
  objectName|endswith: .xml
  objectName|contains_all:
  - Temp
  - ScreenConnect
  processName|contains: ScreenConnect.Service.exe
sigma:
  id: 4109cb6a-a4af-438a-9f0c-056abba41c6f
  status: test
  author: Matt Anderson, Kris Luzadre, Andrew Schwartz, Huntress
  date: '2024-02-20'
  level: medium
  logsource:
    product: windows
    service: security
    definition: 'Requirements: SACLs must be enabled for the ScreenConnect directory'
  falsepositives:
  - This will occur legitimately as well and will result in some benign activity.
