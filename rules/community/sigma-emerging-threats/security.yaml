id: sigma-fa0bac5f-d170-4a91-9780-1ad71dc1f49e
title: ADCS - Certighost Ghost Machine Account Creation
description: Detects the creation of a machine account whose name starts with 'GHOST', which is the naming convention used
  by the CVE-2026-54121 (Certighost) exploit tooling. The public proof-of-concept for Certighost creates a temporary machine
  account with a name of the form GHOST<random>$ before enrolling for a DC certificate via the cdc chase path. The attacker-controlled
  machine account is used as the requester identity in the certificate request; the cdc attribute then redirects the CA to
  a rogue host that returns a forged Domain Controller identity. The resulting certificate carries the DC's SID and DNS name,
  enabling full PKINIT authentication as the targeted DC followed by DCSync. A machine account creation event (4741) where
  TargetUserName starts with 'GHOST' and ends with '$' is a high-fidelity indicator of this attack tool's execution. Legitimate
  environments very rarely provision machine accounts with this prefix.
severity: high
source: events
attack:
- T1136.002
- T1649
tags:
- sigma
- security
- privilege-escalation
- credential-access
- persistence
- cve.2026-54121
- detection.emerging-threats
references:
- https://github.com/aniqfakhrul/CVE-2026-54121
- https://gist.github.com/H0j3n/a5ef2609b5f2944ac2390a191a534c26
where:
  channel: Security
  eventId: 4741
  targetUser|startswith: GHOST
  targetUser|endswith: $
