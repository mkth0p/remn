id: sublime-7e223bac-b437-57e5-be99-f82b23c4ca61
title: 'Service abuse: Linode Objects HTML file hosting'
description: Detects inbound messages containing links to HTML files hosted on Linode's object storage service (linodeobjects.com).
  This pattern is commonly used to host malicious content or bypass security controls by leveraging legitimate cloud storage
  infrastructure.
severity: medium
source: mails
tags:
- sublime
- credential-phishing
- malware-ransomware
- free-file-host
- evasion
where:
  urls.domain: linodeobjects.com
  urls.url|endswith: .html
sublime:
  id: 7e223bac-b437-57e5-be99-f82b23c4ca61
  attack_types:
  - Credential Phishing
  - Malware/Ransomware
  tactics_and_techniques:
  - Free file host
  - Evasion
  detection_methods:
  - URL analysis
  - Content analysis
  source: "type.inbound\nand any(body.current_thread.links,\n        .href_url.domain.root_domain == \"linodeobjects.com\"\n
    \       and strings.iends_with(.href_url.path, \".html\")\n)"
---
id: sublime-c4a6c6bf-2d07-550e-8d67-8d8c6658b1a1
title: 'Service abuse: Outlook Groups with Google Sites link and evasion tag'
description: Detects inbound messages sent via Outlook Groups (groups.outlook.com) that contain links to Google Sites, combined
  with a suspicious short alphanumeric tag appended to either the message body or subject line. This pattern is commonly used
  to evade detection while redirecting recipients to credential harvesting pages hosted on Google Sites.
severity: medium
source: mails
tags:
- sublime
- credential-phishing
- evasion
- free-subdomain-host
- social-engineering
where:
  returnPath|re: (^|@|\.)groups\.outlook\.com$
  urls.host: sites.google.com
  any_of:
  - bodyText|re: \n[a-z0-9]{3}\s*$
  - subject|re: \s{2,}[a-z0-9]{3}\s*$
sublime:
  id: c4a6c6bf-2d07-550e-8d67-8d8c6658b1a1
  attack_types:
  - Credential Phishing
  tactics_and_techniques:
  - Evasion
  - Free subdomain host
  - Social engineering
  detection_methods:
  - Content analysis
  - Header analysis
  - URL analysis
  - Sender analysis
  source: "type.inbound\nand headers.return_path.domain.domain == \"groups.outlook.com\"\nand any(body.current_thread.links,\n
    \       .href_url.domain.domain == \"sites.google.com\"\n)\nand (\n  regex.icontains(body.current_thread.text, '\\n[a-z0-9]{3}\\s*$')\n
    \ or regex.icontains(subject.base, '\\s{2,}[a-z0-9]{3}\\s*$')\n)"
