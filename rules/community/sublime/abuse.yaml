id: sublime-09ff8a73-c36e-5c2a-822e-3c039ed818f8
title: Google services using g.co shortlinks
description: Identifies messages from authenticated Google domains containing g.co shortened URLs with a subdomain in either
  the message body links or thread text.
severity: medium
source: mails
tags:
- sublime
- credential-phishing
- evasion
- free-email-provider
references:
- https://gist.github.com/zachlatta/f86317493654b550c689dc6509973aa4
where:
  fromRegistrable|re: ^google\.
  auth.spf: pass
  any_of:
  - urls.domain: g.co
    urls.subdomain|exists: true
  - bodyText|contains: .g.co
    bodyText|re: '[^\s]+\.g\.co\b'
sublime:
  id: 09ff8a73-c36e-5c2a-822e-3c039ed818f8
  attack_types:
  - Credential Phishing
  tactics_and_techniques:
  - Evasion
  - Free email provider
  detection_methods:
  - Content analysis
  - Header analysis
  - Sender analysis
  - URL analysis
  source: "type.inbound\n// allow for multiple google TLDs\nand sender.email.domain.sld == \"google\"\nand headers.auth_summary.spf.pass\n//
    g.co url shortner in links or the current thread to identify the workspace name\nand (\n  any(body.links,\n      .href_url.domain.root_domain
    == 'g.co'\n      and .href_url.domain.subdomain is not null\n  )\n  or (\n    strings.icontains(body.current_thread.text,
    '.g.co')\n    and regex.icontains(body.current_thread.text, '[^\\s]+\\.g\\.co\\b')\n  )\n)"
---
id: sublime-42058fc4-d700-5bc3-9ee9-91641d9343c2
title: 'Brand impersonation: QuickBooks notification from Intuit themed company name'
description: This detection rule matches on QuickBooks notifications that feature company names impersonating Intuit and QuickBooks.
severity: medium
source: mails
tags:
- sublime
- callback-phishing
- credential-phishing
- bec-fraud
- evasion
- social-engineering
where:
  fromAddr: quickbooks@notification.intuit.com
  auth.spf: pass
  auth.dmarc: pass
  auth.spfDomain|endswith_cs: .intuit.com
  any_of:
  - any_of:
    - replyTo.addr|contains: intuit
    - replyTo.domain|contains: quickbooks
    not:
      replyTo.domain|re:
      - (^|@|\.)intuit\.com$
      - (^|@|\.)quickbooks\.com$
  - bodyHtml|re: <(?:div|p) class="company(?:Name|Details)[^\"]*\"[^\>]*\>[^\<]*(?:Intuit|Quickbooks).*</(?:p|div)>
sublime:
  id: 42058fc4-d700-5bc3-9ee9-91641d9343c2
  attack_types:
  - Callback Phishing
  - Credential Phishing
  - BEC/Fraud
  tactics_and_techniques:
  - Evasion
  - Social engineering
  detection_methods:
  - Content analysis
  - Sender analysis
  - Header analysis
  source: "type.inbound\n\n// Legitimate Intuit sending infratructure\nand sender.email.email == \"quickbooks@notification.intuit.com\"\nand
    headers.auth_summary.spf.pass\nand headers.auth_summary.dmarc.pass\nand strings.ends_with(headers.auth_summary.spf.details.designator,\n
    \                     '.intuit.com'\n)\nand (\n  // the reply-to contains Inuit Themes\n  any(headers.reply_to,\n      (\n
    \       strings.icontains(.email.email, 'intuit')\n        or strings.icontains(.email.domain.domain, 'quickbooks')\n
    \     )\n      and not (.email.domain.root_domain in ('intuit.com', 'quickbooks.com'))\n  )\n  // the \"company\" part
    of the message\n  or regex.icontains(body.html.raw,\n                     '<(?:div|p) class=\"company(?:Name|Details)[^\\\"]*\\\"[^\\>]*\\>[^\\<]*(?:Intuit|Quickbooks).*</(?:p|div)>'\n
    \ )\n)"
---
id: sublime-59786115-b28c-599b-97fe-0831643c2a34
