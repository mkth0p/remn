id: sublime-6154f197-9543-50d8-af3d-f8a7e1d79cf8
title: 'Service Abuse: ExactTarget with suspicious sender indicators'
description: Message originates from ExactTarget infrastructure but uses a suspicious sender domain, including overly long
  salesforce.com domains, awsapps.com domains, domains containing UTF-8 encoding characters, or a suspicious sender display
  name.
severity: high
source: mails
tags:
- sublime
- credential-phishing
- bec-fraud
- evasion
- social-engineering
where:
  headersText|contains: exacttarget.com
  any_of:
  - fromAddr|length: '>= 50'
    fromRegistrable: salesforce.com
  - fromRegistrable: awsapps.com
  - fromDomain|contains: ?utf-8
  - fromName|re: .*\|.*(Manager|Careers|Recruitment|Specialist|Global)
sublime:
  id: 6154f197-9543-50d8-af3d-f8a7e1d79cf8
  attack_types:
  - Credential Phishing
  - BEC/Fraud
  tactics_and_techniques:
  - Evasion
  - Social engineering
  detection_methods:
  - Header analysis
  - Sender analysis
  source: "type.inbound\nand any(headers.domains, .root_domain == 'exacttarget.com')\nand (\n  (\n    length(sender.email.email)
    >= 50\n    and sender.email.domain.root_domain == \"salesforce.com\"\n  )\n  or sender.email.domain.root_domain == \"awsapps.com\"\n
    \ or strings.icontains(sender.email.domain.domain, '?utf-8')\n  or regex.icontains(sender.display_name,\n                     '.*\\|.*(Manager|Careers|Recruitment|Specialist|Global)'\n
    \ )\n)"
---
