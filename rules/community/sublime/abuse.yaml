id: sublime-d069b183-18f4-5a49-8205-ff2f1f62a130
title: 'Service abuse: Domains By Proxy sender'
description: Message originates from a sender using Domains By Proxy's domain privacy service, commonly used to hide domain
  ownership information.
severity: medium
source: mails
tags:
- sublime
- spam
- credential-phishing
- bec-fraud
- evasion
- social-engineering
where:
  fromRegistrable: domainsbyproxy.com
sublime:
  id: d069b183-18f4-5a49-8205-ff2f1f62a130
  attack_types:
  - Spam
  - Credential Phishing
  - BEC/Fraud
  tactics_and_techniques:
