  - cloudflare-ipfs.com
  - discord.com
  - docs.google.com
  - drive.google.com
  - dropbox.com
  - dweb.link
  - file.io
  - firebasestorage.googleapis.com
  - github.com
  - gofile.io
  - ipfs.io
  - mediafire.com
  - mega.nz
  - onedrive.live.com
  - pastebin.com
  - pcloud.link
  - raw.githubusercontent.com
  - s3.amazonaws.com
  - sendspace.com
  - sharepoint.com
  - storage.googleapis.com
  - transfer.sh
  - we.tl
  - web.core.windows.net
  - wetransfer.com
sublime:
  id: 59786115-b28c-599b-97fe-0831643c2a34
  attack_types:
  - Credential Phishing
  tactics_and_techniques:
  - 'Impersonation: Brand'
  - Social engineering
  - Free file host
  detection_methods:
  - Header analysis
  - URL analysis
  - Sender analysis
  source: 'type.inbound

    and sender.email.email == "no-reply@accounts.google.com"

    and any(body.links, .href_url.domain.domain in $free_file_hosts)'
