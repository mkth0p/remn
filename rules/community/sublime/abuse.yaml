# Sublime Security - detection rules - generated by tools/import_community_rules.py from sublime-security/sublime-rules@b4fe36890fd9 (2026-09-05). Upstream licence: MIT License (see LICENSE). Do not edit by hand: re-run the import.
id: sublime-59786115-b28c-599b-97fe-0831643c2a34
title: 'Service abuse: Google account notification with links to free file host'
description: Detects messages impersonating Google Accounts that contain links redirecting to known file hosting services
severity: high
source: mails
tags:
- sublime
- credential-phishing
- impersonation-brand
- social-engineering
- free-file-host
references:
- https://x.com/nicksdjohnson/status/1912439023982834120
- https://easydmarc.com/blog/google-spoofed-via-dkim-replay-attack-a-technical-breakdown/
where:
  fromAddr: no-reply@accounts.google.com
  urls.host|in:
  - 1drv.ms
  - anonfiles.com
  - blob.core.windows.net
  - box.com
  - cdn.discordapp.com
  - cloudflare-ipfs.com
  - discord.com
  - docs.google.com
  - drive.google.com
  - dropbox.com
  - dweb.link
  - file.io
  - firebasestorage.googleapis.com
  - github.com
  - gofile.io
  - ipfs.io
  - mediafire.com
  - mega.nz
  - onedrive.live.com
  - pastebin.com
  - pcloud.link
  - raw.githubusercontent.com
  - s3.amazonaws.com
  - sendspace.com
  - sharepoint.com
  - storage.googleapis.com
  - transfer.sh
  - we.tl
  - web.core.windows.net
  - wetransfer.com
sublime:
  id: 59786115-b28c-599b-97fe-0831643c2a34
  attack_types:
  - Credential Phishing
  tactics_and_techniques:
  - 'Impersonation: Brand'
  - Social engineering
  - Free file host
  detection_methods:
  - Header analysis
  - URL analysis
  - Sender analysis
  source: 'type.inbound

    and sender.email.email == "no-reply@accounts.google.com"

    and any(body.links, .href_url.domain.domain in $free_file_hosts)'
