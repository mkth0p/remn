id: sublime-1005e483-9e29-5a6b-b360-49b35d87054b
title: 'Link: Google Cloud Storage with suspicious URL pattern'
description: Detects inbound messages containing links to Google Cloud Storage (storage.googleapis.com) with suspicious URL
  path patterns that follow a specific actor-controlled structure commonly used for hosting malicious content.
severity: high
source: mails
tags:
- sublime
- credential-phishing
- free-file-host
- evasion
where:
  urls.host: storage.googleapis.com
  urls.url|re: ^\/[a-z0-9]+-[a-z0-9]+-\d{8}\-[0-9a-f]+\/[^\.]+\.html
sublime:
  id: 1005e483-9e29-5a6b-b360-49b35d87054b
  attack_types:
  - Credential Phishing
  tactics_and_techniques:
  - Free file host
  - Evasion
  detection_methods:
  - URL analysis
  source: "type.inbound\nand any(body.links,\n        // storage.googleapis.com\n        .href_url.domain.domain == \"storage.googleapis.com\"\n
    \       // observed pattern in actor controlled url path\n        and regex.contains(.href_url.path,\n                           '^\\/[a-z0-9]+-[a-z0-9]+-\\d{8}\\-[0-9a-f]+\\/[^\\.]+\\.html'\n
    \       )\n)"
---
id: sublime-1ffcfc52-a023-585f-8f9f-d1cf16bdaed3
title: 'Link: RFI document reference pattern in display text'
description: Detects links with display text containing RFI (Request for Information) document reference patterns using format
  RFI-###-###-###, commonly used in construction and procurement fraud schemes.
severity: medium
source: mails
tags:
- sublime
- bec-fraud
- social-engineering
where:
  urls.text|re: \bRFI-\d{1,5}-\d{1,5}-\d{1,5}\b
  not:
    urls.text|re:
    - \bRFI-\d{2}-\d{2}-\d{4}\b
    - \bRFI-\d{4}-\d{2}-\d{2}\b
  urlCount|lt: 11
sublime:
  id: 1ffcfc52-a023-585f-8f9f-d1cf16bdaed3
  attack_types:
  - BEC/Fraud
  tactics_and_techniques:
  - Social engineering
  detection_methods:
  - Content analysis
  - URL analysis
  source: "type.inbound\nand any(body.current_thread.links,\n        regex.icontains(.display_text, '\\bRFI-\\d{1,5}-\\d{1,5}-\\d{1,5}\\b')\n
    \       and not regex.icontains(.display_text,\n                                '\\bRFI-\\d{2}-\\d{2}-\\d{4}\\b',\n                                '\\bRFI-\\d{4}-\\d{2}-\\d{2}\\b'\n
    \       )\n)\nand length(body.links) < 11"
---
id: sublime-2820ff89-7ae4-5fef-beac-86dc349ac0d8
title: 'Link: Google Cloud Storage link with redirect.html in URL'
description: Detects inbound messages containing links that route through a redirect.html page hosted on Google Cloud Storage
  (storage.googleapis.com). Attackers abuse legitimate cloud storage infrastructure to host redirect pages that forward victims
  to malicious destinations, evading URL reputation checks.
severity: high
source: mails
tags:
- sublime
- credential-phishing
- evasion
- free-file-host
- open-redirect
where:
  any_of:
  - urls.url|endswith: redirect.html
  - urls.fragment|startswith:
    - /redirect.html
    - redirect.html?
  urls.host: storage.googleapis.com
sublime:
  id: 2820ff89-7ae4-5fef-beac-86dc349ac0d8
  attack_types:
  - Credential Phishing
  tactics_and_techniques:
  - Evasion
  - Free file host
  - Open redirect
  detection_methods:
  - URL analysis
  source: "type.inbound\nand any(body.links,\n        (\n          strings.iends_with(.href_url.path, 'redirect.html')\n          or
    strings.istarts_with(.href_url.fragment,\n                                  '/redirect.html',\n                                  'redirect.html?'\n
    \         )\n        )\n        and .href_url.domain.domain == \"storage.googleapis.com\"\n)"
---
id: sublime-28db8459-dbc5-52c1-8863-4ede01cf104a
title: 'Credential Phishing: W-2 lure with inline SVG Windows logo'
description: Detects inbound messages containing a link with W-2 display text and an inline SVG constructed from four colored
  rectangles approximating the Microsoft Windows logo. Threat actors use hand-crafted SVG elements rather than image attachments
  to bypass image-based detection and render a convincing Windows or Microsoft brand impersonation directly in the email body.
  The color matching uses fuzzy hex ranges to account for minor variations across campaigns.
severity: high
source: mails
tags:
- sublime
- credential-phishing
- evasion
- html-smuggling
- social-engineering
where:
  urls.text|re: (?:W|VV)\s*-?\s*2
  bodyHtml|re: <rect x="\d+" y="\d+" width="\d+" height="\d+" fill="#[c-f][0-9a-f][0-3][0-9a-f][0-3][0-9a-f]">\s*<\/rect>\s*<rect
    x="\d+" y="\d+" width="\d+" height="\d+" fill="#[0-3][0-9a-f][8-f][0-9a-f][2-6][0-9a-f]">\s*<\/rect>\s*<rect x="\d+" y="\d+"
    width="\d+" height="\d+" fill="#[0-3][0-9a-f][5-9][0-9a-f][a-f][0-9a-f]">\s*<\/rect>\s*<rect x="\d+" y="\d+" width="\d+"
    height="\d+" fill="#[c-f][0-9a-f][a-f][0-9a-f][0-3][0-9a-f]">\s*<\/rect>\s*<\/svg>\s*<\/td>
sublime:
  id: 28db8459-dbc5-52c1-8863-4ede01cf104a
  attack_types:
  - Credential Phishing
  tactics_and_techniques:
  - Evasion
  - HTML smuggling
  - Social engineering
  detection_methods:
  - Content analysis
  - HTML analysis
  source: "type.inbound\n// display text contains a reference to W2\nand any(body.current_thread.links,\n        regex.icontains(strings.replace_confusables(.display_text),\n
    \                       '(?:W|VV)\\s*-?\\s*2'\n        )\n)\n// inline SVG that mimics the Windows logo\nand regex.icontains(body.html.raw,\n
    \                   '<rect x=\"\\d+\" y=\"\\d+\" width=\"\\d+\" height=\"\\d+\" fill=\"#[c-f][0-9a-f][0-3][0-9a-f][0-3][0-9a-f]\">\\s*<\\/rect>\\s*<rect
    x=\"\\d+\" y=\"\\d+\" width=\"\\d+\" height=\"\\d+\" fill=\"#[0-3][0-9a-f][8-f][0-9a-f][2-6][0-9a-f]\">\\s*<\\/rect>\\s*<rect
    x=\"\\d+\" y=\"\\d+\" width=\"\\d+\" height=\"\\d+\" fill=\"#[0-3][0-9a-f][5-9][0-9a-f][a-f][0-9a-f]\">\\s*<\\/rect>\\s*<rect
    x=\"\\d+\" y=\"\\d+\" width=\"\\d+\" height=\"\\d+\" fill=\"#[c-f][0-9a-f][a-f][0-9a-f][0-3][0-9a-f]\">\\s*<\\/rect>\\s*<\\/svg>\\s*<\\/td>'\n)"
---
id: sublime-41148d75-676a-5ce6-aeb3-91cf943c3efd
title: 'Link: Fake secure message notification template'
description: Detects inbound messages containing links that match a specific HTML styling fingerprint characterized by a distinctive
  blue color scheme (rgb(41, 88, 140)), a bottom border of 10px solid with the same blue, and a padding of 1.6em. This combination
  of CSS properties is associated with malicious messages designed to lure recipients into clicking embedded links.
severity: medium
source: mails
tags:
- sublime
- credential-phishing
- evasion
- social-engineering
where:
  all_of:
  - urlCount|gt: 0
  - bodyHtml|re: background-color\s*:\s*rgb\(41,\s*88,\s*140\)
  - bodyHtml|re: border-bottom\s*:\s*10px\s+solid\s+rgb\(41,\s*88,\s*140\)
  - bodyHtml|re: padding\s*:\s*1\.6em
sublime:
  id: 41148d75-676a-5ce6-aeb3-91cf943c3efd
  attack_types:
  - Credential Phishing
  tactics_and_techniques:
  - Evasion
  - Social engineering
  detection_methods:
  - HTML analysis
  - Content analysis
  - URL analysis
  source: "type.inbound\nand length(body.links) > 0\nand regex.icontains(body.html.raw,\n                    'background-color\\s*:\\s*rgb\\(41,\\s*88,\\s*140\\)'\n)\nand
    regex.icontains(body.html.raw,\n                    'border-bottom\\s*:\\s*10px\\s+solid\\s+rgb\\(41,\\s*88,\\s*140\\)'\n)\nand
    regex.icontains(body.html.raw, 'padding\\s*:\\s*1\\.6em')"
---
