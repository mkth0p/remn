  source: "type.inbound\nand 0 < length(body.links) <= 10\nand any(body.links,\n        (\n          strings.icontains(.href_url.path,
    \"/.well-known/\")\n          and (\n            // well-known with a directory behind it\n            (\n              regex.icontains(.href_url.path,
