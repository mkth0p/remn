id: sublime-88a473bb-b8a1-59b7-ac54-24ec84424ac2
title: 'Link: Google Cloud Storage with short-path link delivery'
description: Detects inbound messages containing links to Google Cloud Storage (storage.googleapis.com) where the URL path
  ends in 'ls' or 'lis', matching a pattern used to host redirector or landing pages. Observed across multilingual spam and
  unsolicited promotional messages — including fake parcel delivery notifications impersonating FedEx and T&T, as well as
  product advertisement lures — sent from a variety of compromised or unrelated sender domains. The consistent use of this
  specific GCS path pattern suggests a shared delivery infrastructure across multiple senders.
severity: medium
source: mails
tags:
- sublime
- spam
- credential-phishing
- free-file-host
- evasion
- social-engineering
- impersonation-brand
where:
  urls.host: storage.googleapis.com
  urls.url|re: ^/[^\/]+/li?s$
sublime:
  id: 88a473bb-b8a1-59b7-ac54-24ec84424ac2
  attack_types:
  - Spam
  - Credential Phishing
  tactics_and_techniques:
  - Free file host
  - Evasion
  - Social engineering
  - 'Impersonation: Brand'
  detection_methods:
  - URL analysis
  - Content analysis
  source: "type.inbound\nand any(body.links,\n        .href_url.domain.domain == \"storage.googleapis.com\"\n        // path
    ends with lis or ls\n        and regex.icontains(.href_url.path, '^/[^\\/]+/li?s$')\n)"
---
