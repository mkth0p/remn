id: sublime-aa1a842d-ddd9-5e0e-8f17-bbcab4818195
title: 'Link: PDF file disguised as HTML page'
description: Detects inbound messages containing links that appear to reference PDF files but are actually HTML pages, indicated
  by URLs ending with '.pdf' followed by additional characters and '.html'. This technique is commonly used to bypass security
  filters and deceive recipients into believing they are accessing a legitimate PDF document.
severity: medium
source: mails
tags:
- sublime
- credential-phishing
- malware-ransomware
- evasion
- pdf
where:
  urls.url|re: \.pdf[^/]*\.html$
sublime:
  id: aa1a842d-ddd9-5e0e-8f17-bbcab4818195
  attack_types:
  - Credential Phishing
  - Malware/Ransomware
  tactics_and_techniques:
  - Evasion
  - PDF
  detection_methods:
  - URL analysis
  - Content analysis
  source: "type.inbound\nand any(body.current_thread.links,\n        regex.icontains(.href_url.path, '\\.pdf[^/]*\\.html$')\n)"
