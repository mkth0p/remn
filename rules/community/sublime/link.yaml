id: sublime-9c7f6db1-2e4e-50db-ab74-eaa29822189e
title: 'Link: URL fragmented by hidden spans'
description: Detects messages containing HTML links that are broken up with inline <span> elements styled with display:none,
  injecting random alphanumeric strings inside the URL to defeat text-based scanning while rendering strings that looks like
  a link to the recipient. Observed lures impersonate HR or payroll communications, such as fake 401K enrollment notices and
  PTO balance alerts, sent from unrelated or spoofed domains to drive clicks on the obfuscated link.
severity: high
source: mails
tags:
- sublime
- credential-phishing
- evasion
- social-engineering
where:
  bodyHtml|contains: https:/<span
  bodyHtml|re: https:/<span[^>]{0,300}display:\s*none[^>]{0,300}>[A-Z0-9]{6,}\s*</span>/
sublime:
  id: 9c7f6db1-2e4e-50db-ab74-eaa29822189e
  attack_types:
  - Credential Phishing
  tactics_and_techniques:
  - Evasion
  - Social engineering
  detection_methods:
  - HTML analysis
  - Content analysis
  - URL analysis
  source: "type.inbound\nand strings.icontains(body.html.raw, 'https:/<span')\nand regex.icontains(body.html.raw,\n                    'https:/<span[^>]{0,300}display:\\s*none[^>]{0,300}>[A-Z0-9]{6,}\\s*</span>/'\n)"
