id: sublime-e8151426-6893-598b-a42c-6ab8c0d0621d
title: 'Link: CVE-2024-21413 Microsoft Outlook Remote Code Execution Vulnerability'
description: This rule detects messages containing links exploiting CVE-2024-21413, which can lead to RCE. Successful exploitation
  can bypass built-in Outlook protections for malicious links embedded in messages by using the file:// protocol and an exclamation
  mark to URLs pointing to attacker-controlled servers."
severity: critical
source: mails
tags:
- sublime
- malware-ransomware
- evasion
- exploit
references:
- https://research.checkpoint.com/2024/the-risks-of-the-monikerlink-bug-in-microsoft-outlook-and-the-big-picture/
- https://www.bleepingcomputer.com/news/security/new-critical-microsoft-outlook-rce-bug-is-trivial-to-exploit/
- https://msrc.microsoft.com/update-guide/en-US/advisory/CVE-2024-21413
where:
  urls.scheme: file
  urls.url|re: \.[a-z]{2,4}(\.[a-z]{2,4})?!
sublime:
  id: e8151426-6893-598b-a42c-6ab8c0d0621d
  attack_types:
  - Malware/Ransomware
  tactics_and_techniques:
  - Evasion
  - Exploit
  detection_methods:
  - URL analysis
  source: "type.inbound\nand any(body.links,\n        .href_url.scheme == \"file\"\n        and regex.icontains(.href_url.url,
    '\\.[a-z]{2,4}(\\.[a-z]{2,4})?!')\n)"
---
id: sublime-fc41a43e-6eb7-5478-a19f-e7d2bac8ed8d
title: 'Link: Google Cloud Storage impersonating with googledrive in URL path'
description: Detects inbound messages containing links to Google Cloud Storage (storage.googleapis.com) with paths ending
  in 'googledrive.html', indicating abuse of Google's cloud storage service to impersonate Google Drive and potentially deliver
  malicious content.
severity: high
source: mails
tags:
- sublime
- credential-phishing
- impersonation-brand
- free-file-host
where:
  urls.host: storage.googleapis.com
  urls.url|endswith: googledrive.html
sublime:
  id: fc41a43e-6eb7-5478-a19f-e7d2bac8ed8d
  attack_types:
  - Credential Phishing
  tactics_and_techniques:
  - 'Impersonation: Brand'
  - Free file host
  detection_methods:
  - URL analysis
  source: "type.inbound\nand any(body.links,\n        // use of storage.googleapis.com\n        .href_url.domain.domain ==
    \"storage.googleapis.com\"\n        // with an actor controlled path that impersonates Google Drive\n        and strings.iends_with(.href_url.path,
    'googledrive.html')\n)"
