id: sublime-a1ccdfa2-4945-545f-a90c-08f9ac1bf458
title: 'Link: Telegraph-hosted content'
description: Inbound messages containing links that point to telegra.ph or graph.org, the free Telegram-run publishing platform,
  which is abused to host redirect pages for spam and low-effort social engineering lures. Observed samples span dating/flirting
  pitches, pharmacy and medication marketing, generic curiosity-bait subject lines, and other unsolicited outreach, with senders
  coming from free webmail providers, questionable domains, or spoofed corporate addresses. The shared trait is use of a legitimate,
  free content-hosting service to mask the true destination and improve deliverability.
severity: medium
source: mails
tags:
- sublime
- spam
- credential-phishing
- social-engineering
- free-file-host
where:
  urls.domain|in:
  - telegra.ph
  - graph.org
sublime:
  id: a1ccdfa2-4945-545f-a90c-08f9ac1bf458
  attack_types:
  - Spam
  - Credential Phishing
  tactics_and_techniques:
  - Social engineering
  - Free file host
  detection_methods:
  - URL analysis
  source: 'type.inbound

    and any(body.links, .href_url.domain.root_domain in ("telegra.ph", "graph.org"))'
