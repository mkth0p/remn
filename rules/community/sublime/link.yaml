id: sublime-5579bb4b-a225-57c1-99e1-65c704bad6ad
title: Sharepoint online with external recipients and external display name
description: An email from Sharepoint Online that was sent to multiple recipients that did not originate from a sender, by
  display name, in your organization.
severity: medium
source: mails
tags:
- sublime
- credential-phishing
- spam
- evasion
where:
  fromAddr: no-reply@sharepointonline.com
  recipientCount|gt: 40
  to.domain|in:
  - aol.com
  - fastmail.com
  - free.fr
  - gmail.com
  - gmx.com
  - gmx.de
  - gmx.fr
  - gmx.net
  - hotmail.com
  - hotmail.fr
  - icloud.com
  - laposte.net
  - live.com
  - live.fr
  - mail.com
  - mail.ru
  - me.com
  - msn.com
  - orange.fr
  - outlook.com
  - outlook.fr
  - proton.me
  - protonmail.com
  - sfr.fr
  - tutanota.com
  - wanadoo.fr
  - web.de
  - yahoo.co.uk
  - yahoo.com
  - yahoo.fr
  - yandex.com
  - yandex.ru
  - zoho.com
  fromNameNorm|nin_setting: org_display_names
sublime:
  id: 5579bb4b-a225-57c1-99e1-65c704bad6ad
  attack_types:
  - Credential Phishing
  - Spam
  tactics_and_techniques:
  - Evasion
  detection_methods:
  - Content analysis
  - Header analysis
  - Sender analysis
  source: 'type.inbound

    and sender.email.email == "no-reply@sharepointonline.com"

    and length(recipients.to) > 40 // You may want to adjust this threshold if 40 is too aggressive

    and any(recipients.to, .email.domain.domain in $free_email_providers)

    and sender.display_name not in $org_display_names'
---
