title: 'Link: Google Cloud Storage link with index.php in URL'
description: Detects inbound messages containing links hosted on storage.googleapis.com that point to an index.php path, either
  in the URL path or fragment. Attackers abuse Google Cloud Storage to host malicious content, leveraging the trusted domain
  to bypass security filters.
severity: high
source: mails
tags:
- sublime
- credential-phishing
- evasion
- free-file-host
- open-redirect
where:
  urls.host: storage.googleapis.com
  any_of:
  - urls.url|endswith: index.php
  - urls.fragment|re: ^\/?index.php
sublime:
  id: d0ecb49a-6251-51b2-850e-b3503dd3d02f
  attack_types:
  - Credential Phishing
  tactics_and_techniques:
  - Evasion
  - Free file host
  - Open redirect
  detection_methods:
  - URL analysis
  source: "type.inbound\nand any(body.links,\n        .href_url.domain.domain == \"storage.googleapis.com\"\n        and (\n
    \         strings.iends_with(.href_url.path, 'index.php')\n          or regex.icontains(.href_url.fragment, '^\\/?index.php')\n
    \       )\n)"
---
