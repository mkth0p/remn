id: sublime-080ab581-e6ab-5c82-927b-e57f3080f27a
title: 'Link: Direct link to gamma.app document with mode parameter'
description: Detects URLs linking to Gamma App presentation or document mode, which has been used to host malicious content
  due to its trusted domain status and presentation capabilities.
severity: medium
source: mails
tags:
- sublime
- credential-phishing
- malware-ransomware
- free-file-host
- evasion
where:
  urlCount|lt: 10
  any_of:
  - urls.domain: gamma.app
  - urls.url|contains: gamma.app
  - urls.url|contains: gamma%2eapp
  - urls.url|contains: gamma%252eapp
  urls.url|re: mode=(present|doc)
sublime:
  id: 080ab581-e6ab-5c82-927b-e57f3080f27a
  attack_types:
  - Credential Phishing
  - Malware/Ransomware
  tactics_and_techniques:
  - Free file host
  - Evasion
  detection_methods:
  - URL analysis
  source: "type.inbound\nand length(body.links) < 10\nand any(body.links,\n        (\n          .href_url.domain.root_domain
    == \"gamma.app\"\n          or strings.icontains(.href_url.query_params, 'gamma.app')\n          or strings.icontains(.href_url.query_params,
    'gamma%2eapp')\n          or strings.icontains(.href_url.query_params, 'gamma%252eapp')\n        )\n        and regex.icontains(.href_url.query_params,
    'mode=(present|doc)')\n)"
---
id: sublime-0d9ea49e-6393-51ee-97e8-e8efb8cebda0
title: 'Link: Job recruitment lure from unsolicited sender with suspicious hosting'
description: Message contains job recruitment language with links to suspicious hosting services including free file hosts,
  subdomain hosts, or URL shorteners from an unsolicited sender.
severity: medium
source: mails
tags:
- sublime
- credential-phishing
- social-engineering
where:
  fromRegistrable|in:
  - hireology.com
  - appsheet.com
  - welcomekit.co
  - xero.com
  - workforce.com
  - eventbrite.com
  - tiscali.it
  - on24event.com
  - talexio.com
  - easy.jobs
  - suitzzedash.com
  - awsapps.com
  - beehiiv.com
  fromName|re: careers|jobs
  any_of:
  - all_of:
    - urls.host|re: (?:ferrari|tesla|vuitton|red[ -]?bull|nike|robert[ -]?half|adidas|coca[ -]?cola|instagram|spotify|reebok|marriott|starbucks|whatsapp|ledger|uber|ikea|canva|bbdo|mango)
      not:
        urls.domain|re: (?:spotify|instagram|ferarri|tesla|nike|adidas|louisvuitton|redbull|roberthalf|coca-cola|reebok|marriott|starbucks|whatsapp|ledger|uber|ikea|canva|bbdo|mango)\.com
    - not:
        urls.text|re: unsubscribe
  - subject|re: (?:ferrari|tesla|vuitton|red.?bull|nike|robert[ _-]?half|adidas|coca[ _-]?cola|instagram|spotify|reebok|marriott|starbucks|whatsapp|ray[
      _-]ban|meta talent|executive talent|talent acquisition|ledger|\buber\b|\bikea\b|canva|bbdo|mango)
  - fromName|re: (?:ferrari|tesla|vuitton|red.?bull|nike|robert[ _-]?half|adidas|coca[ _-]?cola|instagram|spotify|reebok|marriott|starbucks|whatsapp|ray[
      _-]ban|meta talent|executive talent|talent acquisition|ledger|\buber\b|\bikea\b|canva|bbdo|mango)
  - bodyText|re: \b(?:ferrari|tesla|vuitton|red.?bull|nike|robert[ _-]?half|adidas|coca[ _-]?cola|spotify|reebok|marriott|starbucks|whatsapp|ray[
      _-]ban|meta talent|executive talent|talent acquisition|ledger|uber|ikea|canva|bbdo|mango)\b
  - fromName|re: ^[a-z-]+\s*\|\s*(?:Careers|Recruitment|hiring talent|talent connect|talents recruitment$)
  - fromName|re: \bIG\b.*(?:Recruitment|Strategy)
  not:
    bodyText|re: \b(?:facebook|copyright|llp|legal|vip|representative|case details|summit|training|conference|apartments|live\s*stream|masterclass|tickets|b2b
      networking|RSVP|discover more events|Marketing e Eventos|workshop|register here|vip|delivery date)\b
sublime:
  id: 0d9ea49e-6393-51ee-97e8-e8efb8cebda0
  attack_types:
  - Credential Phishing
  tactics_and_techniques:
  - Social engineering
  detection_methods:
  - Content analysis
  - Sender analysis
  - URL analysis
  source: "type.inbound\n// commonly observed abused senders\nand sender.email.domain.root_domain in (\n  'hireology.com',\n
    \ 'appsheet.com',\n  'welcomekit.co',\n  'xero.com',\n  'workforce.com',\n  'eventbrite.com',\n  'tiscali.it',\n  'on24event.com',\n
    \ 'talexio.com',\n  'easy.jobs',\n  'suitzzedash.com',\n  'awsapps.com',\n  'beehiiv.com'\n)\nand regex.icontains(sender.display_name,
    'careers|jobs')\nand (\n  any(body.links,\n      (\n        // domain contains brand, but root domain is not legit brand
    domain\n        regex.icontains(.href_url.domain.domain,\n                        '(?:ferrari|tesla|vuitton|red[ -]?bull|nike|robert[
    -]?half|adidas|coca[ -]?cola|instagram|spotify|reebok|marriott|starbucks|whatsapp|ledger|uber|ikea|canva|bbdo|mango)'\n
    \       )\n        and not regex.icontains(.href_url.domain.root_domain,\n                                '(?:spotify|instagram|ferarri|tesla|nike|adidas|louisvuitton|redbull|roberthalf|coca-cola|reebok|marriott|starbucks|whatsapp|ledger|uber|ikea|canva|bbdo|mango)\\.com'\n
    \       )\n      )\n      and not regex.icontains(.display_text, 'unsubscribe')\n  )\n  or (\n    regex.icontains(subject.base,\n
    \                   '(?:ferrari|tesla|vuitton|red.?bull|nike|robert[ _-]?half|adidas|coca[ _-]?cola|instagram|spotify|reebok|marriott|starbucks|whatsapp|ray[
    _-]ban|meta talent|executive talent|talent acquisition|ledger|\\buber\\b|\\bikea\\b|canva|bbdo|mango)'\n    )\n    or
    regex.icontains(sender.display_name,\n                       '(?:ferrari|tesla|vuitton|red.?bull|nike|robert[ _-]?half|adidas|coca[
    _-]?cola|instagram|spotify|reebok|marriott|starbucks|whatsapp|ray[ _-]ban|meta talent|executive talent|talent acquisition|ledger|\\buber\\b|\\bikea\\b|canva|bbdo|mango)'\n
    \   )\n    or regex.icontains(body.current_thread.text,\n                       '\\b(?:ferrari|tesla|vuitton|red.?bull|nike|robert[
    _-]?half|adidas|coca[ _-]?cola|spotify|reebok|marriott|starbucks|whatsapp|ray[ _-]ban|meta talent|executive talent|talent
    acquisition|ledger|uber|ikea|canva|bbdo|mango)\\b'\n    )\n    or regex.icontains(sender.display_name,\n                       '^[a-z-]+\\s*\\|\\s*(?:Careers|Recruitment|hiring
    talent|talent connect|talents recruitment$)'\n    )\n    or regex.icontains(sender.display_name, '\\bIG\\b.*(?:Recruitment|Strategy)')\n
    \ )\n)\nand not regex.icontains(body.current_thread.text,\n                        '\\b(?:facebook|copyright|llp|legal|vip|representative|case
    details|summit|training|conference|apartments|live\\s*stream|masterclass|tickets|b2b networking|RSVP|discover more events|Marketing
    e Eventos|workshop|register here|vip|delivery date)\\b'\n)"
