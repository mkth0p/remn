id: sublime-dc5e3700-1f29-5fed-8378-38631e0ceea1
title: 'Link: HTML file with suspicious binary fragment ending pattern'
description: Detects links to HTML files containing fragments with a suspicious pattern of alphanumeric characters followed
  by a 5-digit binary sequence, commonly used in malicious URL structures.
severity: high
source: mails
tags:
- sublime
- credential-phishing
- evasion
where:
  urls.url|endswith: .html
  urls.fragment|re: \-[a-z0-9]+[01]{5}$
sublime:
  id: dc5e3700-1f29-5fed-8378-38631e0ceea1
  attack_types:
  - Credential Phishing
  tactics_and_techniques:
  - Evasion
  detection_methods:
  - URL analysis
  source: "type.inbound\nand any(body.links,\n        strings.ends_with(.href_url.path, '.html')\n        and regex.contains(.href_url.fragment,
    '\\-[a-z0-9]+[01]{5}$')\n)"
---
id: sublime-e366f316-6e63-593f-aaeb-330ec90fb845
title: 'Link: Suspicious URL path with binary character sequence'
description: 'Detects inbound messages containing links with URLs that follow a specific suspicious pattern: starting with
  a forward slash, followed by a digit, uppercase letter, alphanumeric characters, a hyphen, more alphanumeric characters,
  and ending with exactly five binary digits (0s and 1s).'
severity: medium
source: mails
tags:
- sublime
- credential-phishing
- evasion
where:
  urls.url|re: ^\/[0-9][A-Z][a-z0-9]+\-[a-z0-9]+[01]{5}$
sublime:
  id: e366f316-6e63-593f-aaeb-330ec90fb845
  attack_types:
  - Credential Phishing
  tactics_and_techniques:
  - Evasion
  detection_methods:
  - URL analysis
  source: "type.inbound\nand any(body.links,\n        regex.contains(.href_url.path,\n                       '^\\/[0-9][A-Z][a-z0-9]+\\-[a-z0-9]+[01]{5}$'\n
    \       )\n)"
