id: sublime-4f3c4901-a4ad-509b-ab83-bf3f118a3940
title: Sender name contains Active Directory distinguished name
description: Sender's display name contains an Active Directory distinguished name or a similar string. This has been observed
  as a malicious indicator in the wild.
severity: medium
source: mails
tags:
- sublime
- credential-phishing
where:
  any_of:
  - fromName|re: \b(EX|LABS|OU|CN|EXCHANGE)(=|/)
  - fromName|contains: /O=EXCHANGELABS
  fromRegistrable|nin_setting: internal_domains
  not:
    fromRegistrable|in:
    - fnfcorp.com
    auth.dmarc: pass
sublime:
  id: 4f3c4901-a4ad-509b-ab83-bf3f118a3940
  attack_types:
  - Credential Phishing
  detection_methods:
  - Sender analysis
  source: "type.inbound\nand (\n  regex.icontains(sender.display_name, '\\b(EX|LABS|OU|CN|EXCHANGE)(=|/)')\n  or strings.icontains(sender.display_name,
    \"/O=EXCHANGELABS\")\n)\nand sender.email.domain.root_domain not in $org_domains\nand not (\n  sender.email.domain.root_domain
    in ('fnfcorp.com')\n  and headers.auth_summary.dmarc.pass\n)"
