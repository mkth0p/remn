id: sublime-8e005a22-5946-5614-a77d-89cef4ee754a
title: 'Impersonation: Executive using numbered local part'
description: Detects messages from free email providers where the sender's email address uses a pattern commonly associated
  with executive impersonation, containing 'chair' or 'ceo' followed by numbers in the local part.
severity: high
source: mails
tags:
- sublime
- bec-fraud
- free-email-provider
- impersonation-vip
- social-engineering
where:
  fromDomain|in:
  - aol.com
  - fastmail.com
  - free.fr
  - gmail.com
  - gmx.com
  - gmx.de
  - gmx.fr
  - gmx.net
  - hotmail.com
  - hotmail.fr
  - icloud.com
  - laposte.net
  - live.com
  - live.fr
  - mail.com
  - mail.ru
  - me.com
  - msn.com
  - orange.fr
  - outlook.com
  - outlook.fr
  - proton.me
  - protonmail.com
  - sfr.fr
  - tutanota.com
  - wanadoo.fr
  - web.de
  - yahoo.co.uk
  - yahoo.com
  - yahoo.fr
  - yandex.com
  - yandex.ru
  - zoho.com
  fromAddr|re: ^c(?:hair|eo)\d+
sublime:
  id: 8e005a22-5946-5614-a77d-89cef4ee754a
  attack_types:
  - BEC/Fraud
  tactics_and_techniques:
  - Free email provider
  - 'Impersonation: VIP'
  - Social engineering
  detection_methods:
  - Header analysis
  - Sender analysis
