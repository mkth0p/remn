id: sublime-445a8c8b-cd38-5161-bf56-2eab83419e24
title: 'Brand impersonation: AuthentiSign'
description: Detects messages impersonating AuthentiSign through display name, domain, subject, or body content that either
  originate from non-AuthentiSign or spoofed domains.
severity: medium
source: mails
tags:
- sublime
- credential-phishing
- bec-fraud
- impersonation-brand
- lookalike-domain
- social-engineering
where:
  bodyText|contains: authentisign
  any_of:
  - bodyText|re: signing (?:name|party)
  - fromName|contains: authentisign
  - fromName|levenshtein:
    - authentisign
    - 1
  - fromDomain|contains: authentisign
  any_of_2:
  - fromRegistrable|ne: authentisign.com
  - fromRegistrable: authentisign.com
    not:
      any_of:
      - auth.spf: pass
      - auth.dmarc: pass
sublime:
  id: 445a8c8b-cd38-5161-bf56-2eab83419e24
  attack_types:
  - Credential Phishing
  - BEC/Fraud
  tactics_and_techniques:
  - 'Impersonation: Brand'
  - Lookalike domain
  - Social engineering
  detection_methods:
  - Content analysis
  - Header analysis
  - Sender analysis
  source: "type.inbound\nand strings.icontains(body.current_thread.text, \"authentisign\")\nand (\n  regex.icontains(body.current_thread.text,
    'signing (?:name|party)')\n  or strings.ilike(sender.display_name, '*authentisign*')\n  or strings.ilevenshtein(sender.display_name,
    'authentisign') <= 1\n  or strings.ilike(sender.email.domain.domain, '*authentisign*')\n)\nand (\n  sender.email.domain.root_domain
    != \"authentisign.com\"\n  or (\n    sender.email.domain.root_domain == \"authentisign.com\"\n    and not (headers.auth_summary.spf.pass
    or headers.auth_summary.dmarc.pass)\n  )\n)"
---
id: sublime-51af3d4a-1667-50df-a99e-e3f00479564b
title: 'Brand impersonation: Office 365 mail service'
description: Detects messages from domains containing both 'o365' and 'mail' in the second-level domain, commonly used to
  impersonate legitimate Microsoft Office 365 mail services.
severity: medium
source: mails
tags:
- sublime
- credential-phishing
- impersonation-brand
- lookalike-domain
- social-engineering
where:
  any_of:
  - fromRegistrable|contains: o365
  - fromRegistrable|contains: outlook
  - fromRegistrable|contains: office
  fromRegistrable|contains: mail
  not:
    fromRegistrable|in:
    - agentofficemail.com
    - mdofficemail.com
    - medofficemail.com
    - officemailbox.fr
    - mail-office.fr
    - officedepot-mail.co.kr
    - emailmarketdataoutlook.com
    - officelabsmail.co.uk
    auth.dmarc: pass
sublime:
  id: 51af3d4a-1667-50df-a99e-e3f00479564b
  attack_types:
  - Credential Phishing
  tactics_and_techniques:
  - 'Impersonation: Brand'
  - Lookalike domain
  - Social engineering
  detection_methods:
  - Sender analysis
  source: "type.inbound\nand (\n  strings.icontains(sender.email.domain.sld, 'o365')\n  or strings.icontains(sender.email.domain.sld,
    'outlook')\n  or strings.icontains(sender.email.domain.sld, 'office')\n)\nand strings.icontains(sender.email.domain.sld,
    'mail')\n// not benign use cases\nand not (\n  sender.email.domain.root_domain in (\n    \"agentofficemail.com\", // mandrill
    app addon\n    \"mdofficemail.com\", // doctor office\n    \"medofficemail.com\", // doctor office\n    \"officemailbox.fr\",
    // bulk mail provider\n    \"mail-office.fr\", // bulk mail provider\n    \"officedepot-mail.co.kr\", // office depot
    in kr\n    \"emailmarketdataoutlook.com\", // email mrkting \n    \"officelabsmail.co.uk\" // company in the uk\n  )\n
    \ and headers.auth_summary.dmarc.pass\n)"
---
