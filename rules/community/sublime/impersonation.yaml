  - Header analysis
  - Sender analysis
  source: "type.inbound\nand (\n  regex.icontains(sender.display_name, '\\bDashlane\\b')\n  or strings.ilike(sender.email.domain.domain,
    '*Dashlane*')\n)\nand sender.email.domain.root_domain not in~ ('dashlane.com')\n\n// negate highly trusted sender domains
    unless they fail DMARC authentication\nand (\n  (\n    sender.email.domain.root_domain in $high_trust_sender_root_domains\n
    \   and not headers.auth_summary.dmarc.pass\n  )\n  or sender.email.domain.root_domain not in $high_trust_sender_root_domains\n)"
---
id: sublime-d437710b-ad4e-5618-93de-f559aa27ad8a
title: DocuSign impersonation via spoofed Intuit sender
description: Detects messages appearing to come from Intuit domains with authentication failures while masquerading as DocuSign
  communications. The sender fails either SPF or DMARC verification, and includes DocuSign branding in either the subject
  line or display name.
severity: high
source: mails
tags:
- sublime
- credential-phishing
- impersonation-brand
- spoofing
where:
  fromRegistrable|in:
  - intuit.com
  any_of:
  - not:
      auth.spf: pass
  - not:
      auth.dmarc: pass
  any_of_2:
  - subject|contains: docusign
  - fromName|contains: docusign
sublime:
  id: d437710b-ad4e-5618-93de-f559aa27ad8a
  attack_types:
  - Credential Phishing
  tactics_and_techniques:
  - 'Impersonation: Brand'
  - Spoofing
  detection_methods:
  - Header analysis
  - Sender analysis
  source: "type.inbound\nand sender.email.domain.root_domain in (\"intuit.com\")\n// email auth fails\nand (\n  not headers.auth_summary.spf.pass\n
    \ or not coalesce(headers.auth_summary.dmarc.pass, false)\n)\n// the subject or display_name includes docusign\nand (\n
    \ strings.icontains(subject.subject, \"docusign\")\n  or strings.icontains(sender.display_name, \"docusign\")\n)"
