id: sublime-00f3d94f-7ed2-5dde-a48d-fb5fcbc20cd2
title: 'Brand impersonation: Zoom (strict)'
description: Impersonation of the video conferencing provider Zoom. This "strict" version of this rule will only flag when
  the sender's display name matches those used by Zoom exactly.
severity: medium
source: mails
tags:
- sublime
- credential-phishing
- impersonation-brand
- social-engineering
references:
- https://www.theverge.com/2020/5/12/21254921/hacker-domains-impersonating-zoom-microsoft-teams-google-meet-phishing-covid-19
where:
  any_of:
  - fromName: zoom
  - fromName: zoom video communications, inc.
  - fromName: zoom call
  fromRegistrable|nin:
  - zoom.us
  - zuora.com
  - zoomgov.com
  - zoom.com
  any_of_2:
  - fromRegistrable|in:
    - aol.com
    - fastmail.com
    - free.fr
    - gmail.com
    - gmx.com
    - gmx.de
    - gmx.fr
    - gmx.net
    - hotmail.com
    - hotmail.fr
    - icloud.com
    - laposte.net
    - live.com
    - live.fr
    - mail.com
    - mail.ru
    - me.com
    - msn.com
    - orange.fr
    - outlook.com
    - outlook.fr
    - proton.me
    - protonmail.com
    - sfr.fr
    - tutanota.com
    - wanadoo.fr
    - web.de
    - yahoo.co.uk
    - yahoo.com
    - yahoo.fr
    - yandex.com
    - yandex.ru
    - zoho.com
    not:
      senderSolicited: true
  - fromRegistrable|nin:
    - aol.com
    - fastmail.com
    - free.fr
    - gmail.com
    - gmx.com
    - gmx.de
    - gmx.fr
    - gmx.net
    - hotmail.com
    - hotmail.fr
    - icloud.com
    - laposte.net
    - live.com
    - live.fr
    - mail.com
    - mail.ru
    - me.com
    - msn.com
    - orange.fr
    - outlook.com
    - outlook.fr
    - proton.me
    - protonmail.com
    - sfr.fr
    - tutanota.com
    - wanadoo.fr
    - web.de
    - yahoo.co.uk
    - yahoo.com
    - yahoo.fr
    - yandex.com
    - yandex.ru
    - zoho.com
    not:
      senderSolicited: true
sublime:
  id: 00f3d94f-7ed2-5dde-a48d-fb5fcbc20cd2
  attack_types:
  - Credential Phishing
  tactics_and_techniques:
  - 'Impersonation: Brand'
  - Social engineering
  detection_methods:
  - Sender analysis
  source: "type.inbound\nand (\n  sender.display_name =~ 'zoom'\n  or sender.display_name =~ 'zoom video communications, inc.'\n
    \ or sender.display_name =~ 'zoom call'\n)\nand sender.email.domain.root_domain not in (\n  'zoom.us',\n  'zuora.com',\n
    \ 'zoomgov.com',\n  'zoom.com'\n)\nand (\n  // if this comes from a free email provider,\n  // flag if org has never sent
    an email to sender's email before\n  (\n    sender.email.domain.root_domain in $free_email_providers\n    and not profile.by_sender().solicited\n
    \ )\n  // if this comes from a custom domain,\n  // flag if org has never sent an email to sender's domain before\n  or
    (\n    sender.email.domain.root_domain not in $free_email_providers\n    and not profile.by_sender().solicited\n  )\n)"
