id: sublime-9416b5b7-3850-505c-a283-45a2bc483f81
title: 'Brand impersonation: QuickBooks dispute notification'
description: Detects messages impersonating QuickBooks or Intuit that reference dispute notifications or resolutions, but
  originate from unauthorized domains that fail DMARC authentication.
severity: high
source: mails
tags:
- sublime
- bec-fraud
- impersonation-brand
where:
  any_of:
  - subject|contains_any:
    - Quickbooks
    - Intuit
  - fromName|contains_any:
    - Quickbooks
    - Intuit
  any_of_2:
  - subject|re: Dispute\s+(?:Notification|Resolution)
  - fromName|re: Dispute\s+(?:Notification|Resolution)
  - bodyText|re: Dispute\s+(?:Notification|Resolution)
  not:
    fromRegistrable|in:
    - intuit.com
    - turbotax.com
    - intuit.ca
    - meliopayments.com
    - qemailserver.com
    - intuit.co.uk
    - quickbooksonline.com
    - tsheets.com
    auth.dmarc: pass
sublime:
  id: 9416b5b7-3850-505c-a283-45a2bc483f81
  attack_types:
  - BEC/Fraud
  tactics_and_techniques:
  - 'Impersonation: Brand'
  detection_methods:
  - Content analysis
  - Sender analysis
  - Header analysis
  source: "type.inbound\nand any([subject.base, sender.display_name],\n        strings.icontains(., 'Quickbooks', 'Intuit')\n)\nand
    any([subject.base, sender.display_name, body.current_thread.text],\n        regex.icontains(., 'Dispute\\s+(?:Notification|Resolution)')\n)\nand
    not (\n  sender.email.domain.root_domain in~ (\n    'intuit.com',\n    'turbotax.com',\n    'intuit.ca',\n    'meliopayments.com',\n
    \   'qemailserver.com',\n    'intuit.co.uk',\n    'quickbooksonline.com',\n    'tsheets.com'\n  )\n  and coalesce(headers.auth_summary.dmarc.pass,
    false)\n)"
