id: sublime-998a0826-e917-5a8f-9e15-0f1ded21bf91
title: Sharepoint file share with suspicious recipients pattern
description: This rule detects messages originating from sharepoint.com with undisclosed recipients that are attempting to
  solicit the user to click a link. This has been observed in the event of an account compromise where the compromised account
  was utilizing legitimate file sharing services to share malicious links.
severity: medium
source: mails
tags:
- sublime
- credential-phishing
- malware-ransomware
- evasion
where:
  to.name: Undisclosed recipients
  bodyText|contains_any:
  - shared a file with you
  - shared with you
  - invited you to access a file
  subject|contains: shared
  urls.domain: sharepoint.com
sublime:
  id: 998a0826-e917-5a8f-9e15-0f1ded21bf91
  attack_types:
  - Credential Phishing
  - Malware/Ransomware
  tactics_and_techniques:
  - Evasion
  detection_methods:
  - Content analysis
  - Header analysis
  - URL analysis
  source: "type.inbound\n\n// Suspicious recipient pattern\nand any(recipients.to, .display_name == \"Undisclosed recipients\")\nand
    strings.ilike(body.current_thread.text,\n                  \"*shared a file with you*\",\n                  \"*shared
    with you*\",\n                  \"*invited you to access a file*\"\n)\nand strings.icontains(subject.subject, \"shared\")\nand
    any(body.links, .href_url.domain.root_domain == \"sharepoint.com\")"
---
id: sublime-d9766109-6574-5fd8-9c07-d606d3ce82d2
title: 'Spam: Suspicious toll-free phone number'
description: Detects messages containing phone numbers 1 800-555-0199 or 1 800-555-0299 in the subject or body, which is reserved
  for use by the entertainment industry. Commonly used as a placeholder phone number in LLM-generated campaigns.
severity: low
source: mails
tags:
- sublime
- spam
- social-engineering
where:
  any_of:
  - bodyText|re: \b\+?(\d{1}.)?\(?8\d{2}?\)?.555.?0[12]99\b
  - subject|re: \b\+?(\d{1}.)?\(?8\d{2}?\)?.555.?0[12]99\b
sublime:
  id: d9766109-6574-5fd8-9c07-d606d3ce82d2
  attack_types:
  - Spam
  tactics_and_techniques:
  - Social engineering
  detection_methods:
  - Content analysis
  source: "type.inbound\nand any([body.current_thread.text, subject.subject],\n        regex.icontains(., '\\b\\+?(\\d{1}.)?\\(?8\\d{2}?\\)?.555.?0[12]99\\b')\n)"
---
id: sublime-f3424a81-3843-5a3e-8fc8-126cf7037cfa
title: 'Link: Mixed case HTTPS protocol'
description: Detects messages containing links with mixed case 'hTTPs' protocol, a technique used to evade detection filters.
severity: medium
source: mails
tags:
- sublime
- credential-phishing
- malware-ransomware
- evasion
where:
  urlCount|gt: 0
  urls.url|contains_cs: hTTPs://
sublime:
  id: f3424a81-3843-5a3e-8fc8-126cf7037cfa
  attack_types:
  - Credential Phishing
  - Malware/Ransomware
  tactics_and_techniques:
  - Evasion
  detection_methods:
  - Content analysis
  - URL analysis
  source: "type.inbound\nand length(body.links) > 0 \nand any(body.links, strings.contains(.href_url.url, 'hTTPs://'))"
