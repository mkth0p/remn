  - URL analysis
  source: "type.inbound\nand any(body.links,\n        .href_url.domain.root_domain == \"secondstreetapp.com\"\n        and
    strings.icontains(.href_url.query_params, '&redirect=')\n        // not redirects to themselves\n        and not regex.icontains(.href_url.query_params,\n
    \                               '&redirect=[^&]*secondstreetapp\\.com'\n        )\n)\n// remove uses that originate from
    secondstreet\nand not any(headers.domains,\n            .root_domain in (\"secondstreetmail.com\", \"secondstreetmessages.com\")\n)\n\n//
    negate highly trusted sender domains unless they fail DMARC authentication\nand (\n  (\n    sender.email.domain.root_domain
    in $high_trust_sender_root_domains\n    and not headers.auth_summary.dmarc.pass\n  )\n  or sender.email.domain.root_domain
    not in $high_trust_sender_root_domains\n)"
