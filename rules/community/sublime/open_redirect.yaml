id: sublime-164ece9a-26ca-5872-9604-7e948722d627
title: 'Open redirect: Samsung'
description: Message contains use of the Samsung open redirect, but the sender is not Samsung.
severity: medium
source: mails
tags:
- sublime
- credential-phishing
- malware-ransomware
- open-redirect
references:
- https://twitter.com/ffforward/status/1232958609031598080?lang=en
- https://twitter.com/JCyberSec_/status/1238488919135715328?s=20
where:
  any_of:
  - urls.host: t.info.samsungusa.com
    urls.url: /r/
  - all_of:
    - urls.domain: samsung.com
    - urls.subdomain|endswith: .email
    - urls.url|contains: /r/
    - urls.url|contains: id=
    - urls.url|contains: p1=
    - urls.url|re: p1=[^\&]*(?:google\.|doubleclick\.net)
  fromRegistrable|nin:
  - samsungusa.com
  - samsung.com
sublime:
  id: 164ece9a-26ca-5872-9604-7e948722d627
  attack_types:
  - Credential Phishing
  - Malware/Ransomware
  tactics_and_techniques:
  - Open redirect
  detection_methods:
  - Sender analysis
  - URL analysis
  source: "type.inbound\nand any(body.links,\n        (\n          .href_url.domain.domain == 't.info.samsungusa.com'\n          and
    .href_url.path =~ '/r/'\n        )\n        or (\n          .href_url.domain.root_domain == \"samsung.com\"\n          and
    strings.iends_with(.href_url.domain.subdomain, '.email')\n          and strings.icontains(.href_url.path, '/r/')\n          and
    strings.icontains(.href_url.query_params, 'id=')\n          and strings.icontains(.href_url.query_params, 'p1=')\n          //
    with redirects to google/doubleclick\n          and regex.icontains(.href_url.query_params,\n                              'p1=[^\\&]*(?:google\\.|doubleclick\\.net)'\n
    \         )\n        )\n)\nand sender.email.domain.root_domain not in ('samsungusa.com', 'samsung.com')"
