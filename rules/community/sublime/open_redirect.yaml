  attack_types:
  - Credential Phishing
  - Malware/Ransomware
  tactics_and_techniques:
  - Open redirect
  detection_methods:
  - Sender analysis
  - URL analysis
  source: "type.inbound\nand any(body.links,\n        .href_url.domain.root_domain == \"vconfex.com\"\n        and strings.istarts_with(.href_url.path,
    '/etl.php')\n        and strings.icontains(.href_url.query_params, 'url=')\n        and not regex.icontains(.href_url.query_params,\n
    \                               'url=(?:https?(?:%3a|:))?(?:%2f|\\/){2}[^&]*vconfex\\.com(?:\\&|\\/|$|%2f)'\n        )\n)\nand
    not sender.email.domain.root_domain == \"vconfex.com\"\n// negate messages that also include an unsubscribe for vconfex\nand
    not any(body.links,\n            .href_url.domain.root_domain == \"vconfex.com\"\n            and strings.istarts_with(.href_url.path,
    '/unsubscribe.php')\n)\n\n// negate highly trusted sender domains unless they fail DMARC authentication\nand (\n  (\n
    \   sender.email.domain.root_domain in $high_trust_sender_root_domains\n    and not headers.auth_summary.dmarc.pass\n
    \ )\n  or sender.email.domain.root_domain not in $high_trust_sender_root_domains\n)"
