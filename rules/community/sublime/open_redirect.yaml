id: sublime-67823fac-cb03-5aea-a8ff-782e2e8c42d4
title: 'Open redirect: YouTube --> Google Redirection Chain'
description: Message contains use of a redirect chain which involves YouTube and Google amp. This has been exploited in the
  wild.
severity: medium
source: mails
tags:
- sublime
- credential-phishing
- open-redirect
where:
  all_of:
  - urls.domain: youtube.com
  - urls.url|contains: logout
  - urls.url|contains: continue=
  - urls.url|re: '&continue=(?:https?)?(?:(?:%3a|\:)?(?:\/|%2f){2})?google\.com[^\&]*\/+amp\/+s\/+'
sublime:
  id: 67823fac-cb03-5aea-a8ff-782e2e8c42d4
  attack_types:
  - Credential Phishing
  tactics_and_techniques:
  - Open redirect
  detection_methods:
  - Sender analysis
  - URL analysis
  source: "type.inbound\nand any(body.links,\n        (\n          .href_url.domain.root_domain == \"youtube.com\"\n          and
    strings.icontains(.href_url.path, 'logout')\n          // the redirect field\n          and strings.icontains(.href_url.query_params,
    \"continue=\")\n          and regex.icontains(.href_url.query_params,\n                              '&continue=(?:https?)?(?:(?:%3a|\\:)?(?:\\/|%2f){2})?google\\.com[^\\&]*\\/+amp\\/+s\\/+'\n
    \         )\n        )\n)"
