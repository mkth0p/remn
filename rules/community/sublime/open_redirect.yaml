  attack_types:
  - Credential Phishing
  - Malware/Ransomware
  tactics_and_techniques:
  - Open redirect
  detection_methods:
  - Sender analysis
  - URL analysis
  source: "type.inbound\nand any(body.links,\n        // Look for Obunsha passnavi URLs\n        .href_url.domain.domain ==
    \"passnavi.obunsha.co.jp\"\n        and strings.icontains(.href_url.path, '/ct.html')\n        and strings.icontains(.href_url.query_params,
    'uri=')\n        // Make sure it's not redirecting back to obunsha domains\n        and not regex.icontains(.href_url.query_params,\n
    \                               'uri=(?:https?(?:%3a|:))?(?:%2f|\\/){2}[^&]*obunsha\\.co\\.jp(?:\\&|\\/|$|%2f)'\n        )\n)\n//
    Exclude legitimate Obunsha domains as senders\nand not sender.email.domain.root_domain == \"obunsha.co.jp\"\n\n// negate
    highly trusted sender domains unless they fail DMARC authentication\nand (\n  (\n    sender.email.domain.root_domain in
    $high_trust_sender_root_domains\n    and not headers.auth_summary.dmarc.pass\n  )\n  or sender.email.domain.root_domain
    not in $high_trust_sender_root_domains\n)"
