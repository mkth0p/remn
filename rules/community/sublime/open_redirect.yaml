id: sublime-bbed5cc6-4c39-5a53-9255-269cbd4e27cb
title: 'Open redirect: Nested Doubleclick.net'
description: Doubleclick.net link leveraging a nested doubleclick.net open redirect from a new or outlier sender. The unusual
  behavior of nesting a doubleclick URL inside another doubleclick link warrants increasing the severity of this rule.
severity: high
source: mails
tags:
- sublime
- credential-phishing
- malware-ransomware
- open-redirect
where:
  urlCount|lt: 10
  urls.domain: doubleclick.net
  any_of:
  - urls.url|contains: /aclk
  - urls.url|contains: /pcs/click
  - urls.url|contains: /searchads/link/click
  urls.url|re: '&(?:adurl|ds_dest_url)=(?:https?(\:|%3a))?(?:\/|%2f)(?:\/|%2f)adclick.g.doubleclick.net'
sublime:
  id: bbed5cc6-4c39-5a53-9255-269cbd4e27cb
  attack_types:
  - Credential Phishing
  - Malware/Ransomware
  tactics_and_techniques:
  - Open redirect
  detection_methods:
  - Sender analysis
  - URL analysis
  source: "type.inbound\nand length(body.links) < 10\nand any(body.links,\n        .href_url.domain.root_domain == \"doubleclick.net\"\n
    \       and (\n          strings.icontains(.href_url.path, \"/aclk\")\n          or strings.icontains(.href_url.path,
    \"/pcs/click\")\n          or strings.icontains(.href_url.path, \"/searchads/link/click\")\n        )\n        and regex.icontains(.href_url.query_params,\n
    \                           '&(?:adurl|ds_dest_url)=(?:https?(\\:|%3a))?(?:\\/|%2f)(?:\\/|%2f)adclick.g.doubleclick.net'\n
    \       )\n)"
