id: sublime-faff6efd-c644-58f1-b856-fd707cf8c9b9
title: 'Open redirect: JustPaste.it'
description: Detects inbound messages containing JustPaste.it redirect links that forward to external destinations outside
  of JustPaste.it. This technique abuses JustPaste.it's redirect functionality to obscure the true destination URL, bypassing
  link reputation checks. The rule excludes legitimate senders from JustPaste.it itself.
severity: medium
source: mails
tags:
- sublime
- credential-phishing
- malware-ransomware
- open-redirect
- free-file-host
- evasion
where:
  all_of:
  - urls.host: justpaste.it
    urls.url|startswith: /redirect/
    not:
      urls.url|contains: justpaste.it
  - not:
      fromRegistrable: justpaste.it
sublime:
  id: faff6efd-c644-58f1-b856-fd707cf8c9b9
  attack_types:
  - Credential Phishing
  - Malware/Ransomware
  tactics_and_techniques:
  - Open redirect
  - Free file host
  - Evasion
  detection_methods:
  - URL analysis
  - Sender analysis
  source: "type.inbound\nand any(body.links,\n        .href_url.domain.domain == \"justpaste.it\"\n        and strings.istarts_with(.href_url.path,
    '/redirect/')\n        // wrapped destination is not back to justpaste.it\n        and not strings.icontains(.href_url.path,
    'justpaste.it')\n)\nand not sender.email.domain.root_domain == \"justpaste.it\""
