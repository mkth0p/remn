sublime:
  id: 27e5a585-891d-549d-af34-e2b8dff6d64e
  attack_types:
  - Credential Phishing
  - Malware/Ransomware
  tactics_and_techniques:
  - Open redirect
  detection_methods:
  - Sender analysis
  - URL analysis
  source: "type.inbound\n// smartadserver is used in benign messages, however, they commonly have many links\n// ensure messages
    contain less than 15 links to ensure higher fidelity matching of malicious messages\nand length(body.links) < 15\nand
    any(body.links,\n        .href_url.domain.root_domain == \"smartadserver.com\"\n        and strings.icontains(.href_url.query_params,
    'go=')\n        and not regex.icontains(.href_url.query_params,\n                                'go=(?:https?(?:%3a|:))?(?:%2f|\\/){2}[^&]*smartadserver\\.com(?:\\&|\\/|$|%2f)'\n
    \       )\n)\n// remove uses that originate from smartadserver.com\nand not any(headers.domains, .root_domain == \"smartadserver.com\")\n//
    negate highly trusted sender domains unless they fail DMARC authentication\nand (\n  (\n    sender.email.domain.root_domain
    in $high_trust_sender_root_domains\n    and not headers.auth_summary.dmarc.pass\n  )\n  or sender.email.domain.root_domain
    not in $high_trust_sender_root_domains\n)"
---
