sublime:
  id: 7fc92916-6c7a-53dd-9487-22b11ee062b3
  attack_types:
  - Credential Phishing
  - Malware/Ransomware
  tactics_and_techniques:
  - Open redirect
  detection_methods:
  - Sender analysis
  - URL analysis
  source: "type.inbound\nand any(body.links,\n        (\n          .href_url.domain.domain == \"ib.adnxs.com\"\n          and
    strings.icontains(.href_url.path, '/getuid')\n          // Make sure the redirect is not going back to adnxs.com\n          and
    not regex.icontains(.href_url.query_params,\n                                  'getuid\\?(?:https?(?:%3a|:))?(?:%2f|\\/){2}[^&]*adnxs\\.com(?:\\&|\\/|$|%2f)'\n
    \         )\n        )\n        // second form of an open redirect\n        or (\n          .href_url.domain.domain ==
    \"secure.adnxs.com\"\n          and strings.icontains(.href_url.query_params, 'redir=')\n          // Make sure the redirect
    is not going back to adnxs.com\n          and not regex.icontains(.href_url.query_params,\n                                  'redir=(?:https?(?:%3a|:))?(?:%2f|\\/){2}[^&]*adnxs\\.com(?:\\&|\\/|$|%2f)'\n
    \         )\n        )\n)\nand not sender.email.domain.root_domain == \"adnxs.com\"\nand not sender.email.domain.root_domain
    == \"appnexus.com\"\n\n// negate highly trusted sender domains unless they fail DMARC authentication\nand (\n  (\n    sender.email.domain.root_domain
    in $high_trust_sender_root_domains\n    and not headers.auth_summary.dmarc.pass\n  )\n  or sender.email.domain.root_domain
    not in $high_trust_sender_root_domains\n)"
