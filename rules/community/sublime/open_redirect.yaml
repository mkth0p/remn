id: sublime-374b7517-bb48-5fed-885c-16d27f561e55
title: 'Open redirect: Shibboleth SSO Logout Return Parameter'
description: Detects links that contain a Shibboleth SSO logout endpoint with a return parameter, which could be used for
  open redirect attacks. The rule checks for both direct path inclusion and URL-encoded versions in query parameters. Only
  triggers on senders with non-common prevalence.
severity: high
source: mails
tags:
- sublime
- credential-phishing
- open-redirect
- evasion
where:
  any_of:
  - urls.url|contains: /Shibboleth.sso/Logout
    any_of:
    - urls.url|contains: return=
    - urls.url|contains: return=
  - all_of:
    - urls.url|contains: Shibboleth.sso%2fLogout
    - urls.url|contains: return%3d
sublime:
  id: 374b7517-bb48-5fed-885c-16d27f561e55
  attack_types:
  - Credential Phishing
  tactics_and_techniques:
  - Open redirect
  - Evasion
  detection_methods:
  - HTML analysis
  - URL analysis
  - Sender analysis
  source: "type.inbound\nand any(body.links,\n        // uses shibboleth.sso directly within the path\n        (\n          strings.icontains(.href_url.path,
    '/Shibboleth.sso/Logout')\n          and (\n            strings.icontains(.href_url.path, 'return=')\n            or strings.icontains(.href_url.query_params,
    'return=')\n          )\n        )\n        // or url encoded within the query_params\n        or (\n          strings.icontains(.href_url.query_params,
    'Shibboleth.sso%2fLogout')\n          and strings.icontains(.href_url.query_params, \"return%3d\")\n        )\n)"
---
