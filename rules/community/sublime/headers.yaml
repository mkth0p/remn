id: sublime-07e03563-88f6-5d2f-8730-7d17f860ba14
title: PHP Mailer with common phishing attachments
description: Mail coming from a PHP Mailer user agent that includes attachments with commonly used names in phishing campaigns
severity: medium
source: mails
tags:
- sublime
- credential-phishing
- image-as-content
references:
- https://github.com/sublime-security/sublime-rules/blob/main/detection-rules/headers_php_mailer.yml
where:
  xMailer|contains: phpmailer
  attachments.name|in:
  - image.png
  - name.png
  - use.png
sublime:
  id: 07e03563-88f6-5d2f-8730-7d17f860ba14
  attack_types:
  - Credential Phishing
  tactics_and_techniques:
  - Image as content
  detection_methods:
  - Header analysis
  source: 'type.inbound

    and strings.ilike(headers.mailer, ''*phpmailer*'')

    and any(attachments, .file_name in~ (''image.png'', ''name.png'', ''use.png''))'
---
id: sublime-271f4ae9-9681-5d61-a94d-8fa714db826d
title: Sendgrid onmicrosoft.com domain phishing
description: The message originates from an onmicrosoft.com email address being sent via Sendgrid.
severity: medium
source: mails
tags:
- sublime
- credential-phishing
- evasion
where:
  returnPath|re: (^|@|\.)sendgrid\.net$
  fromRegistrable: onmicrosoft.com
  not:
    fromAddr|contains_any:
    - postmaster
    - mailer-daemon
    - administrator
sublime:
  id: 271f4ae9-9681-5d61-a94d-8fa714db826d
  attack_types:
  - Credential Phishing
  tactics_and_techniques:
  - Evasion
  detection_methods:
  - Header analysis
  source: "type.inbound\nand headers.return_path.domain.domain == \"sendgrid.net\"\nand sender.email.domain.root_domain ==
    \"onmicrosoft.com\"\nand not strings.like(sender.email.local_part,\n                     \"*postmaster*\",\n                     \"*mailer-daemon*\",\n
    \                    \"*administrator*\"\n)"
---
id: sublime-4cc0b5dc-8071-5746-9a9d-4838846ae044
title: 'Headers: risky-recover-production message ID'
description: Detects messages containing 'risky-recover-production' in the message ID header, which may indicate suspicious
  or malicious activity.
severity: low
source: mails
tags:
- sublime
- spam
- evasion
where:
  messageId|contains: risky-recover-production
sublime:
  id: 4cc0b5dc-8071-5746-9a9d-4838846ae044
  attack_types:
  - Spam
  tactics_and_techniques:
  - Evasion
  detection_methods:
  - Header analysis
  source: 'type.inbound

    and strings.icontains(headers.message_id, ''risky-recover-production'')'
