id: sublime-d23e694f-a23d-5730-9a04-29629f2e6696
title: 'Headers: Zimbra mailer from a non-supported OS version'
description: Detects Zimbra originated emails sent from non-supported Windows versions. Observed in widespread HTML credential
  phishing campaigns.
severity: medium
source: mails
tags:
- sublime
where:
  xMailer|startswith_cs: Zimbra
  xMailer|re: \b(5\.1|6\.1)\.\d{4}\b
sublime:
  id: d23e694f-a23d-5730-9a04-29629f2e6696
  detection_methods:
  - Header analysis
  source: 'type.inbound

    and strings.starts_with(headers.mailer, "Zimbra")

    and regex.icontains(headers.mailer, ''\b(5\.1|6\.1)\.\d{4}\b'')'
---
id: sublime-e0b74072-3210-5511-9ad9-2c945ab28abb
title: 'Headers: iOS/iPadOS mailer with invalid build number'
description: Detects emails claiming to be sent from an iOS or iPadOS device that contain an invalid build number.
severity: medium
source: mails
tags:
- sublime
- bec-fraud
- credential-phishing
- malware-ransomware
- evasion
where:
  xMailer|re: (iPad|iPhone) Mail
  not:
    xMailer|re: (iPad|iPhone) Mail \([0-9]{2}
sublime:
  id: e0b74072-3210-5511-9ad9-2c945ab28abb
  attack_types:
  - BEC/Fraud
  - Credential Phishing
  - Malware/Ransomware
  tactics_and_techniques:
  - Evasion
  detection_methods:
  - Header analysis
  source: 'type.inbound

    and regex.contains(headers.mailer, ''(iPad|iPhone) Mail'')

    and not regex.contains(headers.mailer, ''(iPad|iPhone) Mail \([0-9]{2}'')'
