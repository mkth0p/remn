id: sublime-5257f3dd-8c5f-50c7-a987-89379dfc4e40
title: 'Spam: Spoofed Outlook mailer with unsubscribe and reference ID footer'
description: Flags inbound messages that spoof the Microsoft Outlook mailer header while containing an 'unsubscribe here'
  link followed by an alphanumeric reference ID pattern in the body text, a common tactic used to lend spam messages an air
  of legitimacy. Highly trusted sender domains are excluded from this rule when they pass DMARC authentication.
severity: low
source: mails
tags:
- sublime
- spam
- social-engineering
- spoofing
