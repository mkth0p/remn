id: sublime-2bdc6a3b-1239-5644-b4bc-d31666ded22e
title: 'Spam: SMTP & Proxy Communications in Email Body'
description: An email containing SMTP and Proxy (socks5) command and control information within the body of the message.
severity: medium
source: mails
tags:
- sublime
- spam
- free-email-provider
where:
  attachmentCount: 0
  urlCount|gt: 1
  urlCount|lt: 5
  bodyText|re: (?:\:socks5:|::127.0.0.1:1080|:0:127.0.0.1:1080)
sublime:
  id: 2bdc6a3b-1239-5644-b4bc-d31666ded22e
  attack_types:
  - Spam
  tactics_and_techniques:
  - Free email provider
  detection_methods:
  - Content analysis
  source: "type.inbound\nand length(attachments) == 0\nand 1 < length(body.links) < 5\nand regex.icontains(body.current_thread.text,\n
    \                   '(?:\\:socks5:|::127.0.0.1:1080|:0:127.0.0.1:1080)'\n)"
