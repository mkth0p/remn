sublime:
  id: 9669c169-57fe-5d80-865a-5e66eccfb658
  attack_types:
  - Malware/Ransomware
  tactics_and_techniques:
  - Evasion
  - Social engineering
  detection_methods:
  - File analysis
  - Header analysis
  source: "type.inbound\n\n// attachment with .scpt extension (compiled AppleScript)\nand any(attachments,\n        .file_extension
    == \"scpt\"\n        // double extension pattern: common document extensions followed by .scpt\n        and regex.icontains(.file_name,\n
    \                           '\\.(doc|docx|pdf|xls|xlsx|ppt|pptx|txt|rtf)\\.scpt$'\n        )\n        // ensure it's actually
    a binary/script file, not just renamed\n        // compiled AppleScript files are binary and have minimum size\n        and
    (.file_type == \"unknown\" or .file_type == \"exe\")\n        // compiled .scpt files are binary, should have reasonable
    size\n        and .size > 1000\n)\n\n// negate highly trusted sender domains unless they fail DMARC authentication\nand
    (\n  (\n    sender.email.domain.root_domain in $high_trust_sender_root_domains\n    and not headers.auth_summary.dmarc.pass\n
    \ )\n  or sender.email.domain.root_domain not in $high_trust_sender_root_domains\n)"
