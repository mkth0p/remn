id: sublime-9669c169-57fe-5d80-865a-5e66eccfb658
title: 'macOS malware: Compiled AppleScript with document double-extension'
description: Detects compiled AppleScript files (.scpt) with document double-extensions (e.g., .docx.scpt, .pdf.scpt) commonly
  used in DPRK-attributed macOS malware campaigns. These files open in Script Editor when double-clicked and use social engineering
  (fake compatibility errors) to trick users into executing malicious reconnaissance scripts that fetch subsequent payload
  stages.
severity: high
source: mails
tags:
- sublime
- malware-ransomware
- evasion
- social-engineering
references:
- https://delivr.to/payloads?id=9fd3974a-b764-4011-b3ea-f4eeb993aa5b
where:
  attachments.ext: scpt
  attachments.name|re: \.(doc|docx|pdf|xls|xlsx|ppt|pptx|txt|rtf)\.scpt$
  any_of:
  - attachments.realExt: unknown
  - attachments.realExt: exe
  attachments.size|gt: 1000
