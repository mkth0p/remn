id: sublime-12069f5b-a774-53ba-8473-633291f71e84
title: URL with Unicode U+2044 (⁄) or U+2215 (∕) characters
description: Body of the message, or any links, contain the Unicode U+2044 (⁄) or U+2215 (∕) characters inside a URL.
severity: low
source: mails
tags:
- sublime
- credential-phishing
- evasion
- social-engineering
references:
- https://medium.com/@bobbyrsec/the-dangers-of-googles-zip-tld-5e1e675e59a5
where:
  any_of:
  - bodyText|re: https?:\/\/[^\s⁄∕]+(?:\/[^\s⁄∕]+)*[⁄∕][^\s⁄∕]+
  - urls.url|contains_any:
    - ⁄
    - ∕
sublime:
  id: 12069f5b-a774-53ba-8473-633291f71e84
  attack_types:
  - Credential Phishing
  tactics_and_techniques:
  - Evasion
  - Social engineering
  detection_methods:
  - Content analysis
  - URL analysis
  source: "type.inbound\nand (\n  regex.icontains(body.plain.raw,\n                  'https?:\\/\\/[^\\s⁄∕]+(?:\\/[^\\s⁄∕]+)*[⁄∕][^\\s⁄∕]+'\n
    \ )\n  or any(body.links, strings.contains(.href_url.url, '⁄', '∕'))\n)"
