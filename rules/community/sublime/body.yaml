  source: "type.inbound\n// freemailer\nand sender.email.domain.root_domain in $free_email_providers\n// goodreads mention\nand
    strings.icontains(body.current_thread.text, \"goodreads\")\n// addresses the recipient as the author of their own work\nand
    regex.icontains(body.current_thread.text,\n                    '\\byour (?:books?|work|text|title|novel|manuscript|writing|scholarship|research|reporting|story)\\b'\n)\n//\nand
    regex.icontains(body.current_thread.text,\n                    '\\b(?:featur|spotlight|showcase|introduce your|invite
    you|selected your|reading (?:cycle|circle|challenge|community|discussion))'\n)\n// negate highly trusted sender domains
    unless they fail DMARC authentication\nand not (\n  sender.email.domain.root_domain in $high_trust_sender_root_domains\n
    \ and coalesce(headers.auth_summary.dmarc.pass, false)\n)"
