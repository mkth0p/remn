# Sublime Security - detection rules - generated by tools/import_community_rules.py from sublime-security/sublime-rules@b4fe36890fd9 (2026-09-05). Upstream licence: MIT License (see LICENSE). Do not edit by hand: re-run the import.
id: sublime-6b5e1f55-1143-533d-8342-726373dc7f10
title: 'Link: Free file host link with ''Important Viewing Note'' lure'
description: Detects inbound messages containing links to free file hosting domains paired with the phrase 'important viewing
  note' in the message body. These messages often masquerade as institutional or educational communications — such as student
  conduct reports or advancement initiatives — to add legitimacy and encourage recipients to follow the hosted link.
severity: medium
source: mails
tags:
- sublime
- credential-phishing
- free-file-host
- social-engineering
- impersonation-brand
where:
  urls.host|in:
  - 1drv.ms
  - anonfiles.com
  - blob.core.windows.net
  - box.com
  - cdn.discordapp.com
  - cloudflare-ipfs.com
  - discord.com
  - docs.google.com
  - drive.google.com
  - dropbox.com
  - dweb.link
  - file.io
  - firebasestorage.googleapis.com
  - github.com
  - gofile.io
  - ipfs.io
  - mediafire.com
  - mega.nz
  - onedrive.live.com
  - pastebin.com
  - pcloud.link
  - raw.githubusercontent.com
  - s3.amazonaws.com
  - sendspace.com
  - sharepoint.com
  - storage.googleapis.com
  - transfer.sh
  - we.tl
  - web.core.windows.net
  - wetransfer.com
  bodyText|contains: important viewing note
sublime:
  id: 6b5e1f55-1143-533d-8342-726373dc7f10
  attack_types:
  - Credential Phishing
  tactics_and_techniques:
  - Free file host
  - Social engineering
  - 'Impersonation: Brand'
  detection_methods:
  - Content analysis
  - URL analysis
  - Threat intelligence
  source: 'type.inbound

    and any(body.current_thread.links, .href_url.domain.domain in $free_file_hosts)

    and strings.icontains(body.current_thread.text, ''important viewing note'')'
