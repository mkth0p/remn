id: sublime-364a0ea6-8011-5de2-b4c5-5eff8134037a
title: 'Attachment: TAR file with RAR type'
description: Detects messages with TAR file extensions that are actually RAR file types. This mismatch between file extension
  and actual file type may indicate an evasion technique.
severity: high
source: mails
tags:
- sublime
- malware-ransomware
- evasion
where:
  attachments.ext: tar
  attachments.realExt: rar
sublime:
  id: 364a0ea6-8011-5de2-b4c5-5eff8134037a
  attack_types:
  - Malware/Ransomware
  tactics_and_techniques:
  - Evasion
  detection_methods:
  - Archive analysis
  - File analysis
  source: 'type.inbound

    and any(attachments, .file_extension =~ "tar" and .file_type =~ "rar")'
