id: sublime-383a5810-0b85-55a8-ac9b-e7135823317b
title: 'Attachment: ICS file with meeting prefix'
description: Detects incoming messages with a single ICS calendar file attachment that has a filename starting with 'meeting_'.
severity: high
source: mails
tags:
- sublime
- bec-fraud
- credential-phishing
- ics-phishing
- social-engineering
where:
  attachmentCount: 1
  any_of:
  - attachments.ext|in:
    - ics
  - attachments.realMime|in:
    - application/ics
    - text/calendar
  attachments.name|re: meeting_[a-zA-Z0-9]{5}\.
sublime:
  id: 383a5810-0b85-55a8-ac9b-e7135823317b
  attack_types:
  - BEC/Fraud
  - Credential Phishing
  tactics_and_techniques:
  - ICS Phishing
  - Social engineering
  detection_methods:
  - File analysis
  - Header analysis
  source: "type.inbound\nand length(attachments) == 1\nand any(filter(attachments,\n               .file_extension in~ ('ics')\n
    \              or .content_type in (\"application/ics\", \"text/calendar\")\n        ),\n        regex.icontains(.file_name,
    'meeting_[a-zA-Z0-9]{5}\\.')\n)"
