id: sublime-0c6fba7a-b8a9-5491-a32c-411882e10c79
title: 'Attachment: Uncommon compressed file'
description: Use if passing compressed or archive files is not typical behavior in your organization. This behavior has been
  observed in a number of phishing campaigns.
severity: low
source: mails
tags:
- sublime
- malware-ransomware
- credential-phishing
references:
- https://www.intezer.com/blog/research/global-phishing-campaign-targets-energy-sector-and-its-suppliers/
- https://filesec.io/
where:
  attachments.ext|in:
  - tar
  - iso
  - img
  - cab
  - gadget
  - uue
sublime:
  id: 0c6fba7a-b8a9-5491-a32c-411882e10c79
  attack_types:
  - Malware/Ransomware
  - Credential Phishing
  detection_methods:
  - Archive analysis
  - File analysis
  source: "type.inbound\nand any(attachments,\n        .file_extension in ('tar', 'iso', 'img', 'cab', 'gadget', 'uue')\n)"
