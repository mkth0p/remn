id: sublime-59915ceb-4d7c-56ba-a28e-ccda8d95b5e2
title: 'Credential theft: Gophish abuse with hidden tracking image'
description: Detects messages containing hidden tracking images with display:none style and tracking parameters in the source
  URL, commonly used for user tracking and engagement monitoring.
severity: high
source: mails
tags:
- sublime
- spam
- evasion
- image-as-content
where:
  any_of:
  - bodyHtml|contains: '<img alt='''' style=''display: none'' src='''
  - bodyHtml|contains: 'img alt="" style="display: none" src="'
  bodyHtml|contains: /track?rid=
sublime:
  id: 59915ceb-4d7c-56ba-a28e-ccda8d95b5e2
  attack_types:
  - Spam
  tactics_and_techniques:
  - Evasion
  - Image as content
  detection_methods:
  - Content analysis
  - HTML analysis
  source: "type.inbound\nand (\n  strings.icontains(body.html.raw,\n                    '<img alt='''' style=''display: none''
    src='''\n  )\n  or strings.icontains(body.html.raw, 'img alt=\"\" style=\"display: none\" src=\"')\n)\nand strings.icontains(body.html.raw,
    '/track?rid=')"
