# Sublime Security - detection rules - generated by tools/import_community_rules.py from sublime-security/sublime-rules@b4fe36890fd9 (2026-09-05). Upstream licence: MIT License (see LICENSE). Do not edit by hand: re-run the import.
id: sublime-1f477050-7558-5fdc-859c-9c8ca9bddae5
title: 'Reconnaissance: Fake real estate inquiry with empty body'
description: Detects inbound messages with no body content — neither plain text nor HTML — but an unusually long subject line
  containing real estate inquiry language. The subject lines impersonate prospective home buyers asking about specific property
  listings or seeking a trusted local real estate agent, often mentioning relocation. These messages are designed to establish
  contact with real estate professionals as a precursor to fraud.
severity: medium
source: mails
tags:
- sublime
- bec-fraud
- social-engineering
where:
  any_of:
  - bodyText|exists: false
  - bodyText: ''
  - bodyText|re: ^(?:^\s*$)$
  any_of_2:
  - bodyHtml|exists: false
  - bodyHtml: ''
  - bodyHtml|re: ^(?:^\s*$)$
  subject|length: '> 150'
  any_of_3:
  - subject|contains: purchase a home
  - subject|re:
    - the listing (?:on|at)
    - (?:interested in|regarding) (?:this|the) property
    - (?:will be|are) relocating
sublime:
  id: 1f477050-7558-5fdc-859c-9c8ca9bddae5
  attack_types:
  - BEC/Fraud
  tactics_and_techniques:
  - Social engineering
  detection_methods:
  - Content analysis
  - Sender analysis
  source: "type.inbound\nand (\n  body.plain.raw is null\n  or body.plain.raw == \"\"\n  or regex.imatch(body.plain.raw, '^\\s*$')\n)\nand
    (\n  body.html.raw is null\n  or body.html.raw == \"\"\n  or regex.imatch(body.html.raw, '^\\s*$')\n)\nand length(subject.base)
    > 150\nand (\n  strings.icontains(subject.base, 'purchase a home')\n  or regex.icontains(subject.base,\n                     'the
    listing (?:on|at)',\n                     '(?:interested in|regarding) (?:this|the) property',\n                     '(?:will
    be|are) relocating'\n  )\n)"
