id: sublime-b347cdbc-a0ee-5901-b61e-356d6ea49d6d
title: 'Reconnaissance: Empty message from uncommon sender'
description: Detects incoming messages that are completely empty, containing no subject line, message body content, or file
  attachments. Such messages may be used for reconnaissance, delivery confirmation, or as part of multi-stage attacks.
severity: low
source: mails
tags:
- sublime
- spam
- evasion
- social-engineering
where:
  subject: ''
  any_of:
  - bodyText|exists: false
  - bodyText: ''
  - bodyText|re: ^(?:^\s*$)$
  any_of_2:
  - bodyHtml|exists: false
  - bodyHtml: ''
  - bodyHtml|re: ^(?:^\s*$)$
  attachmentCount: 0
  senderPrevalence|ne: common
sublime:
  id: b347cdbc-a0ee-5901-b61e-356d6ea49d6d
  attack_types:
  - Spam
  tactics_and_techniques:
  - Evasion
  - Social engineering
  detection_methods:
  - Content analysis
  - Header analysis
  source: "type.inbound\nand subject.base == \"\"\nand (\n  body.plain.raw is null\n  or body.plain.raw == \"\"\n  or regex.imatch(body.plain.raw,
    '^\\s*$')\n)\nand (\n  body.html.raw is null\n  or body.html.raw == \"\"\n  or regex.imatch(body.html.raw, '^\\s*$')\n)\nand
    length(attachments) == 0\nand profile.by_sender().prevalence != \"common\""
