id: sublime-2dc8b3cd-d6d7-52fb-a296-b2840333925b
title: 'Body: PayApp transaction reference pattern'
description: Detects messages containing PayApp transaction reference numbers in a specific format (PayApp# followed by digits)
  in either the message body or subject line.
severity: medium
source: mails
tags:
- sublime
- callback-phishing
- bec-fraud
- impersonation-brand
- social-engineering
where:
  all_of:
  - bodyText|re: PayApp\s?#\d+
  - bodyText|re: '[a-z0-9\.\+\-]+@[a-z0-9\-]+\.'
  - subject|contains: payapp
sublime:
  id: 2dc8b3cd-d6d7-52fb-a296-b2840333925b
  attack_types:
  - Callback Phishing
  - BEC/Fraud
  tactics_and_techniques:
  - 'Impersonation: Brand'
  - Social engineering
  detection_methods:
  - Content analysis
  source: 'type.inbound

    and regex.icontains(body.current_thread.text, ''PayApp\s?#\d+'')

    and regex.icontains(body.current_thread.text, ''[a-z0-9\.\+\-]+@[a-z0-9\-]+\.'')

    and strings.icontains(subject.base, "payapp")'
