id: sublime-de5b26b7-24fa-531a-9906-b4391884d133
title: 'Brand impersonation: Zoom with deceptive link display'
description: Detects messages mentioning Zoom in the subject or body that contain links appearing to go to zoom.us but actually
  redirect to different domains.
severity: medium
source: mails
tags:
- sublime
- credential-phishing
- malware-ransomware
- impersonation-brand
where:
  fromRegistrable|in:
  - aol.com
  - fastmail.com
  - free.fr
  - gmail.com
  - gmx.com
  - gmx.de
  - gmx.fr
  - gmx.net
  - hotmail.com
  - hotmail.fr
  - icloud.com
  - laposte.net
  - live.com
  - live.fr
  - mail.com
  - mail.ru
  - me.com
  - msn.com
  - orange.fr
  - outlook.com
  - outlook.fr
  - proton.me
  - protonmail.com
  - sfr.fr
  - tutanota.com
  - wanadoo.fr
  - web.de
  - yahoo.co.uk
  - yahoo.com
  - yahoo.fr
  - yandex.com
  - yandex.ru
  - zoho.com
  any_of:
  - subject|contains: zoom
  - bodyText|contains: zoom
  urls.url|contains: zoom.us
  urls.domain|nin:
  - zoom.us
  - zoom.com
  urls.text|not_re:
  - (^|@|\.)zoom\.us$
  - (^|@|\.)zoom\.com$
sublime:
  id: de5b26b7-24fa-531a-9906-b4391884d133
  attack_types:
  - Credential Phishing
  - Malware/Ransomware
  tactics_and_techniques:
  - 'Impersonation: Brand'
  detection_methods:
  - Content analysis
  - URL analysis
  source: "type.inbound\nand sender.email.domain.root_domain in $free_email_providers\nand any([subject.base, body.current_thread.text],
    strings.icontains(., \"zoom\"))\nand any(filter(body.current_thread.links,\n               strings.icontains(.href_url.url,
    \"zoom.us\")\n        ),\n        .href_url.domain.root_domain not in (\"zoom.us\", \"zoom.com\")\n        and .display_url.domain.root_domain
    not in (\"zoom.us\", \"zoom.com\")\n)"
