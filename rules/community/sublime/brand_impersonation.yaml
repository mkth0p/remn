id: sublime-39b32b97-80bc-5033-902e-312377cab6e2
title: 'Brand impersonation: Marriott with gift language'
description: Detects messages impersonating Marriott brand that contain gift-related language such as 'appreciation gift',
  'thank you gift', or 'something special' from senders not associated with legitimate Marriott domains.
severity: medium
source: mails
tags:
- sublime
- credential-phishing
- impersonation-brand
- social-engineering
where:
  any_of:
  - subject|contains: marriott
  - fromName|contains: marriott
  - fromName|levenshtein:
    - marriott
    - 2
  any_of_2:
  - bodyText|re:
    - (?:appreciation|thank)(?:\s|-)?(you)?\s+gift
    - something special
    - special.{0,10}thank(?:\s|-)you
  - subject|re:
    - (?:appreciation|thank)(?:\s|-)?(you)?\s+gift
    - something special
    - special.{0,10}thank(?:\s|-)you
  not:
    fromRegistrable|in:
    - marriott.com
    - res-marriott.com
    - email-marriott.com
    - feedback-marriott.com
    - marriotthotels.se
    - bookonline.com
    auth.dmarc: pass
sublime:
  id: 39b32b97-80bc-5033-902e-312377cab6e2
  attack_types:
  - Credential Phishing
  tactics_and_techniques:
  - 'Impersonation: Brand'
  - Social engineering
  detection_methods:
  - Content analysis
  - Header analysis
  - Sender analysis
  source: "type.inbound\nand (\n  strings.icontains(subject.base, \"marriott\")\n  or strings.icontains(sender.display_name,
    \"marriott\")\n  or strings.ilevenshtein(sender.display_name, 'marriott') <= 2\n)\nand any([body.current_thread.text,
    subject.base],\n        regex.icontains(.,\n                        '(?:appreciation|thank)(?:\\s|-)?(you)?\\s+gift',\n
    \                       'something special',\n                        'special.{0,10}thank(?:\\s|-)you'\n        )\n)\nand
    not (\n  sender.email.domain.root_domain in~ (\n    \"marriott.com\",\n    \"res-marriott.com\",\n    \"email-marriott.com\",\n
    \   \"feedback-marriott.com\",\n    \"marriotthotels.se\",\n    \"bookonline.com\"\n  )\n  and coalesce(headers.auth_summary.dmarc.pass,
    false)\n)"
