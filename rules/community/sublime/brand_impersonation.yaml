id: sublime-e6139052-6ec8-5d3c-91e1-13ab1ae2d536
title: 'Brand impersonation: Xodo Sign'
description: Detects messages impersonating Xodo Sign with 'Processed by Xodo Sign' text from unauthorized senders that fail
  DMARC authentication.
severity: medium
source: mails
tags:
- sublime
- credential-phishing
- impersonation-brand
- social-engineering
where:
  bodyText|contains: processed by xodo sign
  not:
    fromRegistrable: eversign.com
    auth.dmarc: pass
sublime:
  id: e6139052-6ec8-5d3c-91e1-13ab1ae2d536
  attack_types:
  - Credential Phishing
  tactics_and_techniques:
  - 'Impersonation: Brand'
  - Social engineering
  detection_methods:
  - Content analysis
