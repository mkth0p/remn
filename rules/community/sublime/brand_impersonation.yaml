# Sublime Security - detection rules - generated by tools/import_community_rules.py from sublime-security/sublime-rules@b4fe36890fd9 (2026-09-05). Upstream licence: MIT License (see LICENSE). Do not edit by hand: re-run the import.
id: sublime-203a6a28-d569-590a-9551-24b4b716b469
title: 'Brand impersonation: Enbridge'
description: Impersonation of the Canadian energy company Enbridge.
severity: medium
source: mails
tags:
- sublime
- bec-fraud
- credential-phishing
- impersonation-brand
- social-engineering
where:
  any_of:
  - fromName|contains: enbridge
  - fromDomain|contains: enbridge
  - subject|contains: enbridge
  urls.text|contains_any:
  - pay now
  - view your bill
  any_of_2:
  - references|exists: false
  - inReplyTo|exists: false
  fromRegistrable|nin:
  - enbridge.com
  - enbridgegas.com
  - domenergyoheb.com
  - domenergyuteb.com
sublime:
  id: 203a6a28-d569-590a-9551-24b4b716b469
  attack_types:
  - BEC/Fraud
  - Credential Phishing
  tactics_and_techniques:
  - 'Impersonation: Brand'
  - Social engineering
  detection_methods:
  - Content analysis
  - Header analysis
  - Sender analysis
  source: "type.inbound\nand (\n  strings.ilike(sender.display_name, '*enbridge*')\n  or strings.ilike(sender.email.domain.domain,
    '*enbridge*')\n  or strings.ilike(subject.subject, '*enbridge*')\n)\nand any(body.links,\n        strings.ilike(.display_text,
    \"*pay now*\", \"*view your bill*\")\n)\n// negate replies\nand (length(headers.references) == 0 or headers.in_reply_to
    is null)\nand sender.email.domain.root_domain not in~ (\n  'enbridge.com',\n  'enbridgegas.com',\n  // Enbridge Subsidiaries\n
    \ 'domenergyoheb.com', // Dominion Energy Ohio\n  'domenergyuteb.com' // Dominion Energy Utah\n)"
