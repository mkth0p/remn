# Apache in front of the container started by docker-compose.open.yml.
#
# Debian / Ubuntu:  copy to /etc/apache2/sites-available/remn.conf, then
#   sudo a2enmod proxy proxy_http && sudo a2ensite remn && sudo systemctl reload apache2
# RHEL / Rocky / Alma:  copy to /etc/httpd/conf.d/remn.conf, then
#   sudo setsebool -P httpd_can_network_connect 1 && sudo systemctl reload httpd
#
# The application must sit at the root of the host name: under a sub-path its script and API
# paths, which start at /, are not found. Put your own access control (auth, allow lists, TLS)
# in this virtual host; the container behind it checks nothing.
<VirtualHost *:80>
    ServerName forensics.example

    ProxyPass        "/" "http://127.0.0.1:8300/" timeout=600
    ProxyPassReverse "/" "http://127.0.0.1:8300/"
    # if progress bars stop updating, streamed responses are being held back: add flushpackets=on
    # after timeout=600 on the ProxyPass line
</VirtualHost>
