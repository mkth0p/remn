name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (pytest, ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt -r backend/requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Format check
        run: ruff format --check .
      - name: Tests
        run: pytest -q
      - name: Archive simulator tests
        run: python -m unittest honeypot.test_archive -q

  frontend:
    name: frontend (typecheck, lint, vitest, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Format check
        run: npm run format:check
      - name: Tests
        run: npm test -- --pool=threads
      - name: Build
        run: npx vite build
      - name: Bundle size
        run: |
          size=$(stat -c %s dist/assets/index-*.js | sort -n | tail -1)
          echo "largest bundle: $size bytes"
          test "$size" -lt 2000000

  image:
    name: image (build, scan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: docker build --pull -t remn:ci .
      - name: Serves
        run: |
          docker run -d --name remn -p 127.0.0.1:8000:8000 remn:ci
          for i in $(seq 1 20); do curl -fs -H "X-Forensic-Client: 1" http://127.0.0.1:8000/api/health > /dev/null && break; sleep 2; done
          curl -fs -H "X-Forensic-Client: 1" http://127.0.0.1:8000/api/health | head -c 200; echo
          docker rm -f remn
      - name: Archive isolation and routing
        run: |
          docker tag remn:ci remn:latest
          docker build -t remn-archive honeypot
          python3 tools/validate_honeypot.py
      # pip is not in the runtime image, but Trivy records the libraries pip vendors (msgpack, setuptools, ...)
      # from the base layer without a file path, so their removal in a later layer is invisible to it;
      # the pip directory is skipped for that reason and no other
      - name: Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: remn:ci
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          skip-dirs: usr/local/lib/python3.13/site-packages/pip
          exit-code: "1"

  browser:
    name: browser (upload, review, restore)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -r backend/requirements.txt
      - run: npm ci && npm run build && npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npx playwright test
        working-directory: frontend
        env:
          REMN_TEST_PYTHON: python
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: frontend/test-results/
