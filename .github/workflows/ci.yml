name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (pytest, ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt -r backend/requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Format check
        run: ruff format --check .
      - name: Tests
        run: pytest -q
      - name: Archive simulator tests
        run: python -m unittest honeypot.test_archive -q

  frontend:
    name: frontend (typecheck, lint, vitest, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Format check
        run: npm run format:check
      - name: Tests
        run: npm test -- --pool=threads
      - name: Build
        run: npx vite build
      - name: Bundle size
        run: |
          size=$(stat -c %s dist/assets/index-*.js | sort -n | tail -1)
          echo "largest bundle: $size bytes"
          test "$size" -lt 2000000

  evtx-wasm:
    name: EVTX decoder (WebAssembly, reproducible)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Rebuild from source with the pinned toolchain
        # rust-toolchain.toml names the toolchain; rustup installs it with the wasm target
        run: |
          rustup toolchain install
          sh build.sh
        working-directory: frontend/wasm/evtx
      - name: The committed decoder is the one this source builds
        run: git diff --exit-code --stat -- frontend/src/parsers/evtx/evtx.wasm

  image:
    name: image (build, scan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: docker build --pull -t remn:ci .
      - name: Serves
        run: |
          docker run -d --name remn -p 127.0.0.1:8000:8000 remn:ci
          for i in $(seq 1 20); do curl -fs -H "X-Forensic-Client: 1" http://127.0.0.1:8000/api/health > /dev/null && break; sleep 2; done
          curl -fs -H "X-Forensic-Client: 1" http://127.0.0.1:8000/api/health | head -c 200; echo
          docker rm -f remn
      # the public profile's proxy image: it serves the app with the page headers and sends /api/* on
      - name: Public proxy serves the app
        run: |
          docker build -t remn-static:ci --target static .
          docker run -d --name proxy -e REMN_DOMAIN=:8080 -p 127.0.0.1:8080:8080 -v "$PWD/deploy:/etc/caddy/site:ro" remn-static:ci \
            caddy run --config /etc/caddy/site/Caddyfile --adapter caddyfile
          for i in $(seq 1 20); do curl -fs http://127.0.0.1:8080/ > /dev/null && break; sleep 1; done
          curl -fsI http://127.0.0.1:8080/cases/1 | tee /dev/stderr | grep -qi "^content-security-policy: default-src 'self'"
          curl -fsI http://127.0.0.1:8080/cases/1 | grep -qi "^cache-control: no-store"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/robots.txt)" = 404
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/assets/missing.js)" = 404
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/favicon.ico)" = 200
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8080/cases/1)" = 405
          # no parser behind it here: the API path reaches the proxy's upstream, not a file
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/api/health)" = 502
          docker rm -f proxy
      - name: Archive isolation and routing
        run: |
          docker tag remn:ci remn:latest
          # the public compose file names its proxy image remn-static; it was built above as remn-static:ci
          docker tag remn-static:ci remn-static:latest
          docker build -t remn-archive honeypot
          python3 tools/validate_honeypot.py
      # pip is not in the runtime image, but Trivy records the libraries pip vendors (msgpack, setuptools, ...)
      # from the base layer without a file path, so their removal in a later layer is invisible to it;
      # the pip directory is skipped for that reason and no other
      - name: Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: remn:ci
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          skip-dirs: usr/local/lib/python3.13/site-packages/pip
          exit-code: "1"

  browser:
    name: browser (upload, review, restore)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -r backend/requirements.txt
      - run: npm ci && npm run build && npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npx playwright test
        working-directory: frontend
        env:
          REMN_TEST_PYTHON: python
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: frontend/test-results/

  # Public attack logs, one technique per file: what the rules must keep detecting, and the two
  # engines finding the same thing on real data. Run here rather than on workstations, where
  # endpoint protection quarantines the library.
  attack-samples:
    name: attack samples (EVTX-ATTACK-SAMPLES, both engines)
    runs-on: ubuntu-latest
    env:
      LIBRARY_SHA: 4ceed2f4706daf601c212a8f91c113dd85349a2c
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -r backend/requirements.txt
      - name: Library
        run: |
          git clone --quiet https://github.com/sbousseaden/EVTX-ATTACK-SAMPLES "$RUNNER_TEMP/library"
          git -C "$RUNNER_TEMP/library" checkout --quiet "$LIBRARY_SHA"
      - name: Parse and run the rules (SQL engine), check the expected detections
        run: python tools/evtx_attack_samples.py --library "$RUNNER_TEMP/library" --out "$RUNNER_TEMP/attack"
      - run: npm ci
        working-directory: frontend
      - name: Browser engine, key for key against the SQL engine
        run: npx vitest run src/rules/attackSamples.test.ts
        working-directory: frontend
        env:
          EVTX_ATTACK_OUT: ${{ runner.temp }}/attack
      - name: EVTX parsed in the browser, row for row against the server's parser
        run: |
          python ../samples/synthetic/make_linked_lab.py --quick-only --out "$RUNNER_TEMP/lab"
          REMN_EVTX_LAB="$RUNNER_TEMP/lab/quick-start" npx vitest run src/parsers/evtx
        working-directory: frontend
        env:
          EVTX_ATTACK_OUT: ${{ runner.temp }}/attack
          EVTX_ATTACK_LIBRARY: ${{ runner.temp }}/library
