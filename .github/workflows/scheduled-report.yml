name: Scheduled run report

# The nightly CI run and the weekly rule measures exist to find a break nobody caused by a commit:
# a release upstream, a base image, a data source. A red run on a schedule sends no notification
# that anyone has to answer, so it is turned into an issue: opened on the first failure, added to
# while it lasts, closed by the first run that passes. One issue per workflow, never more.
on:
  workflow_run:
    workflows: ["CI", "Rule measures"]
    types: [completed]

permissions:
  contents: read

jobs:
  report:
    name: open, update or close the issue of a scheduled run
    # runs of pull requests and pushes report on their own commit; only the scheduled ones are silent
    if: github.event.workflow_run.event == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          WORKFLOW: ${{ github.event.workflow_run.name }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          title="Scheduled run failing: $WORKFLOW"
          number=$(gh issue list --state open --limit 100 --json number,title --jq "map(select(.title == \"$title\")) | .[0].number // empty")
          case "$CONCLUSION" in
            success)
              if [ -n "$number" ]; then gh issue close "$number" --comment "Passing again: $RUN_URL"; fi ;;
            failure | timed_out | startup_failure)
              if [ -n "$number" ]; then
                gh issue comment "$number" --body "Still failing: $RUN_URL"
              else
                gh issue create --title "$title" --body "The scheduled run of the $WORKFLOW workflow failed: $RUN_URL

          Nothing was pushed for this run, so the cause is outside the last commit: a dependency released upstream, a base image, an action or a dataset. CONTRIBUTING.md says how the dependency locks are refreshed. This issue is closed by the next scheduled run that passes."
              fi ;;
          esac
