version: 2
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      javascript:
        patterns: ["*"]
    ignore:
      # a new TypeScript major has to wait for typescript-eslint to accept it
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # js-yaml 5 changed its module shape; the rule loader and its tests are written against 4
      - dependency-name: js-yaml
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      # the project targets Python 3.13 (the venv, CI, the optional PST and YARA wheels) and Node 22 LTS;
      # digest refreshes of those tags still come through, a change of version is a decision, not a bump
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: node
        update-types: ["version-update:semver-major"]
