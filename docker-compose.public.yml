# An instance open to people you do not know: browser-only mode, with Caddy in front for HTTPS.
#
#   REMN_DOMAIN=remn.example.tech docker compose -f docker-compose.public.yml up -d --build
#
# The name must already point at this machine (an A or AAAA record) and ports 80 and 443 must be
# reachable, so that Caddy can obtain and renew its certificate. The application container is not
# published at all; Caddy reaches it on the compose network.
#
# What the server does here: parse evidence and return rows, run rules and correlation, serve the
# rule packs and the prompt bundle for the analyst's own model. What it refuses: server stores,
# chunked uploads, jobs, reputation lookups, server-side models. Every case stays in the visitor's
# browser, the server keeps nothing. Each address gets REMN_RATE_LIMIT heavy requests a minute and
# uploads are capped at REMN_MAX_UPLOAD_MB. See docs/security.md.
services:
  remn:
    build:
      context: .
      args:
        EXTRA_PIP: ${REMN_EXTRA_PIP:-yara-python libpff-python}
    image: remn
    environment:
      FORENSIC_BROWSER_ONLY: "1"
      FORENSIC_TRUST_PROXY: "1"
      FORENSIC_RATE_LIMIT_PER_MIN: ${REMN_RATE_LIMIT:-60}
      FORENSIC_MAX_UPLOAD_MB: ${REMN_MAX_UPLOAD_MB:-512}
      FORENSIC_ALLOWED_HOSTS: ${REMN_DOMAIN:?set REMN_DOMAIN to the name browsers will use}
      FORENSIC_AUTH_TOKEN: ""
      CLAUDE_CODE_ENABLED: "0"
      # staging lives in RAM here, so keep the budget inside the tmpfs below
      FORENSIC_TMP_MAX_GB: ${REMN_TMP_MAX_GB:-1}
      # one parse may hold a worker thread this long, then it is ended with what it has
      FORENSIC_INGEST_MAX_S: ${REMN_INGEST_MAX_S:-1800}
    # This is the process that runs attacker-controlled EVTX, PST, OLE and registry hives through
    # libpff, the EVTX reader and oletools: the most CVE-prone libraries in the stack. It cannot be
    # made unexploitable, so it is made to be worth little. Nothing here changes what it can parse.
    networks:
      # No route off the host. In browser-only mode the application makes no outbound calls at all:
      # reputation lookups, Ollama and Claude are closed, and the domain parser uses a bundled
      # suffix list rather than fetching one. So an exploited parser has nowhere to send anything
      # and nothing to fetch a second stage from.
      - parse
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 256
    mem_limit: ${REMN_MEM_LIMIT:-2g}
    tmpfs:
      # Evidence in transit never reaches physical disk, and cannot survive a restart even in
      # principle. Sized to hold one upload at the 512 MiB ceiling with room to parse it.
      - /app/backend/tmp:rw,noexec,nosuid,nodev,size=${REMN_TMP_SIZE:-1g},uid=1000,gid=1000,mode=0700
      - /tmp:rw,noexec,nosuid,nodev,size=64m,uid=1000,gid=1000,mode=0700
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    # Caddy sits on both: the internet for certificates and visitors, the internal network to
    # reach the parser. It is the only thing here that can talk to either.
    networks:
      - edge
      - parse
    ports:
      - "${REMN_HTTP_PORT:-80}:80"
      - "${REMN_HTTPS_PORT:-443}:443"
    environment:
      REMN_DOMAIN: ${REMN_DOMAIN:?set REMN_DOMAIN to the name browsers will use}
    volumes:
      # The directory, not the file. Docker binds a single file by inode, and git pull writes a
      # new file, so the container kept reading the old Caddyfile until it was recreated. A
      # directory bind sees the new file, and caddy reload picks it up.
      - ./deploy:/etc/caddy/site:ro
      - caddy-data:/data
      - caddy-config:/config
    command: ["caddy", "run", "--config", "/etc/caddy/site/Caddyfile", "--adapter", "caddyfile"]
    depends_on:
      - remn
    restart: unless-stopped

networks:
  edge: {}
  # No gateway: containers on this network can reach each other and nothing else.
  parse:
    internal: true

volumes:
  caddy-data:
  caddy-config:
